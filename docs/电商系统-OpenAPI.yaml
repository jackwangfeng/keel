# =============================================================================
#  开源电商系统 · OpenAPI 3.1 契约
#
#  设计约定（与数据模型文档一致）：
#   1. 金额一律 integer(int64)，单位「分」，字段名后缀 _cents
#   2. 时间一律 RFC3339 带时区字符串（UTC），字段名后缀 _at
#   3. 不使用 {code,message,data} 信封包装 —— 用 HTTP 状态码表达结果，
#      错误体遵循 RFC 9457 Problem Details。理由：信封包装让所有响应都是
#      200，破坏了 HTTP 语义，也让代码生成出来的客户端必须手写拆包逻辑。
#   4. 订单/支付/退款用不可枚举业务编号（order_no / payment_no / refund_no），
#      其余对象对外用自增 id。越权防护靠服务端按 user_id 强制过滤，
#      不靠编号不可猜 —— 详见数据模型文档 §1
#   5. 写操作幂等：POST 类接口接受 Idempotency-Key 头
#   6. 后台接口一律挂在 /admin/ 前缀下 —— Admin tag 要求「与前台 C 端接口
#      分开鉴权与限流」，而按路径前缀挂中间件是最省事的落地方式
# =============================================================================
openapi: 3.1.0
info:
  title: Commerce API
  version: 0.1.0
  description: |
    Open-source commerce platform API.
    AI-native: semantic search & conversational shopping assistant run on
    a self-hosted inference engine — no external API calls, no data egress.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080/api/v1
    description: 本地（单商家；租户由 KEEL_DEFAULT_MERCHANT 指定，请求不必携带任何东西）
  - url: https://api.example.com/v1
    description: Production
  - url: https://{shop}.example.com/api/v1
    description: >-
      多商家；租户由子域名确定，子域名锚定平台基础域名 KEEL_BASE_DOMAIN。
      商家也可绑定自己的域名（shop_settings.domain），此时整个域名就是入口。
      租户定位是部署配置，不改变任何路径，请求也不携带任何标识租户的头。
      **唯一的例外在后台**：平台级会话可以用 `X-Keel-Merchant` 头切换要管理的
      商家（见 components/parameters/KeelMerchant）。它的前提是平台级鉴权，
      公开接口与买家接口一律不读这个头。
    variables:
      shop:
        default: demo
        description: 商家的 code

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 认证与令牌签发（含微信小程序 openid 登录）
  - name: User
    description: 用户资料、第三方身份绑定与收货地址簿
  - name: Catalog
    description: 商品与分类
  - name: Search
    description: 语义检索与对话导购
  - name: Cart
  - name: Order
  - name: Payment
  - name: Refund
    description: 退款与售后（买家侧）
  - name: Admin
    description: |
      后台 API（运营 / 客服使用）。与前台 C 端接口分开鉴权与限流，
      在此契约中占位是为了让状态机的每一条边都有明确的触发入口，
      避免实现时各写各的。
  - name: AdminAuth
    description: |
      后台认证。**整个后台没有密码**——认证走 token，找回走邮箱。

      两级身份：平台级操作员（能建商家、跨租户运维）与商家级操作员
      （只看得见自己那一份数据）。详见数据模型 §14。
  - name: Notification
    description: |
      消息通知：买家消息中心（`/me/notifications`）与后台待办提醒（`/admin/notifications`）。
      通知在订单 / 售后状态变化的**同一个事务**里写入（数据模型 §16 的 outbox），
      标题与正文由服务端渲染。外发渠道（微信订阅消息 / 短信 / 邮件）本期未接，
      投递记录里记为「未配置、跳过」。
  - name: Upload
    description: 文件上传（商品图 / 头像 / 退款凭证）
  - name: Store
    description: |
      门店与电子围栏。买家侧只有「列出门店」与「按位置选店」两条；
      后台侧在 `/admin/stores` 与 `/admin/regions` 下。

      **「当前门店」在这个契约里永远有一个确定的值**，解析链是
      「客户端显式给的 `store_id` > 按位置解析出的门店 > 默认门店」，
      三级都落空才是「不在服务范围」。数据模型 §4 是它的真相源。
  - name: Coupon
    description: |
      优惠券：我的券、本单可用券、领券中心（买家侧）；券模板、适用范围、定向发放（后台侧）。
      两种发券方式都有：买家在领券中心自己领（受总量与每人限领约束），
      商家在后台按手机号定向发放。计算规则与状态机见数据模型 §7。
  - name: Freight
    description: |
      运费模板（后台侧）。买家侧没有单独的接口：运费在 `POST /orders/preview`、
      `POST /orders`、`GET /cart` 里按收货地址算好返回。计算规则见数据模型 §7「运费怎么算」。

# =============================================================================
paths:

  # ---------------------------------------------------------------- Auth
  /auth/wechat/login:
    post:
      tags: [Auth]
      summary: 微信登录（小程序 / 公众号）
      description: |
        小程序 `wx.login` 拿到的 `code` 换 openid / unionid，
        命中 `user_identities(provider, external_id)` 则登录，未命中则
        **首登即注册**（同事务建 `users` + `user_identities`），`is_new_user=true`。

        `external_id`（openid）与 `union_id` 属于渠道敏感标识，**一律不对外返回**。

        边界：小程序先授权、后绑手机号时，可能撞上一个已存在的手机号账号。
        一期不做账号自动合并，直接返回 409 提示用户换绑 —— 见数据模型文档 §8。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 返回的临时登录凭证，一次性
                provider:
                  $ref: '#/components/schemas/IdentityProvider'
                  default: 1
                encrypted_data:
                  type: string
                  description: 可选。getUserProfile 的加密数据，用于同步昵称头像
                iv:
                  type: string
                  description: 与 encrypted_data 配套的初始向量
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: code 无效或已被使用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            该微信身份关联的手机号已属于另一账号，需用户手动换绑。
            type=https://keel.dev/problems/identity-conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/sms/code:
    post:
      tags: [Auth]
      summary: 发送短信验证码
      description: 同一手机号与同一 IP 均有频次限制，超限返回 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 国内手机号 }
                scene:
                  type: string
                  enum: [login, bind_phone]
                  default: login
      responses:
        '204': { description: 已发送 }
        '422':
          description: 手机号格式不合法
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            发送过于频繁。type=https://keel.dev/problems/rate-limited
          headers:
            Retry-After:
              description: 建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 手机号登录（验证码 / 密码）
      description: |
        `code` 与 `password` 二选一。`users.password_hash` 可空 ——
        仅第三方登录的用户没有密码，只能走验证码，此时传 `password` 返回 401。

        验证码登录且手机号未注册时**首登即注册**，`is_new_user=true`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:    { type: string }
                code:     { type: string, description: 短信验证码 }
                password: { type: string, format: password }
              oneOf:
                - required: [code]
                - required: [password]
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: 验证码错误 / 密码错误 / 该账号未设置密码
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            账号已封禁或已注销（对应 users.status = 2 / 3）。
            type=https://keel.dev/problems/account-disabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: refresh_token 无效或已过期，需重新登录
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: 服务端吊销当前 refresh_token；access_token 到期自然失效。
      responses:
        '204': { description: No Content }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- AdminAuth
  /admin/auth/bootstrap:
    post:
      tags: [AdminAuth]
      security: []
      summary: 用引导 token 换会话
      description: |
        仅在**库里一个 staff 都没有**时，首次启动会创建平台级管理员并生成一个
        一次性引导 token，**明文打印到容器 stdout**，24 小时有效。

        > 为什么打印到 stdout 而不是发邮件：全新部署时 SMTP 大概率还没配。
        > 如果登录唯一入口是邮件，操作员第一次就进不去后台——而本项目的卖点是
        > `docker compose up` 一条命令。Jupyter 和 Gitea 都这么做。
        >
        > 代价是容器日志里会短暂出现一个高权限凭据，所以它用掉即失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email]
              properties:
                token: { type: string, description: stdout 里那一串 }
                email: { type: string, format: email, description: 补全自己的邮箱，后续找回用 }
      responses:
        '200':
          description: 换到会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401':
          description: token 无效、已过期或已被使用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 已经有 staff 了，引导通道已关闭
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/auth/email-link:
    post:
      tags: [AdminAuth]
      security: []
      summary: 申请邮箱登录链接
      description: |
        发一封带一次性 token 的信，15 分钟有效。

        **无论邮箱是否存在都返回 202**——用返回值区分「这个邮箱注册过没有」
        等于送给攻击者一个账号枚举接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: 已受理。邮箱存在与否不在响应里区分
        '429':
          description: 触发频控
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/auth/session:
    post:
      tags: [AdminAuth]
      security: []
      summary: 用邮件链接里的 token 换会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 换到会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401':
          description: token 无效、已过期或已被使用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/me:
    get:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [AdminAuth]
      summary: 当前后台身份
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/merchants:
    get:
      tags: [Admin]
      summary: 商家列表（仅平台级）
      description: |
        平台级操作员看见的全部商家，**含停用（`status = 2`）与待审核（`status = 3`）的**。
        不含停用的话，平台就没有任何入口把一家停掉的店启用回来。
        软删的不返回 —— 一期没有恢复接口。

        商家级员工调用返回 403（`https://keel.dev/problems/platform-only`）：
        店的列表是这个部署的全貌，不是任何一家店该看见的东西。

        响应里的 `single_merchant_mode` 回答「这套部署能不能再开店」——
        后台据此把「开店」按钮置灰并说明原因，而不是让人点了才知道。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantList' }
        '403':
          description: 调用者不是平台级操作员
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: 开店（仅平台级管理员）
      description: |
        建商家，并为其创建第一个商家级管理员，给该邮箱发登录链接。

        调用者必须是平台级（`merchant_id` 为空）且 `role = 1`，否则 403。

        **单商家部署（配了 `KEEL_DEFAULT_MERCHANT`）里拒绝开店**，返回 409
        `https://keel.dev/problems/single-merchant-mode`。单商家部署忽略 Host，
        所有请求都落在默认商家上：新开的店谁也访问不到，而且启动自检
        （活跃商家必须恰好一家）会让这套部署**下一次重启就起不来**。
        要开多家店，先切到多商家部署：清空 `KEEL_DEFAULT_MERCHANT`、配置 `KEEL_BASE_DOMAIN`。

        **幂等**（v0.1.0 之后）：同一个平台管理员拿同一把 `Idempotency-Key` 重发，
        回放首次的 `201` 与那一份 `Merchant`，带 `Idempotency-Replayed: true`，
        不会再建店，**也不会再给新店管理员签第二条登录链接**。
        幂等记录属于平台作用域，任何商家级会话都读写不到它。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantCreateRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '403':
          description: 调用者不是平台级管理员
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 `type` 区分：

            · code 已被占用 —— `https://keel.dev/problems/merchant-code-taken`
            · 这是一套单商家部署，不能开第二家店 ——
              `https://keel.dev/problems/single-merchant-mode`。换个 code 重试没有用，
              要改的是部署形态（见上面的描述）
            · 同一 Idempotency-Key 正在处理中 ——
              `https://keel.dev/problems/idempotency-key-in-flight`
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/merchants/{merchant_id}:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    get:
      tags: [Admin]
      summary: 商家详情（仅平台级）
      description: 含停用与待审核的；软删的 404。商家级员工 403。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '403':
          description: 调用者不是平台级操作员
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 商家不存在或已软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Admin]
      summary: 改名、停用或启用商家（仅平台级管理员）
      description: |
        调用者必须是平台级且 `role = 1`，否则 403（与开店同一条门槛）。

        · **停用（`status = 2`）**：买家侧对这家店的全部请求随之 404
          （租户解析只认 `status = 1`，解析结果最多缓存 30 秒，所以生效最多延迟半分钟）。
          平台管理员仍然能用 `X-Keel-Merchant` 切进去 —— 要进得去才修得好、再启用。
        · **启用（`status = 1`）**：反过来。
        · 不能把商家改成 `3 待审核`：审核流程本轮不存在，给它一条写入路径只会造出
          一个谁也推不动的状态。

        **单商家部署里停用默认商家会被拒绝**（409 `single-merchant-mode`）：
        那是这套部署唯一一家店，停掉之后启动自检过不了，下次重启就起不来。

        写入不改 `merchants` 那一行：应用角色在 merchants 上没有 UPDATE
        （给了就等于任何租户上下文都能改商家目录）。每次修改在平台作用域里
        追加一行 `merchant_revisions`，当前的名字与状态取最新一行 ——
        见数据模型 §2 与迁移 00024 的文件头。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merchant' }
        '403':
          description: 调用者不是平台级管理员
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 商家不存在或已软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            单商家部署里停用默认商家 —— `https://keel.dev/problems/single-merchant-mode`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 一个字段都没传、名字为空，或 `status` 不是 1 / 2
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/staff:
    get:
      tags: [Admin]
      summary: 员工列表
      description: |
        平台级看见平台操作员，商家级只看见自己店的。

        同一租户内再按角色收窄：商家管理员与操作员看见本店全部员工；
        **大区管理员**只看见自己，以及「只管本大区门店」的门店管理员；
        **门店管理员**只看见自己。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Staff' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      summary: 加员工（管理员；大区管理员只能加本大区门店的门店管理员）
      description: |
        新员工的租户归属**从调用者的会话继承，不接受请求体传入**。

        谁能加谁：商家管理员能加本店任何角色；**大区管理员只能加门店管理员
        （role 4），且 `store_ids` 里每一家门店都必须在他的大区里**；
        操作员与门店管理员不能加员工。平台管理员只能加平台级的管理员 / 操作员
        （role 1 / 2，不带范围）。

        角色与范围必须配套：role 3 必须带至少一个 `region_ids`、不带 `store_ids`；
        role 4 必须带至少一个 `store_ids`、不带 `region_ids`；role 1 / 2 两者都不带。
        不配套、或引用了不存在 / 已软删的大区门店，回 422。

        > 允许前端指定 `merchant_id` 等于把越权做成了一个入参。
        > 这条是多租户系统里最容易出事的地方，所以写在契约里而不只写在代码里。

        建好后给该邮箱发一次性登录链接，对方点开即完成首次登录。**不设密码。**

        **幂等**（v0.1.0 之后）：同一个调用者拿同一把 `Idempotency-Key` 重发，
        回放首次的 `201` 与那一份 `Staff`，带 `Idempotency-Replayed: true`，
        不会再建人，**也不会再签第二条登录链接**。平台管理员与商家管理员都有幂等，
        语义一致；幂等记录落在调用者自己的作用域里 —— 平台管理员的记录任何
        商家级会话都读写不到，反之亦然。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreateRequest' }
      responses:
        '201':
          description: 已创建并已发出登录链接（重放时不再发）
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '403':
          description: |
            调用者不能加这个员工：不是管理员（staff-forbidden）、大区管理员想加
            门店管理员之外的角色（role-forbidden）、或分配了不在他大区里的门店
            （out-of-scope）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 `type` 区分：

            · 该租户内邮箱已存在 —— `https://keel.dev/problems/staff-email-taken`
            · 同一 Idempotency-Key 正在处理中 ——
              `https://keel.dev/problems/idempotency-key-in-flight`
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/staff/{staff_id}:
    patch:
      tags: [Admin]
      summary: 改员工角色、状态或管辖范围（管理员；大区管理员只能改本大区的门店管理员）
      description: |
        只能改同租户内的人。**不能把最后一个在职管理员降级或停用**——
        那会让该租户失去全部管理能力，返回 409。

        `region_ids` / `store_ids` 给了就是**整体替换**，不给就不动；把角色改成
        1 / 2 时范围自动清空。改完之后角色与范围必须配套（规则同 `POST /admin/staff`），
        否则 422。

        **任何人都不能改自己的角色或范围**（403 role-forbidden）——
        否则一个大区管理员能给自己加大区，一个管理员能在降级别人之前先把自己
        换成一个没有人能再改回来的状态。

        大区管理员只能改「只管本大区门店」的门店管理员：新角色只能是 4，
        新的 `store_ids` 必须全在他的大区里；目标管着别的大区的门店时同样 403。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - name: staff_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role:   { $ref: '#/components/schemas/StaffRole' }
                status: { type: integer, enum: [1, 2], description: '1 正常 2 停用' }
                region_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: 大区管理员管的大区，整体替换
                store_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: 门店管理员管的门店，整体替换
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Staff' }
        '403':
          description: |
            调用者不是管理员（staff-forbidden）、改的是自己的角色或范围 / 大区管理员
            想改出门店管理员之外的角色（role-forbidden）、或目标 / 新范围不在他的
            大区里（out-of-scope）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 会导致该租户没有在职管理员
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/staff/{staff_id}/login-token:
    post:
      tags: [Admin]
      summary: 给已有员工重签一次性登录 token（管理员；大区管理员只能给本大区的门店管理员签）
      description: |
        员工会话 7 天过期之后，唯一的重新登录办法是一串一次性登录 token 去换
        `POST /admin/auth/session`。而邮箱登录链接（`POST /admin/auth/email-link`）
        本轮没有邮件服务、回 501，新建员工时签的那一串 15 分钟就过期 —— 没有这条接口，
        员工过期之后只能删了重建。

        签出来的与新建员工时那一串**同一种**：一次性、15 分钟有效、用掉即失效，
        拿去换 `POST /admin/auth/session`。签发时**作废这个人此前还没用掉的登录链接
        token**，所以重复调用的结果是「只有最新那一串有效」，与只调一次等价 ——
        这条接口因此不接受 `Idempotency-Key`（存档重放会让 token 明文进库）。

        **谁能签谁，与 `PATCH /admin/staff/{staff_id}` 完全一致**：能改这个人的，
        才能给他签。商家管理员能给本店任何人签（包括自己）；大区管理员只能给「只管
        本大区门店」的门店管理员签，不能给自己、也不能给管理员 / 操作员 / 别的大区
        管理员签；操作员与门店管理员不能签；平台管理员只能给平台级的人签。
        别的租户的人一律 404（与 PATCH 同一条约定）。

        **停用的员工不能签**（409 `staff-disabled`）：先启用，再签。

        > **token 明文会出现在响应体里**，这是与新建员工那条的唯一差别，而且是刻意的：
        > 没有邮件服务时，管理员拿到它才能通过别的渠道交给本人。代价是签发人在这
        > 15 分钟里能以对方的身份登录一次 —— 而签发人本来就能改对方的角色与状态，
        > 权限按构造不高于签发人。它同时照旧打进进程日志，方便运维追查是谁在什么时候
        > 给谁签过。接上邮件服务之后，这条接口应当改成直接发信、不再回明文。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - name: staff_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '201':
          description: 已签发（此前没用掉的登录链接 token 同时作废）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffLoginToken' }
        '403':
          description: |
            调用者不能给这个人签：不是管理员（staff-forbidden）、大区管理员想给门店管理员
            之外的人或自己签（role-forbidden）、或目标不归他管（out-of-scope）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 员工不存在、已软删，或不在调用者的租户里
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 员工已停用 —— `https://keel.dev/problems/staff-disabled`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ======================================================= Admin · 商家自助发布
  #
  # 这一整段是 M4 补的。此前 /admin/ 下只有「店已经开起来之后的运营动作」——
  # 身份、建店、员工、发货、退款审核；而发布商品、改价、上下架、管类目、传图
  # 一条都没有。也就是说商家能处理订单，却没法上架商品，类目只能从种子来。
  # 那不是实现欠账，是设计阶段漏了一整块（见总体架构 §13 路线图旁的注）。
  #
  # 五条贯穿本段的约定，写在这里免得每个端点重复一遍：
  #
  #  1. **鉴权与既有的 9 条 /admin/ 路径完全一致**：继承文件顶部的 `bearerAuth`，
  #     但那里放的是 staff 会话 token（数据模型 §14），不是买家的那一个。
  #     按路径前缀挂中间件，正是文件头约定 6 存在的全部理由。
  #  2. **租户归属从会话继承，请求体里没有 merchant_id**，与 StaffCreateRequest
  #     同理：允许前端指定租户，等于把越权做成了一个入参。
  #  3. **查不到当前租户名下的那一个，一律 404，不是 403。** 403 会让自增 id
  #     空间变成一个跨租户的存在性探针——「这个 id 存在但不是你的」本身就是
  #     一条不该泄露的信息。
  #  4. **派生字段一概不接受写入**：products 的 min_price_cents /
  #     max_price_cents / total_stock / sales_count 由 SKU 与订单变更时同步
  #     （数据模型 §3），categories 的 path / level 由 parent_id 算出。
  #     它们出现在响应里，不出现在任何一个请求体里。
  #  5. **状态语义沿用数据模型，不另发明一套**：products.status 是
  #     0 草稿 / 1 上架 / 2 下架，published_at 是首次上架时间，deleted_at 是软删。
  #     契约里没有第四个状态，也没有「回到草稿」这条边。
  #  6. **同一租户内的分级权限（v0.1.0 起）走 403，与约定 3 不冲突。** 角色与
  #     管辖范围见 StaffRole 的描述。约定 3 挡的是「跨租户的存在性探针」，而这里
  #     的目标就在调用者自己的租户里 —— 403 说的是「你的角色 / 范围不包括它」，
  #     那是真话，而且是调用者唯一能拿来找对人的信息。两种 type：
  #     role-forbidden（这个角色做不了这类事，比如门店管理员建员工）与
  #     out-of-scope（这类事你能做，但这一个不归你管，比如华北大区管理员改华东的门店）。
  #     列表类接口不回 403，而是只列范围内的（大区列表、门店列表、员工列表）。

  /admin/uploads:
    post:
      tags: [Admin, Upload]
      summary: 上传商品图（后台）
      description: |
        与 `POST /uploads` 是**两条路**，不是一条路的两种用法。

        `uploads` 的上传者二选一，由 `chk_upload_owner` 这条 CHECK 约束钉死
        （数据模型 §13 / §14）：C 端用户填 `user_id`，后台操作员填 `staff_id`。
        哪一列被填上，取决于这次调用带的是买家 token 还是 staff 会话 token。
        同一个路径同时接受两种身份，等于把「这次是谁传的」变成一个要在 handler
        里靠 token 形状猜的东西——而猜错的代价是「运营的操作记在某个 C 端用户
        名下」，那正是数据模型 §15 第 8 条要求在写商品写入接口之前定下来的事。

        所以商品图走这里，`purpose` 固定为 `1 商品图`，**请求体里没有这个字段**——
        路径已经决定了它。头像（2）与退款凭证（3）仍走 `POST /uploads`。

        限制与 `POST /uploads` 逐条一致：单文件不超过 **10 MB**（超出 413），
        `content_type` 仅接受 `image/jpeg` / `image/png` / `image/webp`（其余 415）。

        上传只是把文件放进 `uploads`，此时 `referenced = FALSE`。真正与商品建立
        关联的是 `PUT /admin/products/{product_id}/images`，那一步在同一个事务里
        把 `referenced` 置为 TRUE。**超过 24 小时仍未被引用的文件会被清理任务
        删掉**（数据模型 §13），所以拿到 `id` 之后请尽快提交。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件内容，不超过 10 MB
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 上传成功
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401':
          description: 未登录，或带的不是 staff 会话 token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '413':
          description: |
            文件超过 10 MB。`type` 为 `https://keel.dev/problems/upload-too-large`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: |
            `content_type` 不在允许列表内。
            `type` 为 `https://keel.dev/problems/upload-unsupported-media-type`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/uploads/{upload_id}:
    get:
      tags: [Admin, Upload]
      summary: 读取文件（后台）
      description: |
        `GET /uploads/{upload_id}` 那张可读者表里「后台客服」那一半。响应形状相同：
        判完权限 302 到同一种**限时**地址（默认 5 分钟）。

        | purpose | 哪些员工可读 |
        |---|---|
        | 1 商品图 / 2 头像 | 本店全部员工 |
        | 3 退款凭证 | 能看**引用了它的那张退款单**的员工：按退款单所属订单的履约门店判，与后台退款单详情同一个判据 |

        退款凭证只认「被本店某张退款单的 `evidence_urls` 引用了」的那些：
        买家传了却没提交申请的凭证与售后无关，任何员工都读不到（403 `upload-forbidden`）。
        引用它的退款单不在调用者的门店范围里 → 403 `out-of-scope`。

        后台界面的 `<img>` 带不了 `Authorization` 头，所以请用带令牌的请求取这里的 302
        （`fetch` 在同源跳转时会自动跟过去拿到字节），再把字节交给图片控件。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - name: upload_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '302':
          description: 跳转到限时访问地址
          headers:
            Location:
              description: 限时地址，默认有效期 5 分钟
              schema: { type: string }
        '401':
          description: 未登录，或带的不是 staff 会话 token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            · 退款凭证没有被本店任何一张退款单引用 —— .../upload-forbidden
            · 引用它的退款单不在你的门店范围里 —— .../out-of-scope
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 文件不存在、已被清理，或不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/products:
    get:
      tags: [Admin, Catalog]
      summary: 商品列表（后台）
      description: |
        **不能用 `GET /products` 代替。** 前台那条只返回 `status = 1 上架`
        的商品，而后台要管的恰恰是草稿与已下架的那些——一个刚创建、还没上架的
        商品在前台的任何一个视图里都不存在，商家也就没有任何入口回去编辑它。

        不传 `status` 时返回**全部未软删**的商品（含草稿与下架），
        这与前台默认只看上架是刻意相反的：后台的默认视图是「我店里的全部商品」。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: |
            按 `products.status` 筛选：0 草稿 / 1 上架 / 2 下架。
            **刻意不给 default**——缺省被代入会静默改变「返回哪些行」，
            而那正是本仓库那条契约检查要挡的东西。省略即不按状态筛。
          schema: { type: integer, enum: [0, 1, 2] }
        - name: category_id
          in: query
          description: 按类目筛选。只匹配直接挂在该类目下的商品，不含子类目。
          schema: { type: integer, format: int64 }
        - name: include_deleted
          in: query
          description: |
            传 `true` 时把软删（`deleted_at` 非空）的商品也带上，用于核对。
            省略即不含——一期没有恢复接口，这个参数只为「看得见」存在。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminProduct' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin, Catalog]
      summary: 创建商品（落地即草稿）
      description: |
        新建的商品一律是 `status = 0 草稿`，`published_at` 为空。
        **请求体里没有 `status`**：创建与发布是两个动作，合成一个会让
        「建一个还没配好 SKU 的商品」这件最普通的事没法表达。

        创建时不带 SKU。原因是 SKU 有自己的唯一约束（`uk_skus_code`）与库存行，
        嵌在商品创建里意味着一次部分失败要回答「商品建出来了吗」——
        而分成两步之后，失败的那一步就是失败的那一步。
        上架前至少要有一个 SKU，那条闸门在 `POST .../publication` 上。

        响应里的 `min_price_cents` / `max_price_cents` / `total_stock` 此刻都是 0，
        因为这件商品还一个 SKU 都没有——这三个数是服务端按需现算的
        （迁移 00019），不是入参，也不是一份等着被同步的冗余副本。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses:
        '201':
          description: 已创建（草稿）
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '404':
          description: |
            `category_id` 不存在，或不属于当前租户。
            跨租户挂接在库里也是不可能的——`products.category_id` 是
            复合外键 `(category_id, merchant_id)`（数据模型 §3）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '422':
          description: |
            同一 Idempotency-Key 配了不同的请求体（`https://keel.dev/problems/idempotency-key-reused`）；
            或 `freight_template_id` 指向门店模板、不存在或已删除的运费模板
            （`https://keel.dev/problems/invalid-request`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/product-imports/template:
    get:
      tags: [Admin, Catalog]
      summary: 下载商品批量导入模板
      description: |
        三步里的第一步：**下载模板 → 预检（`POST /admin/product-imports/preview`）
        → 确认导入（`POST /admin/product-imports`）**。

        模板的列（顺序即模板里的顺序；表头按名字识别，不按位置，全角半角括号、
        多余空格都认）：

        | 列 | 必填 | 说明 |
        |---|:-:|---|
        | 商品标题 | ✅ | ≤ 200 字。**同一个标题的多行合并成同一件商品**（一行一个 SKU） |
        | 副标题 | | ≤ 200 字 |
        | 类目 | | 已有类目的名字，或从一级写到末级的路径（`>` 或 `/` 分隔）。留空或对不上时按标题推荐 |
        | 规格名 | | 多个维度用分号分隔，如 `颜色;尺码` |
        | 规格值 | | 与规格名一一对应，如 `红;M` |
        | SKU 编码 | ✅ | ≤ 64 字，本店内唯一（与已有 SKU 也不能重复） |
        | 基准价（元） | ✅ | 单位元，最多两位小数，不带千分位逗号 |
        | 库存 | ✅ | 非负整数，写进默认门店 |
        | 重量（克） | | 非负整数 |
        | 图片 URL | | http / https，多张用分号或换行分隔。**本期只记录不下载** |
        | 描述 | | 商品详情文字 |

        xlsx 模板有两张表：「商品」（只有表头，数据区整列设成文本格式，
        防止 Excel 把 `1-2` 转成日期、吃掉编码的前导 0）与「填写说明」（逐列说明与示例）。
        csv 模板是 UTF-8 带 BOM 的一行表头（不带 BOM 的话中文 Excel 双击打开是乱码）。
        两种都**不带示例数据行**——示例行最常见的结局是被原样导入。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - name: format
          in: query
          required: false
          description: 模板格式，默认 `xlsx`。
          schema: { $ref: '#/components/schemas/ProductImportFormat' }
      responses:
        '200':
          description: '模板文件（`Content-Disposition: attachment`）'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '422':
          description: '`format` 不是 xlsx / csv'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/product-imports/preview:
    post:
      tags: [Admin, Catalog]
      summary: 批量导入预检（不落库）
      description: |
        上传 xlsx 或 csv，**只校验、不写库**，返回逐行结果。同一份文件可以反复预检。

        **格式按内容判断，不按文件名**：以 zip 头开始的是 xlsx，老式 .xls 与
        加密工作簿回 415（请另存为不加密的 .xlsx），其余按 csv 读。csv 的编码先按
        UTF-8（可带 BOM）读，不是合法 UTF-8 时按 GBK（GB18030）读 —— 中文 Excel
        「另存为 CSV」默认写的就是 GBK。

        **上限**：文件 ≤ 5 MB（超出 413），数据行 ≤ 2000（超出 422）。两个数由同步请求的
        预算推出：预检要给每件商品算一次向量（2000 件约 32 批嵌入调用），确认导入是
        一个事务；更大的目录请拆成多个文件。

        **逐行校验**（每一条问题落在 `rows[].errors` 或 `rows[].warnings`，`code` 见
        `ProductImportIssue`）：必填、长度、价格（元 → 分全程十进制字符串运算，
        不经过浮点）、整数、规格格式、图片地址形状；SKU 编码在文件内唯一、
        且与店里已有的 SKU（含已删除的）不重复。

        **同一商品多规格行的合并规则**：

        1. 同一个商品标题 = 同一件商品，不要求相邻（不相邻时给提示）；
        2. 副标题、类目、描述以组内第一个非空值为准，后面的行留空或填相同内容，
           填了不同内容那一行报错；
        3. 组内多于一行时每行都要有规格、规格名集合相同、规格值组合不重复；
           只有一行的商品可以不填规格；
        4. **一行有错，整件商品不导入**（其余行带 `group_blocked` 提示）——
           导入一半的规格比整件没进来更难察觉。

        **Excel 的坑**：公式格报错（请「粘贴为数值」）；合并单元格按左上角的值
        填进每一格并提示，表头行合并报文件级错误；被 Excel 识别成日期的格报错；
        存成数字的 SKU 编码提示「前导 0 可能已丢」。

        **合规**：标题 / 副标题 / 描述逐一过广告法违禁词表，命中标在
        `rows[].violations`（字段 + 码点位置）。**不阻断导入**：导入的商品是草稿，
        草稿不做合规拦截（与单个建商品同一条规矩），上架时才拦。

        **类目**：见 `ProductImportCategoryDecision`。文件里填的类目对上已有类目就用它；
        留空或对不上时按「标题 + 副标题」的向量与各叶子类目路径名的向量算余弦，
        给 Top 3 候选。推理引擎没配或不可用时降级为 `unavailable`（需手选），
        **不阻塞预检**。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: xlsx 或 csv，不超过 5 MB
      responses:
        '200':
          description: 预检结果（即使每一行都有错也是 200——错误在 rows 里）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImportPreview' }
        '413':
          description: 文件超过 5 MB。`type` 为 `https://keel.dev/problems/import-file-too-large`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: |
            既不是 xlsx 也不是 csv（老式 .xls、加密工作簿、二进制文件）。
            `type` 为 `https://keel.dev/problems/import-unsupported-format`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            整份文件不成立：缺必填列、同一列出现两次、没有数据行、超过 2000 行、
            表头合并、xlsx 损坏或解压后超限、工作簿加了密码、csv 编码认不出。
            `type` 为 `https://keel.dev/problems/import-file-invalid`，
            `errors[].message` 逐条列出原因。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/product-imports:
    post:
      tags: [Admin, Catalog]
      summary: 确认批量导入
      description: |
        把**同一份文件**再传一次，连同每件商品选定的类目，按预检的同一套规则建商品与 SKU。
        服务端重新解析、重新校验（不信任客户端回传的预检结果），不再调推理引擎。

        · **只导入没有错误的商品**，有错的整件跳过，出现在 `products[]` 里（`status = failed`）。
          一件可导入的商品都没有时回 422 `import-nothing-to-import`，什么都不写。
        · **类目**：文件里填的类目对上了就用它（`categories` 里给了则以给的为准）；
          其余商品必须在 `categories` 里按 `first_row` 指定 `category_id`，
          没指定的那件商品 `failed`。预检里 `recommended` 的那些，界面应当把推荐的
          类目原样放进 `categories`——服务端**不会**自动采用推荐（确认这一步不调引擎，
          结果只取决于文件与这份选择）。
        · **一律是草稿**（`status = 0`），不上架。库存写进默认门店；没有默认门店时
          SKU 照建、库存行不建（与单个建 SKU 同一条规矩）。
        · **图片 URL 只记录不下载**，原样出现在 `products[].image_urls`，请在商品页上传。
          外网下载有 SSRF 风险（内网地址、DNS 重绑定、重定向链），要白名单与大小类型
          限制，另起一轮做。
        · **整批一个事务**：任何一件商品在写库时失败（比如同一时刻另一个导入抢先建了
          同一个 SKU 编码），整批回滚，响应是那个错误，什么都没建。

        **幂等，两层**：

        1. `Idempotency-Key`（必填）：同一把钥匙重放返回首次的结果，带
           `Idempotency-Replayed: true`。
        2. **同一份文件**（按文件字节的 sha256）在本店已经确认导入过：不再建任何东西，
           返回那一次的结果，`already_imported = true`。换一把钥匙、换一种类目选择
           都一样 —— 防的就是「点了两次」「网断了重传」「隔天又导了一遍」。
           改过的文件是另一份文件；里面已经建过的 SKU 编码会在预检里报 `sku_code_exists`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 与预检时同一份文件
                categories:
                  type: array
                  description: 每件商品选定的类目。按 `first_row`（该商品在文件里的首行行号）对应。
                  items: { $ref: '#/components/schemas/ProductImportCategoryChoice' }
            encoding:
              categories:
                contentType: application/json
      responses:
        '201':
          description: 导入完成（或同一份文件早已导入过，`already_imported = true`）
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductImportResult' }
        '409':
          description: |
            两种，按 `type` 区分：

            · `idempotency-key-in-flight`：同一把钥匙正在处理中，按 `Retry-After` 退避重试；
            · `sku-code-duplicated`：写库时某个 SKU 编码刚被别人占了（预检之后、确认之前，
              另一个导入或手工建的 SKU 抢先用了它）。整批已回滚，什么都没建——重新预检，
              那个编码会以 `sku_code_exists` 标出来。
          headers:
            Retry-After:
              description: 只在 idempotency-key-in-flight 时出现，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: 文件超过 5 MB。`type` 为 `https://keel.dev/problems/import-file-too-large`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: 既不是 xlsx 也不是 csv。`type` 为 `https://keel.dev/problems/import-unsupported-format`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            四种，按 `type` 区分：

            · `import-file-invalid`：整份文件不成立（同预检）；
            · `import-nothing-to-import`：没有一件商品可以导入（全都有错或都没选类目）；
            · `invalid-request`：`categories` 不是合法的 JSON 数组（指定的类目不存在或已停用
              不在此列：那一件商品 `failed`，其余照导）；
            · `idempotency-key-reused`：同一把钥匙配了不同的请求。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 商品详情（后台，含全部 SKU、库存与图片）
      description: |
        与 `GET /products/{product_id}` 的差别不只是「能看草稿」：
        这里带 `cost_cents`（成本，前台永远不该出现）、带每个 SKU 的
        `available_qty` 与 `warning_qty`、带软删标记。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '404':
          description: 商品不存在，或不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 改商品信息
      description: |
        只改文案与归属，**不改状态**（上下架走 `POST .../publication`，
        软删走 `DELETE`）。把状态混进这个 PATCH 里，等于让「改个错别字」
        和「把商品从前台撤下来」共用一条审计记录。

        在架商品也能改——改标题不需要先下架。代价是前台会看到改动即时生效，
        这是刻意的：要求「先下架再改再上架」会让商家为一个错别字付出一次
        商品从搜索结果里消失的代价。

        **在架商品（`status = 1`）的文案改动要过一次广告法违禁词检查**，
        草稿与已下架的不过。判据是「这段文字会不会出现在买家面前」：
        `publication` 是让它出现的入口，而在架状态下的 PATCH 是另一个入口，
        两个都堵住，商品对外可见的文案才真的过过检查。草稿是商家还在写的
        东西，拦它只会在写作过程中打断人，而它一个买家也看不到。
        详见 `POST .../publication` 的描述。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '404':
          description: 商品不存在、不属于当前租户，或新的 `category_id` 不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            商品已软删，不接受修改——
            `type` 为 `https://keel.dev/problems/product-deleted`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            按 Problem `type` 区分：

            · 一个字段都没传（`minProperties: 1`），或字段取值非法（含 `freight_template_id`
              指向门店模板、不存在或已删除的运费模板）——
              `https://keel.dev/problems/invalid-request`
            · 在架商品的新文案命中广告法违禁词——
              `https://keel.dev/problems/compliance-rejected`。
              `errors[]` 逐条给出 `field` / `offset` / `length`（见 `FieldError`），
              改动**没有落库**。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            合规检查没能在预算内给出结论，**保守拒绝**（改动没有落库）——
            `type` 为 `https://keel.dev/problems/compliance-unavailable`。
            只可能出现在改在架商品文案时。见 `POST .../publication` 的描述。
          headers:
            Retry-After:
              description: 建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 删除商品（软删）
      description: |
        置 `deleted_at`，**不删行**。行必须留着：`order_items` 虽然是下单即快照
        （数据模型 §5），但 `cart_items` 与四张派生表（向量 / 理解结果 / 同款簇）
        都对 `products` 有复合外键，硬删会被数据库直接拒绝。

        **在架商品（`status = 1`）拒绝删除，返回 409。** 先下架再删。
        理由不是洁癖：删一个仍在前台列表与检索结果里的商品，会让一个正在
        下单的买家在 SAGA 中途撞上一个消失的商品，而那条路上的补偿分支
        处理的是「库存不足」，不是「商品没了」。

        软删之后该商品不出现在任何前台视图里，后台列表也要显式传
        `include_deleted=true` 才看得到。**一期不提供恢复接口**——
        恢复要回答「恢复出来是草稿还是下架」以及「它的 SKU 跟着恢复吗」，
        那两个问题现在都没有答案，留一个答不上来的接口比不留更糟。
      responses:
        '204':
          description: 已软删
        '404':
          description: 商品不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            商品仍在架（`status = 1`），请先下架——
            `type` 为 `https://keel.dev/problems/product-still-published`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/products/{product_id}/publication:
    post:
      tags: [Admin, Catalog]
      summary: 上架 / 下架
      description: |
        状态机的那条边单独成一个子资源，与 `POST /admin/refunds/{refund_no}/audit`
        同一个形状：让每一次状态变更都有一个明确的触发入口，而不是散在一个
        什么都能改的 PATCH 里。

        · `publish`   → `status` 置 1。允许的来源是 `0 草稿` 与 `2 下架`。
        · `unpublish` → `status` 置 2。允许的来源是 `1 上架`。

        **`published_at` 只在第一次上架时置位，之后永不覆盖。** 它是「首次发布
        时间」，前台 `GET /products?sort=newest` 按它倒序排；每次上架都覆盖的话，
        一次临时下架再上架就能把一件老商品顶到列表最前面，而那不是商家点
        「上架」时想要的东西。

        **没有回到 `0 草稿` 的动作。** 草稿的含义是「从未对外出现过」，
        一旦发布过就不再为真，给它一条回头路只会让 `published_at` 非空而
        `status = 0` 这种自相矛盾的状态变得可达。

        **重复调用是幂等的**：已经在架的商品再 `publish` 返回 200 且什么都不改，
        不报 409。状态机的终点相同，这里没有可失败的东西。

        闸门：**没有任何 SKU 的商品不能上架**（409）。上架意味着它会出现在
        前台列表与检索结果里，而一个没有 SKU 的商品点进去既没有价格也没有
        可加购的东西——`min_price_cents` 算出来会是 0，前台会把它渲染成免费。

        ## 上架前的广告法违禁词检查（同步，预算 200 ms）

        `publish` 会在**同一个事务里**扫一遍商品的 `title` / `subtitle` /
        `description`，命中「最佳」「国家级」「全网第一」这类《广告法》
        第九条的绝对化用语时**拒绝上架**（422，`type` 为
        `https://keel.dev/problems/compliance-rejected`），并在 `errors[]` 里
        逐条给出是哪个字段的第几个字（`FieldError` 的 `offset` / `length`）。
        「拒绝」两个字不够——商家要知道改哪里。

        **这一步是同步的，而且是全系统唯一一处「宁可误拒」。** 违禁词在中国是
        硬约束，单次处罚起点二十万，所以它不能放异步；而检查本身回答不出来时
        （超时），返回 503 拒绝上架，而不是放行（`compliance-unavailable`）。
        其余所有 AI 能力的故障都不阻塞主链路，只有这一条相反
        （见 `docs/ai-capabilities.md` 的「三条纪律」第三条）。

        `unpublish` 不做这个检查：下架只会让文案从买家面前消失。

        **本轮的检查只有规则词表，没有小模型兜底变体。** 「蕞」「No.1」
        「巅峰之作」这三个是被**列进词表**的，拦得住；词表之外的新变体
        （拆字、谐音、拼音）今天一个也拦不住。类目资质那一半也没有做——
        库里没有任何一张表记录商家资质。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPublicationRequest' }
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '404':
          description: 商品不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 Problem `type` 区分：

            · 商品一个 SKU 都没有，不能上架——
              `https://keel.dev/problems/product-has-no-sku`
            · 同一 Idempotency-Key 正在处理中——
              `https://keel.dev/problems/idempotency-key-in-flight`
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            按 Problem `type` 区分：

            · 商品文案命中广告法违禁词，拒绝上架——
              `https://keel.dev/problems/compliance-rejected`。
              `errors[]` 逐条给出 `field` / `offset` / `length`（见 `FieldError`），
              商品**没有**被上架。
            · `action` 不是 `publish` / `unpublish`——
              `https://keel.dev/problems/invalid-request`
            · 同一 Idempotency-Key 配了不同的请求体——
              `https://keel.dev/problems/idempotency-key-reused`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            合规检查没能在预算内给出结论，**保守拒绝上架**——
            `type` 为 `https://keel.dev/problems/compliance-unavailable`。
            商品没有被上架；按 `Retry-After` 退避后可以重试。
            这是全系统唯一一处宁可误拒的地方，理由见上面的描述。
          headers:
            Retry-After:
              description: 建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/products/{product_id}/images:
    put:
      tags: [Admin, Catalog]
      summary: 设置商品图（整组替换）
      description: |
        **一次调用替换整组，而不是「加一张 / 删一张 / 调顺序」三个端点。**

        理由是并发：图片的顺序是一个整体，增量接口下「把第 3 张挪到第 1 位」
        与「删掉第 2 张」两个并发请求会互相踩，而中间态（有两张主图、
        顺序出现空洞）在增量模型里是可表达的。整组替换让顺序只有一个写入点，
        PUT 也因此天然幂等——重发同一个请求不会多出一张图。

        **`images[0]` 就是主图**，没有 `is_primary` 布尔。一个布尔允许
        「零张主图」和「两张主图」这两种在业务上不存在的状态被表达出来，
        而顺序本来就要维护。「设为主图」在客户端就是把那一项挪到数组第一位，
        与「调整顺序」是同一个动作，不需要第二个概念。
        `ProductSummary.image_url` 取的就是这一张。

        传空数组即清空全部图片。

        每个元素只有一个 `upload_id`，不是一个 URL 字符串。收 URL 意味着客户端
        能往这里写任意地址（站外图床、别家租户的文件），而收 id 把取值域关死在
        自己的 `uploads` 表里，并且能在同一个事务里把 `referenced` 置为 TRUE——
        数据模型 §13 明写这一步必须与引用它的业务对象同事务，否则孤儿回收会在
        提交与扫描之间的窗口里删掉刚用上的图。

        已知缺口（数据模型 §13 记过）：`referenced` 是单向布尔，被替换下来的
        旧图会永远停在 `TRUE`，不会被回收。一期接受这个磁盘增长。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductImagesReplaceRequest' }
      responses:
        '200':
          description: 替换后的完整图片列表，顺序即展示顺序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductImage' }
        '404':
          description: 商品不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            按 Problem `type` 区分：

            · 某个 `upload_id` 不存在或不属于当前租户——
              `https://keel.dev/problems/upload-not-found`
            · 某个 `upload_id` 的 `purpose` 不是 `1 商品图`（例如拿退款凭证
              当商品图挂上去）——`https://keel.dev/problems/upload-wrong-purpose`
            · 同一个 `upload_id` 在数组里出现了两次——
              `https://keel.dev/problems/product-image-duplicated`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/products/{product_id}/skus:
    post:
      tags: [Admin, Catalog]
      summary: 给商品加一个 SKU
      description: |
        **同一个事务里还会建出这个 SKU 的 `inventories` 行。** 这不是顺手做的：
        `inventories.sku_id` 是主键，且下单 SAGA 的正向分支是
        `UPDATE ... WHERE sku_id = $1 AND available_qty >= $2`——
        没有那一行时 `rows_affected = 0`，而 SAGA 把它判成**库存不足**
        （数据模型 §4）。于是一个漏建库存行的 SKU 表现为「这件商品永远缺货」，
        排查方向从一开始就是错的。所以建 SKU 必须建库存行，
        初始量由 `available_qty` 给出，省略为 0。

        `sku_code` 在**租户内**唯一（`uk_skus_code` 是 `(merchant_id, sku_code)`），
        不是商品内唯一，也不是全局唯一：两家店各有一个 `A001` 是正常的，
        同一家店的两个商品用同一个 `A001` 不是。

        `spec_values` 是自由的键值对（`skus.spec_values` 是 JSONB），
        契约不规定键名。一期**不校验**同一商品下各 SKU 的规格键是否一致——
        规格模板（「这个商品有颜色和尺码两个维度」）没有落地的表，
        在没有模板的前提下校验只能靠猜。

        写入后商品的 `min_price_cents` / `max_price_cents` / `total_stock`
        自然跟着变：它们不是存下来的冗余字段，而是读商品时从 `skus` /
        `inventories` 现算的（迁移 00019）。也就是说不存在「加了 SKU 但
        商品上的价格区间还是旧的」这个中间态。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuCreateRequest' }
      responses:
        '201':
          description: 已创建（含库存行）
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSku' }
        '404':
          description: 商品不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 Problem `type` 区分：

            · 该租户内已有同一个 `sku_code`——
              `https://keel.dev/problems/sku-code-duplicated`
            · 同一 Idempotency-Key 正在处理中——
              `https://keel.dev/problems/idempotency-key-in-flight`
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/skus/{sku_id}:
    parameters:
      - $ref: '#/components/parameters/SkuId'
    patch:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 改 SKU（含改价）
      description: |
        **请求体里没有 `available_qty`，这是刻意的。** 库存走
        `PUT /admin/skus/{sku_id}/inventory`，理由写在那个端点上：
        它要表达乐观并发，而一个「什么都能改」的 PATCH 表达不了
        「基于我看到的值改」。把库存混进来，一次改价就能顺带把并发下单
        扣掉的量抹掉。

        改价立即生效，不需要先下架。购物车里已有的条目不受影响也不报错——
        **购物车不存价格快照**（数据模型 §10），结算时按当时的价重算；
        真正的价格快照发生在下单那一刻（`order_items`，数据模型 §5）。
        所以改价不会改变任何一笔已成交订单的金额。

        改价后商品的 `min_price_cents` / `max_price_cents` 下一次读就是新的：
        它们是从 `skus` 现算的，不是存下来的冗余字段（迁移 00019）。

        `status` 是 SKU 自己的售卖开关：`0 停售` / `1 在售`。停售的 SKU 仍出现在
        商品详情的规格矩阵里（否则买家会以为规格表变了），但不可加购、不可下单。
        它与商品的上下架是两个维度：商品在架而某个规格停售，是常态。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSku' }
        '404':
          description: SKU 不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            该租户内已有同一个 `sku_code`——
            `type` 为 `https://keel.dev/problems/sku-code-duplicated`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '一个字段都没传（`minProperties: 1`），或 `price_cents` 为负'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 删除 SKU（软删）
      description: |
        置 `skus.deleted_at`，**不删行**。

        硬删在这个 schema 下根本做不到，这一点值得写在契约里而不是等实现时
        撞上：`order_items`、`cart_items`、`inventories`、`inventory_logs`
        四张表都对 `skus` 有外键，一个卖过一次的 SKU 永远删不掉。
        （`skus` 原先没有 `deleted_at`，是本轮为这条接口补进数据模型 §3 的。）

        软删之后它的 `sku_code` 可以被重新使用——`uk_skus_code` 因此改成了
        `WHERE deleted_at IS NULL` 的部分唯一索引。不这么做的话，一个被删掉的
        规格会永久占住一个货号，而货号是商家自己的编码体系，不是我们的 id。

        **拒绝删掉在架商品（`status = 1`）的最后一个 SKU**，返回 409。
        那会让一个在前台可见的商品变成没有任何可买规格，
        与「没有 SKU 不能上架」是同一条闸门的另一侧。
      responses:
        '204':
          description: 已软删
        '404':
          description: SKU 不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            这是某个在架商品的最后一个 SKU——
            `type` 为 `https://keel.dev/problems/sku-last-of-published-product`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/skus/{sku_id}/inventory:
    put:
      tags: [Admin, Catalog]
      summary: 改库存（比较并设置，仅单门店商家）
      description: |
        ### 这条路径本轮变成了「恰好一家门店」时的便捷写法

        库存主键从 `sku_id` 变成 `(sku_id, store_id)` 之后（数据模型 §4，
        §15 第 3 条结清），**「这个 SKU 的库存」不再是一个有定义的东西**。
        一般形态是 `PUT /admin/stores/{store_id}/skus/{sku_id}/inventory`。

        这条保留下来，语义写死：**本租户恰好有一家未软删的门店时，
        它就是那一家；否则返回 409 `https://keel.dev/problems/store-ambiguous`。**

        为什么不直接删掉它：架构 §3 的原话是「**多租户是能力不是要求**」——
        小商家 `docker compose up` 起来就是租户数为 1 的部署，感知不到多租户。
        多门店是同一条叙事的第二段：单店商家不该被逼着在每个 URL 里写一个
        恒等于 1 的 `store_id`。

        为什么不让它「默认落到默认门店」：那正是这条接口最不该做的事。
        库存是唯一真相，猜错一家店的后果是**把另一家店的水位覆盖掉**，
        而且没有任何东西会响。所以是「恰好一家才可用，否则显式报错」，
        不是「猜一家」。

        ---

        **这条接口和下单 SAGA 抢同一行。** `inventories` 是数据模型 §4 的热点表，
        下单正向分支是 `UPDATE inventories SET available_qty = available_qty - $2
        WHERE sku_id = $1 AND available_qty >= $2`。如果后台这里写的是一个
        无条件的绝对值覆盖，那么「商家看到 10、页面停了三分钟、期间卖掉 4 件、
        商家把它改成 20」的结果是 20，而正确答案是 16——**并发下单扣掉的 4 件
        被一次后台覆盖抹掉了**，而且没有任何东西会响。

        所以请求体里 `expected_available_qty` 是**必填**的：它是「我看到的那个值」。
        服务端执行的是一条比较并设置：

        ```sql
        UPDATE inventories
           SET available_qty = $new,
               warning_qty   = COALESCE($warn, warning_qty)
         WHERE sku_id = $sku AND available_qty = $expected;
        ```

        对不上就 409，并把**当前真实值**放在 Problem 的 `current` 里一起返回，
        这样后台页面能直接刷新那一格，而不是让人再点一次查询才知道发生了什么。

        ### 为什么不是一个 version 列

        数据模型 §4 已经论证过这张表不用 version 乐观锁，用的是**条件原子更新**。
        这条接口沿用同一个手法，只是把条件从 `available_qty >= $n` 换成
        `available_qty = $expected`。因此**不需要给 `inventories` 加任何新列**——
        这一点是特意核过的，本任务不设计一个实现不了的契约形状。

        代价诚实说一条：CAS 比的是值本身，所以存在 ABA——读到 10、期间卖掉 3 件
        又退回 3 件、写的时候仍然是 10，CAS 通过。对这张表**这是良性的**：
        §4 明写「可售就是库存的全部真相」，中间经历过什么不改变「我看到 10、
        现在还是 10、我要它变成 20」这个意图。真正要防的是数值已经变了而覆盖照旧，
        那个 CAS 挡得住。

        ### 实现时必须分开的两种 0 行

        `rows_affected = 0` 在这里有两个来源，而它们的处置完全不同：
        **CAS 不匹配（409）** 与 **这个 SKU 不在本租户（404）**。数据模型 §4 记过
        同一个坑的另一面——设了租户但 SKU 是别家的，扣减语句的 0 行信号与
        「库存不足」完全一样，SAGA 会把配置错误当成缺货来补偿。
        这里同样要在一条语句里把两者分别回传（`db/queries/inventories.sql`
        已有的写法），而不是先 SELECT 再 UPDATE——那两步之间就是竞态本身。

        ### 补货场景

        进货 100 件在这条接口上要写成「expected = 当前值，new = 当前值 + 100」，
        并在 409 时重读重试。一期接受这个形状：单个 SKU 上的并发写是低频的，
        重试一两次就过。真正的相对调整（`delta`，天然可组合，且
        `inventory_logs.biz_type = 5 手工调整` 已经为它留好了位置）留给下一轮。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/SkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventorySetRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInventory' }
        '404':
          description: |
            SKU 不存在、不属于当前租户，或已被软删。
            **刻意与 409 分开**：把「不是你的 SKU」也报成 409 会让调用方
            以为重读一次再试就能成功，而那个循环永远不会结束。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            两种，按 `type` 区分：

            · `https://keel.dev/problems/inventory-precondition-failed` ——
              `expected_available_qty` 与当前值不符，库存在你读到它之后被改过
              （多半是并发下单扣减）。响应体里的 `current` 是当前的真实值，
              可直接用于刷新页面并重试。
            · `https://keel.dev/problems/store-ambiguous` ——
              本租户的门店数不是 1，「这个 SKU 的库存」没有唯一答案。
              改调 `PUT /admin/stores/{store_id}/skus/{sku_id}/inventory`。
              **这一种重试没有用**，但它和上一种共用 409 是刻意的：
              两者都是「服务端现在的状态与你的假设不符」，
              而客户端对第二种要做的是换一条路径，不是换一个值——
              `type` 把这件事说清楚了，状态码不必再分一次。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/InventoryConflict' }
        '422':
          description: |
            `available_qty` 或 `expected_available_qty` 为负。
            非负同时由 `inventories` 的 `chk_qty_nonneg` 兜底（数据模型 §4）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/categories:
    get:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 分类列表（后台，扁平）
      description: |
        返回**扁平**数组而不是 `GET /categories` 那棵树，按 `path` 升序。
        后台要管的是单个节点（改名、挪位置、停用），而树形结构在表格里
        还得再拍平一次；`path` 与 `level` 都在每一行上，需要树的客户端
        自己拼即可。

        与前台那条的另一个差别：**含停用（`status = 0`）的分类**。
        前台目录树只给启用的，而后台恰恰要看得见自己停掉的那些。
        软删的不返回——一期没有恢复接口。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminCategory' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin, Catalog]
      summary: 新建分类
      description: |
        **`path` 与 `level` 不在请求体里，由服务端从 `parent_id` 算出。**
        它们是物化路径（数据模型 §3：`path` 形如 `/1/23/456/`，
        `idx_categories_path` 是分类查询的主索引）。让客户端传 `path`
        等于让前端去维护一个索引的内容——算错一次，前台目录树就会长出
        一整个错位的子树，而数据库不会拒绝。

        `parent_id` 省略或为 `null` 即建一个根分类（`level = 1`）。
        父分类必须属于当前租户，这一条在库里也是硬的：`categories` 的
        `parent_id` 走**自引用的复合外键** `(parent_id, merchant_id)`
        （00004 补的），否则一条 `path` 会横跨两家店。

        一期不设层级深度上限。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreateRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '404':
          description: '`parent_id` 不存在，或不属于当前租户'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 改分类（含移动子树）
      description: |
        ### 传 `parent_id` 就是移动子树

        这是本接口唯一需要展开讲的动作。改一个节点的父亲，意味着它**以及它
        全部后代**的 `path` 与 `level` 都要跟着改，而那是一条语句的事：

        ```sql
        UPDATE categories
           SET path  = $new_prefix || substring(path from length($old_prefix) + 1),
               level = level + $delta
         WHERE path LIKE $old_prefix || '%';
        ```

        与节点自身的 `parent_id` 更新在同一个事务里。不这么做的后果不是
        「数据不太整齐」——`path` 是分类查询的主索引，子树的 `path` 没跟着走，
        那些商品在新位置下就查不出来了，而在旧位置下还查得出来。

        **拒绝成环**（409）：目标父节点不能是自己，也不能是自己的后代。
        判据就用 `path`：`目标.path LIKE 自己.path || '%'` 为真即成环。
        没有这条，一次误操作就能把一棵子树从树上摘下来变成一个独立的环，
        而 `path` 的重写会在那个环上跑不完。

        `parent_id` 显式传 `null` 表示移到根（`level` 变成 1）。
        不传这个字段则不动层级——`null` 与「没传」在这里是两件事。

        ### 停用不等于下架

        `status = 0` 让这个分类从前台目录树里消失，**但挂在它下面的商品不受影响**：
        仍然在架、仍然搜得到、仍然能直接访问详情页。停掉的是目录入口，不是商品。
        要让商品下架请用 `POST /admin/products/{product_id}/publication`。
        这一条必须写明，否则「我停用了分类，为什么商品还在卖」会成为一个
        反复出现的问题。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        '404':
          description: 分类不存在、不属于当前租户，或新的 `parent_id` 不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            目标父节点是自己或自己的后代，移动会形成环——
            `type` 为 `https://keel.dev/problems/category-cycle`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '一个字段都没传（`minProperties: 1`）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Catalog]
      summary: 删除分类（软删）
      description: |
        置 `categories.deleted_at`。两条闸门，都是 409：

        · **还有未软删的子分类** —— 删掉父节点会让那棵子树的 `path` 指向一个
          看不见的祖先。复合外键不会拦（软删不删行），所以这一条只能在这里挡。
          `type` 为 `https://keel.dev/problems/category-has-children`。
        · **还有未软删的商品挂在它下面** —— `products.category_id` 是 NOT NULL
          的复合外键，商品不可能「没有分类」。放行的话，前台目录树里找不到
          这些商品，而它们仍在架、仍能被搜到、仍能下单。
          `type` 为 `https://keel.dev/problems/category-has-products`。

        换句话说：要删一个分类，先把它的商品挪走或删掉，再从叶子往上删。
        这个顺序是刻意的——级联删除在一棵商家自己维护的目录树上太危险了。
      responses:
        '204':
          description: 已软删
        '404':
          description: 分类不存在、不属于当前租户，或已被软删
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 该分类下还有子分类或商品，见 `type`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------- Admin · 大区、门店与围栏
  #
  # 这一段是「多门店 + 电子围栏」的后台面，数据模型 §4 是它的真相源。
  # 三件事在这里要说清楚，因为它们决定了下面每条路径的形状：
  #
  #  1. **可见性与价格都是两层覆盖，门店是最内层。**
  #       可见性：租户目录 − 大区排除 − 门店排除
  #       价格：  SKU 基准价 → 大区价 → 门店价（就近生效）
  #     所以「上下架」与「定价」这两组端点在大区与门店下各有一份，形状一致。
  #
  #  2. **两组排除表都是「缺一行即在售」。** 上架 = 删掉那一行，
  #     下架 = 写一行。端点做成 `PUT .../listing`，请求体 `{listed: bool}`，
  #     而不是 POST/DELETE 两条——「上架」与「下架」是同一个开关的两个位置，
  #     拆成两条路径会让客户端要先知道当前状态才知道该调哪条。
  #
  #  3. **两组价格覆盖都是「缺一行即沿用上一层」。** 定价 = upsert，
  #     撤销 = DELETE（回到上一层），不是「把价格设成 null」。
  /admin/regions:
    get:
      tags: [Admin, Store]
      summary: 大区列表
      description: |
        大区是**门店的分组**，不是一块地——它没有自己的几何。
        坐标解析出门店之后，门店的 `region_id` 就同时定下了大区
        （数据模型 §4：两套几何要回答「围栏与大区边界不一致时听谁的」，而那没有好答案）。

        大区决定两件事：这一层的商品可见性（`region_product_overrides`）
        与这一层的价格（`region_sku_prices`）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: include_deleted
          in: query
          description: 是否包含已软删的大区。不传即只返回未删的。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminRegion' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin, Store]
      summary: 新建大区
      description: |
        **建店之前必须先有大区**：`stores.region_id` 是 `NOT NULL`
        （数据模型 §4 论证过为什么不可空——可空会让三层定价的 `COALESCE`
        多一条只在「忘了配大区」时才走到的分支，而那条分支算的是钱）。

        建商家（`POST /admin/merchants`）会在同一个事务里建出一个默认大区，
        所以正常路径上不必先调这条。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionCreateRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRegion' }
        '409':
          description: |
            `code` 在本租户内已存在（`uk_regions_code`），或同一
            Idempotency-Key 正在处理中。按 `type` 区分：
            `https://keel.dev/problems/region-code-conflict`
            与 `https://keel.dev/problems/idempotency-key-in-flight`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/regions/{region_id}:
    parameters:
      - $ref: '#/components/parameters/RegionId'
    patch:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Store]
      summary: 改大区
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRegion' }
        '404':
          description: 大区不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Store]
      summary: 软删大区
      description: |
        名下还有未软删的门店时拒绝（409）。**不做级联**：
        级联软删一个大区会连带让它下面所有门店接不到单，而调用方在点下删除时
        看到的只是一个大区名。
      responses:
        '204':
          description: 已软删
        '404':
          description: 大区不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            名下还有门店。`type` 为
            `https://keel.dev/problems/region-has-stores`，
            `detail` 里给出门店数量。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores:
    get:
      tags: [Admin, Store]
      summary: 门店列表
      description: |
        响应带一个**必返**的 `has_default`。

        它不是冗余：数据模型 §4 记下的那条代价是「没有默认门店时，
        『不在任何围栏内』与『没有位置』两条路径都无处可落，
        买家看到的是不在服务范围」——也就是说**一个没配默认店的商家，
        它的店面对所有未授权定位的访客都是空的**。

        这是规则的必然结果，不是 bug，但后台必须说出来。
        放在列表响应里而不是做成建店时的强制项，理由是建店与画围栏是
        两个人在两个时刻做的事，强制会把第一步卡死在第二步上。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: region_id
          in: query
          description: 只看某个大区下的门店。
          schema: { type: integer, format: int64 }
        - name: include_deleted
          in: query
          description: 是否包含已软删的门店。不传即只返回未删的。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStoreList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin, Store]
      summary: 新建门店
      description: |
        **围栏不在这里传。** 建店与画围栏分成两步（`PUT .../fence`），
        理由是它们在后台是两个界面：一个是表单，一个是地图。

        **非默认门店没有围栏就是一家永远接不到单的店**，它不会被任何坐标命中，
        也不是回落目标。所以这条端点建出来的非默认门店在配上围栏之前，
        服务端要把它当成「未完成」——`AdminStore.fence` 为 `null` 即是那个状态，
        后台列表按它挂提示。

        这一版曾经写着「数据库上有一条 `CHECK (is_default OR fence IS NOT NULL)`
        挡住这种组合」。**那句话与这条端点不能同时成立**：本端点不收围栏，
        于是那条 CHECK 让它建不出任何一家非默认门店（实测 23514）。CHECK 已经
        删掉，规则退成 `PUT .../fence` 那一条路径上的服务端判定；
        论证与实测记在迁移 00020 里 `stores` 的定义上。

        建第一家门店时若还没有任何大区，返回 422（`region_id` 必填且必须存在）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreCreateRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStore' }
        '409':
          description: |
            按 `type` 区分：`code` 在本租户内已重复
            （`https://keel.dev/problems/store-code-conflict`）；
            `is_default = true` 但已经有一家默认门店
            （`https://keel.dev/problems/default-store-conflict`，
            对应 `uk_stores_default` 这条部分唯一索引——切换默认店请用
            `PUT /admin/stores/{store_id}/default`，它会在同一个事务里先清旧再置新）；
            同一 Idempotency-Key 正在处理中。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `region_id` 不存在或不属于当前租户，或字段校验不过，
            或同一 Idempotency-Key 配了不同的请求体
            （`https://keel.dev/problems/idempotency-key-reused`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}:
    parameters:
      - $ref: '#/components/parameters/StoreId'
    get:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Store]
      summary: 门店详情（含围栏）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStore' }
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Store]
      summary: 改门店
      description: |
        改不了两样：围栏走 `PUT .../fence`，默认店走 `PUT .../default`。
        两样都不是普通字段——一个要过 `ST_IsValid` 校验，
        另一个要在同一个事务里先清旧再置新。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStore' }
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `code` 重复。`type` 为 `https://keel.dev/problems/store-code-conflict`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `region_id` 不存在或不属于当前租户。
            **换大区会改变这家店的价格与可见性**（大区是两层覆盖里的外层），
            服务端不做任何提示性拦截，但后台界面应当二次确认。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      tags: [Admin, Store]
      summary: 软删门店
      description: |
        软删，不是硬删：`inventories` / `orders` / `inventory_logs` 三张表都对
        `stores` 有外键，一家接过单的门店在数据库层面删不掉（与 §3 `skus`
        那条软删论证同构）。

        **软删掉默认门店是允许的**，后果要写明：`uk_stores_default` 的谓词是
        `WHERE is_default AND deleted_at IS NULL`，所以删掉之后这家商家就
        没有默认门店了，未授权定位的访客会看到「不在服务范围」。
        这条不做拦截，因为「先删旧的默认店再建新的」是合法的运维顺序。
      responses:
        '204':
          description: 已软删
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/fence:
    put:
      tags: [Admin, Store]
      summary: 配置电子围栏（整体替换）
      description: |
        围栏是 **GeoJSON Polygon**，落库成 `GEOGRAPHY(POLYGON, 4326)`。

        ### 三条必须在服务端校验的事

        1. **坐标序是 `[经度, 纬度]`**，和中文口语里的「纬度、经度」相反。
           写反了不会报错——它会得到一个在地球另一侧的合法多边形，
           而所有判定都「正常工作」。服务端要按经度 ∈ [-180,180]、
           纬度 ∈ [-90,90] 做范围校验，这是唯一能机械发现写反的办法。
        2. **环必须闭合**（首尾点相同）且**不自交**。自交多边形在
           `ST_Intersects` 下的行为是未定义的——不是报错，是给一个谁也说不清的
           答案。落库前过一次 `ST_IsValid`，假则 422，并把 PostGIS 给出的
           `Self-intersection at or near point ...` 放进 Problem 的 `detail`。
        3. **SRID 固定 4326**，不接受别的。

        ### 整体替换，不做局部编辑

        地图上画的是一个环，没有「改第三个顶点」这种操作。
        `PUT` 一次覆盖，`fence` 传 `null` 即清空——清空只对默认门店合法，
        对普通门店返回 409。判据在服务端（`repository.SetStoreFence`），
        **不在数据库上**：这条规则曾经写成 `stores` 的一条
        `CHECK (is_default OR fence IS NOT NULL)`，落地实测那条 CHECK 同时挡死了
        建普通店（本端点按契约不收围栏）与切换默认门店（回填造出来的默认店没有
        围栏），两条都是主路径。论证与实测记在迁移 00020 里 `stores` 的定义上。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreFenceRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStore' }
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            给一家**非默认**门店清空围栏。`type` 为
            `https://keel.dev/problems/store-fence-required`。
            判据在服务端，不在数据库上（见本端点 description 末尾）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            多边形非法：环未闭合、自交、坐标越界、SRID 不对，或顶点数少于 4。
            `type` 为 `https://keel.dev/problems/invalid-fence`，
            `detail` 转述 PostGIS 的 `ST_IsValidReason`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/default:
    put:
      tags: [Admin, Store]
      summary: 设为默认门店（全国配送的回落目标）
      description: |
        **无请求体。** 调用即把这一家设成默认门店。

        服务端必须在**同一个事务**里「先清旧、再置新」——
        `uk_stores_default` 是一条部分唯一索引
        （`ON stores(merchant_id) WHERE is_default AND deleted_at IS NULL`），
        顺序反了会自己撞自己。这与 `PUT /addresses/{address_id}/default`
        是同一个形状与同一段论证（数据模型 §9 / §4）。

        没有「取消默认」这个动作：取消之后这家商家就没有回落目标了，
        而那是一个应该由「把默认改成另一家」表达的意图。真要清空，
        走 `DELETE /admin/stores/{store_id}`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: 已设为默认门店
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStore' }
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            这家门店已被软删或已停业，不能作为回落目标。`type` 为
            `https://keel.dev/problems/store-unavailable`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/products:
    get:
      tags: [Admin, Store, Catalog]
      summary: 这家店的商品可见性与生效价
      description: |
        **默认全卖。** 数据模型 §4：`store_product_overrides` 是一张排除表，
        缺一行即在售。所以这条列表是「租户目录左连两张排除表」，
        不是「读这家店的上架清单」——后者那张表不存在，而且刻意不存在
        （`CHECK (status = 0)` 让它在结构上表达不出「只卖这几件」）。

        每一项同时带上**生效价**与它来自哪一层（`price_source`：
        1 基准价 / 2 大区价 / 3 门店价），取自 `sku_prices_by_store` 视图——
        全仓库唯一一处写 `COALESCE(门店价, 大区价, 基准价)` 的地方。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: listed
          in: query
          description: |
            只看在售的（`true`）或只看本店已下架的（`false`）。
            **不传即两者都要**——刻意没有 default，缺省会静默改变筛选语义。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ScopedProductListing' }
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/products/{product_id}/listing:
    put:
      tags: [Admin, Store, Catalog]
      summary: 这家店卖不卖这件商品
      description: |
        `listed = false` 写一行 `store_product_overrides`，
        `listed = true` 删掉那一行（回到「缺省即在售」）。

        **幂等**：重复设成同一个值不报错，这也是为什么用 `PUT` 而不是
        POST/DELETE 两条——客户端不必先知道当前状态。

        **大区排除优先。** 一件被大区排掉的商品，门店这里设 `listed = true`
        也捞不回来（两层是**与**不是**或**）。这种情况下响应里的
        `effective_listed` 会是 `false` 而 `listed` 是 `true`，
        两个字段刻意分开——否则后台会显示「已上架」而买家看不到。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductListingRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedProductListing' }
        '404':
          description: 门店或商品不存在、不属于当前租户，或商品已软删。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/skus/{sku_id}/price:
    put:
      tags: [Admin, Store, Catalog]
      summary: 门店价（最内层覆盖）
      description: |
        写一行 `store_sku_prices`。**缺一行的意思是「沿用大区价 / 基准价」**，
        所以这条端点不接受 `null`——撤销覆盖走 `DELETE`。

        产品原话是「大区价格统一，但是每个门店可以自己调整价格」，
        这条端点就是那句话的后半句。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/SkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuPriceSetRequest' }
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedSkuPrice' }
        '404':
          description: 门店或 SKU 不存在、不属于当前租户，或 SKU 已软删。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `price_cents` 为负。非负同时由 `chk_store_price_nonneg` 兜底。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin, Store, Catalog]
      summary: 撤销门店价，回到上一层
      description: |
        删掉 `store_sku_prices` 那一行。之后这个 SKU 在这家店的价回到大区价，
        大区也没定就回到 `skus.price_cents`。

        **本来就没有那一行时返回 204，不是 404**：调用方的意图是
        「这家店不要自己的价」，那个意图在两种情况下都已经达成。
        404 留给「门店或 SKU 根本不存在」——那是一个真的错。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/SkuId'
      responses:
        '204':
          description: 已撤销（本来就没有覆盖时同样返回 204）
        '404':
          description: 门店或 SKU 不存在、不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/inventories:
    get:
      tags: [Admin, Store, Catalog]
      summary: 这家店的库存清单
      description: |
        `inventories` 的主键是 `(sku_id, store_id)`，列序是 `sku_id` 打头
        （热路径按 SKU 进入）。这条后台列表走的是另一条索引
        `idx_inventories_store ON inventories(merchant_id, store_id) WHERE available_qty > 0`。

        **注意那条索引的部分谓词**：它只收 `available_qty > 0` 的行。
        所以 `low_stock_only = true`（水位 ≤ `warning_qty`）走得到索引，
        而「列出全部、含 0 的」要回表——后者是低频的盘点视图，可以接受。

        **缺一行等于可售 0，不等于「这家店不卖」**（数据模型 §4 把这条写死了）。
        一家刚开的店在录库存之前每个 SKU 都缺行，这条列表要把它们显示成
        `available_qty = 0`，而不是漏掉。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: low_stock_only
          in: query
          description: 只看水位 ≤ `warning_qty` 的。不传即全部。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminInventory' }
        '404':
          description: 门店不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/stores/{store_id}/skus/{sku_id}/inventory:
    put:
      tags: [Admin, Store, Catalog]
      summary: 改这家店的库存（比较并设置）
      description: |
        **这是 `PUT /admin/skus/{sku_id}/inventory` 的一般形态。**
        库存主键变成 `(sku_id, store_id)` 之后，「这个 SKU 的库存」不再是一个
        有定义的东西，所以门店必须出现在路径里。那条不带门店的路径保留下来
        是为了单店商家（见它自己的描述）。

        语义与那条**逐字一致**：`expected_available_qty` 必填，
        服务端执行一条比较并设置

        ```sql
        UPDATE inventories
           SET available_qty = $new,
               warning_qty   = COALESCE($warn, warning_qty)
         WHERE sku_id = $sku AND store_id = $store AND available_qty = $expected;
        ```

        对不上就 409 并回传当前真实值。**`store_id` 这个条件不能漏**：
        漏了它会匹配到该 SKU 在**所有**门店的行，一次后台改价把五家店的库存
        一起覆盖掉，而且没有任何东西会响（数据模型 §4 把这条列为本轮
        最容易漏、后果最重的一处）。

        ### 这里的 404 覆盖三种情况，与下单路径上的分法不同

        · 门店不存在 / 不属于本租户
        · SKU 不存在 / 不属于本租户 / 已软删
        · **这家店把这件商品下架了**（`store_product_overrides`，或它所在大区排除了它）

        三种都是 404，因为这条路径上**两个 id 都在 URI 里**，
        「这个 URI 下没有这个资源」是 404 的本义。
        下单那条（`POST /orders`）把第三种报成 422，因为那里 id 在请求体里——
        分界线写在数据模型 §4：**路径里指名的资源不存在 → 404；
        请求体里指名的东西不存在或不可用 → 422**。两者的共同点才是要紧的：
        都不是 409，因为 409 在本契约里被客户端读成「重读一次再试」。

        **「这家店没有这一行库存」不在上面三种里**，它是一次正常的首次录入：
        服务端 upsert，`expected_available_qty` 必须传 `0`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/SkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventorySetRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInventory' }
        '404':
          description: |
            门店或 SKU 不存在 / 不属于当前租户 / 已软删，或这家店（或它所在大区）
            已把这件商品下架。**刻意与 409 分开**：把这些也报成 409 会让调用方
            以为重读一次再试就能成功，而那个循环永远不会结束。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `expected_available_qty` 与当前值不符——库存在你读到它之后被改过
            （多半是并发下单扣减）。`type` 为
            `https://keel.dev/problems/inventory-precondition-failed`，
            响应体里的 `current` 是当前的真实值。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/InventoryConflict' }
        '422':
          description: |
            `available_qty` 或 `expected_available_qty` 为负。
            非负同时由 `chk_qty_nonneg` 兜底。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/regions/{region_id}/products:
    get:
      tags: [Admin, Store, Catalog]
      summary: 这个大区的商品可见性与生效价
      description: |
        与 `GET /admin/stores/{store_id}/products` 同构，少一层覆盖：
        这里的 `price_cents` 是「基准价 → 大区价」两层之后的值，
        `price_source` 只会是 1 或 2。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: listed
          in: query
          description: 只看在售的（`true`）或只看本大区已下架的（`false`）。不传即两者都要。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ScopedProductListing' }
        '404':
          description: 大区不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/regions/{region_id}/products/{product_id}/listing:
    put:
      tags: [Admin, Store, Catalog]
      summary: 这个大区卖不卖这件商品
      description: |
        与门店那条同构，作用在 `region_product_overrides` 上。
        **这一层排掉的，下面的门店捞不回来。**
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductListingRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedProductListing' }
        '404':
          description: 大区或商品不存在、不属于当前租户，或商品已软删。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/regions/{region_id}/skus/{sku_id}/price:
    put:
      tags: [Admin, Store, Catalog]
      summary: 大区价（中间层覆盖）
      description: |
        写一行 `region_sku_prices`。产品原话是「一个大区内的商品是一个价格，
        不同大区内商品价格不一样」——这条端点就是那句话。
        门店可以再覆盖它（`PUT /admin/stores/{store_id}/skus/{sku_id}/price`）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/SkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuPriceSetRequest' }
      responses:
        '200':
          description: 已设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedSkuPrice' }
        '404':
          description: 大区或 SKU 不存在、不属于当前租户，或 SKU 已软删。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`price_cents` 为负。非负同时由 `chk_region_price_nonneg` 兜底。'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin, Store, Catalog]
      summary: 撤销大区价，回到基准价
      description: |
        删掉 `region_sku_prices` 那一行。本来就没有那一行时同样返回 204，
        理由与门店那条一致。
        **注意这不会动门店价**：门店那一层如果自己定了价，撤销大区价之后
        它仍然生效——覆盖是逐层独立的。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/SkuId'
      responses:
        '204':
          description: 已撤销（本来就没有覆盖时同样返回 204）
        '404':
          description: 大区或 SKU 不存在、不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Upload
  /admin/coupon-templates:
    get:
      tags: [Admin, Coupon]
      summary: 券模板列表（含发放与核销统计）
      description: |
        按创建时间倒序。每一项带发放与核销统计（`stats`）与适用范围（`scopes`）。

        **权限**：本期只开放给商家级的管理员与操作员（`staff.role` 为 1 或 2），
        平台级操作员与其他角色 403 `staff-forbidden`。券直接决定订单实付，是资金面。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 按启停筛选。不传即全部。
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCouponTemplate' }
        '403':
          description: 不是商家级管理员或操作员（`https://keel.dev/problems/staff-forbidden`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin, Coupon]
      summary: 新建券模板
      description: |
        按 `coupon_type` 填不同的字段，其余字段不填或填 0（数据模型 §7 的 `chk_coupon_rule`
        让每种券型只有一种写法）：

        | 券型 | 必填 | 必须为 0 / 不填 |
        |---|---|---|
        | 1 满减 | `threshold_cents ≥ discount_cents > 0` | `discount_rate`、`max_discount_cents` |
        | 2 折扣 | `discount_rate` ∈ [1, 999]（千分比，850 = 8.5 折）；`threshold_cents`、`max_discount_cents` 可选 | `discount_cents` |
        | 3 立减 | `discount_cents > 0` | `threshold_cents`、`discount_rate`、`max_discount_cents` |
        | 4 包邮 | `threshold_cents`（可为 0，比的是适用商品小计）、`max_discount_cents`（最多抵多少运费，0 = 全免）可选 | `discount_cents`、`discount_rate` |

        **包邮券抵的是运费**（00056 起可建）：适用范围与门槛的判法和别的券一样，
        抵扣额 = min(本单运费, `max_discount_cents`（0 为不封顶）)，所以运费最多抵到 0。
        本单运费为 0（满额包邮了、或商家没配运费模板）时这张券**不可用**——
        用掉一张一分钱没抵的券，比不让用更糟。

        有效期二选一：`valid_mode = 1` 绝对时间（`valid_start_at` < `valid_end_at`），
        `valid_mode = 2` 领取后 N 天（`valid_days > 0`）。

        新建的模板是启用的、默认**不可领**（`claimable = false`）：先配范围，再打开领券中心。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponTemplateCreateRequest' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCouponTemplate' }
        '403':
          description: 不是商家级管理员或操作员（`https://keel.dev/problems/staff-forbidden`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '422':
          description: |
            字段组合不成立（满 100 减 200、折扣率越界、有效期倒挂、包邮券带了减免额……）——
            `https://keel.dev/problems/invalid-request`；或同一 Idempotency-Key 配了不同的请求体。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/coupon-templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/CouponTemplateId'
    get:
      tags: [Admin, Coupon]
      summary: 券模板详情（含统计与范围）
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCouponTemplate' }
        '403':
          description: 不是商家级管理员或操作员。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 模板不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Admin, Coupon]
      summary: 修改 / 启停券模板
      description: |
        只改传了的字段。**停用**就是 `status = 0`：停止领取与定向发放，
        **不回收已发出的券**——它们照常可用到过期（已发出的券是对买家的承诺）。

        **已经发出过券（`issued_count > 0`）之后，决定券面价值的字段不能再改**：
        `coupon_type`、`threshold_cents`、`discount_cents`、`discount_rate`、
        `max_discount_cents`、`valid_*`。券实例不快照规则，改模板等于悄悄改掉买家手里的券。
        能改的是 `name`、`total_count`（不低于已发出数）、`per_user_limit`、`claimable`、`status`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponTemplatePatchRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCouponTemplate' }
        '403':
          description: 不是商家级管理员或操作员。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 模板不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            已经发出过券，却想改券面字段 —— `https://keel.dev/problems/coupon-template-locked`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 改完之后字段组合不成立（同新建），或 `total_count` 低于已发出数。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/coupon-templates/{template_id}/scopes:
    parameters:
      - $ref: '#/components/parameters/CouponTemplateId'
    put:
      tags: [Admin, Coupon]
      summary: 设置适用范围（整组替换）
      description: |
        整组替换：请求里的就是这张券的全部范围，空数组即「全场、全店」。

        | `scope_type` | 含义 | `target_id` |
        |---|---|---|
        | 1 | 全场 | 不填；不能是排除 |
        | 2 | 分类（**含子孙**，与 `GET /products?category_id=` 同一语义） | `categories.id` |
        | 3 | 商品 | `products.id` |
        | 4 | 品牌 | `products.brand_id` 的取值（本仓库没有品牌目录，不校验存在性） |
        | 5 | 大区（下单门店所属大区） | `regions.id` |
        | 6 | 门店（下单门店） | `stores.id` |

        `include = false` 是排除，**排除优先于包含**。1–4 决定订单里哪几行参与计算，
        5–6 决定在哪家店下单时这张券可用；某个维度没有包含规则即该维度不限。

        分类、商品、大区、门店四种的 `target_id` 在**当前租户**里逐条校验
        （数据模型 §7：`target_id` 是多态列，外键管不到它，校验在这里）。
        查不到、已软删、或属于别家店，整组 422，一条都不写。

        已经发出过券之后不能再改（409 `coupon-template-locked`），理由同 PATCH。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponScopesSetRequest' }
      responses:
        '200':
          description: 已替换
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCouponTemplate' }
        '403':
          description: 不是商家级管理员或操作员。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 模板不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 已经发出过券 —— `https://keel.dev/problems/coupon-template-locked`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            某条范围不成立：`target_id` 在本店查不到、全场规则带了 `target_id` 或设成排除、
            同一目标出现两次 —— `https://keel.dev/problems/invalid-request`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/coupon-templates/{template_id}/grants:
    parameters:
      - $ref: '#/components/parameters/CouponTemplateId'
    post:
      tags: [Admin, Coupon]
      summary: 按手机号定向发券
      description: |
        给每个手机号对应的买家发一张。**整批全有或全无**：有一个手机号在本店查不到买家，
        整批 422 并在 `detail` 里列出是哪几个，一张都不发——部分成功的批次会让运营
        分不清刚才发了谁，重试又会给已经发过的人再发一张。

        受总量约束（整批计：剩余不够整批就 409 `coupon-sold-out`），**不受每人限领约束**
        （那一条只管领券中心；定向发放是商家的明确意图）。模板已停用时 409 `coupon-template-disabled`。
        同一个手机号在一批里出现两次按两张发。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponGrantRequest' }
      responses:
        '201':
          description: 已发放
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponGrantResult' }
        '403':
          description: 不是商家级管理员或操作员。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 模板不存在或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 `type` 区分：剩余数量不够整批 —— `https://keel.dev/problems/coupon-sold-out`；
            模板已停用 —— `https://keel.dev/problems/coupon-template-disabled`；
            绝对时间模式下已过 `valid_end_at` —— `https://keel.dev/problems/coupon-claim-ended`；
            同一 Idempotency-Key 正在处理中 —— `https://keel.dev/problems/idempotency-key-in-flight`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            有手机号在本店查不到买家（`https://keel.dev/problems/invalid-request`，`detail` 列出它们），
            或同一 Idempotency-Key 配了不同的请求体。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- 运费模板（00055）
  /admin/freight-templates:
    get:
      tags: [Admin, Freight]
      summary: 运费模板列表
      description: |
        按 id 倒序。全店模板（`store_id` 为 null）与门店模板一起列出，
        `store_id` 查询参数只看某一家门店的那一个。

        **权限**：后台四种角色都能读（与商品目录同一个口径：大区 / 门店管理员
        要看得到商品挂的是哪个模板，才说得清一单的运费是怎么来的）。
        写的判据见 `POST`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: store_id
          in: query
          description: 只看这家门店的门店模板。不传即全部（全店模板 + 各门店模板）。
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminFreightTemplate' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin, Freight]
      summary: 新建运费模板
      description: |
        一个模板 = 计费方式 + 一组按地区分的计费规则 + 包邮条件 + 不配送地区。
        计算规则的唯一真相源是数据模型 §7「运费怎么算」，这里只说怎么填：

        · **计费方式** `charge_mode`：1 按件（`first_unit` / `additional_unit` 是件数）、
          2 按重量（单位是**克**，重量取 SKU 的 `weight_gram`）。
        · **规则** `rules`：每条规则管一组省级行政区（`region_codes`，6 位省级区划码，
          如 `110000` 北京、`650000` 新疆）。**恰好一条**规则的 `region_codes` 为空数组，
          它是「其余地区」的默认规则。同一个省只能出现在一条规则里。
          运费 = 首件（首重）费 + ⌈超出首件（首重）的部分 ÷ 续件（续重）单位⌉ × 续件（续重）费。
        · **包邮条件**挂在规则上（偏远地区可以不包邮，或门槛更高）：
          `free_threshold_cents` 满额包邮（0 = 不设），`free_quantity` 满件包邮（0 = 不设），
          两个都设时满足任一即包邮。满额比的是**整单优惠后应付商品金额**（营销活动与
          优惠券都减完之后），满件比的是整单件数。
        · **不配送地区** `undeliverable_region_codes`：这些省下单时对应的行报
          422 `region-not-deliverable`。不能与任何一条规则的 `region_codes` 重叠。

        **两种归属**：`store_id` 为 null 是**全店模板**——商品可以挂它，`is_default = true`
        的那一个是全店兜底；`store_id` 非 null 是**门店模板**——每家门店至多一个，
        这家店发货的、没有单独挂模板的商品按它算。一行商品用哪个模板：
        商品挂的模板 → 履约门店的门店模板 → 全店默认模板 → 都没有则这一行不计运费。

        **权限**（契约 `StaffRole` 矩阵「运费模板」那一行）：全店模板只有管理员与操作员
        （role 1、2）能写，理由同基准价——它决定全店每一单的运费；门店模板的判据同
        门店价（本大区的大区管理员、这家店的门店管理员也能写）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreightTemplateInput' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFreightTemplate' }
        '403':
          description: |
            角色不够（`https://keel.dev/problems/role-forbidden`）或门店不在管辖范围
            （`https://keel.dev/problems/out-of-scope`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 `type` 区分：这家门店已经有一个门店模板 ——
            `https://keel.dev/problems/freight-template-conflict`；
            同一 Idempotency-Key 正在处理中 —— `https://keel.dev/problems/idempotency-key-in-flight`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            模板不成立（没有或多于一条默认规则、区划码不认识、同一个省出现两次、
            门店模板设成全店默认、`store_id` 指向的门店不存在……）——
            `https://keel.dev/problems/invalid-request`；或同一 Idempotency-Key 配了不同的请求体。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/freight-templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/FreightTemplateId'
    get:
      tags: [Admin, Freight]
      summary: 运费模板详情
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFreightTemplate' }
        '404':
          description: 模板不存在、已删除或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [Admin, Freight]
      summary: 修改运费模板（整体替换）
      description: |
        **整体替换**：请求体就是这个模板的全部内容，规则与不配送地区整组换掉。
        规则之间互相约束（恰好一条默认、省不重叠），增量改一条规则的接口
        会让「中间态不成立」这件事无处安放。PUT 天然幂等，不收 Idempotency-Key。

        改动**只影响之后的试算与下单**：已下的订单在 `orders.freight_snapshot` 里
        记着下单那一刻用的规则（数据模型 §5），不会被改写。

        可以在全店与门店之间改归属（`store_id`），判权新旧两边都要过。
        全店模板改成门店模板时，若还有商品挂着它则 409（商品只能挂全店模板）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FreightTemplateInput' }
      responses:
        '200':
          description: 已替换
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFreightTemplate' }
        '403':
          description: 角色不够或门店不在管辖范围（同 `POST`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 模板不存在、已删除或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            这家门店已经有别的门店模板 —— `https://keel.dev/problems/freight-template-conflict`；
            要改成门店模板而仍有商品挂着它 —— `https://keel.dev/problems/freight-template-in-use`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 模板不成立（同 `POST`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Admin, Freight]
      summary: 删除运费模板（软删）
      description: |
        置 `deleted_at`。**还有商品挂着它时拒绝（409）**：静默解除关联会让那些商品
        悄悄落回门店模板或全店默认，运费变了而商家不知道。先把商品改挂别的模板。

        删掉全店默认模板是允许的：之后没挂模板、所在门店也没有门店模板的商品不计运费。
        历史订单不受影响（运费规则快照在订单上）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      responses:
        '204':
          description: 已删除
        '403':
          description: 角色不够或门店不在管辖范围（同 `POST`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 模板不存在、已删除或不属于当前租户。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 还有商品挂着它 —— `https://keel.dev/problems/freight-template-in-use`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /uploads:
    post:
      tags: [Upload]
      summary: 上传文件（买家）
      description: |
        买家上传头像或退款凭证，返回可直接写入业务字段的 `url`。要登录（买家 access_token），
        上传者记为当前买家（`uploads.user_id`）。

        **`purpose` 只收 `2 头像` 与 `3 退款凭证`**；`1 商品图` 回 422 —— 商品图是后台操作员传的，
        走 `POST /admin/uploads`（上传者记 `staff_id`，数据模型 §13 / §14 的「两条路」）。

        **限制**（服务端强制，与 `POST /admin/uploads` 逐条一致，写在这里是为了让客户端不必靠试错发现）：
        - 单文件不超过 **10 MB**，超出返回 413
        - `content_type` 仅接受 `image/jpeg`、`image/png`、`image/webp`，其余返回 415
        - `Idempotency-Key` 必填。请求哈希认的是**文件内容**（sha256）、声明的类型、大小与 `purpose`：
          同一把钥匙重传同一个文件拿到首次的结果，换了文件回 422

        **可见性**（见 `GET /uploads/{upload_id}`）：头像所有人可读；退款凭证只有上传者本人
        （带自己的 access_token）与后台客服（`GET /admin/uploads/{upload_id}`）可读。

        **文件的生命周期**：上传后文件处于「未被引用」状态。只有当它被写入某个业务
        对象（商品主图、`PATCH /me` 的 `avatar_url`、退款申请的 `evidence_urls`）
        并成功落库后才算被引用。**超过 24 小时仍未被引用的文件会被清理任务删除**——
        所以拿到 `url` 之后请尽快提交对应的表单。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose: { $ref: '#/components/schemas/UploadTarget' }
                file:
                  type: string
                  format: binary
                  description: 文件内容，不超过 10 MB
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: 上传成功
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401':
          description: 未登录
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '413':
          description: |
            文件超过 10 MB。Problem `type` 为 `upload-too-large`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: |
            `content_type` 不在允许列表内。Problem `type` 为
            `upload-unsupported-media-type`，`detail` 中列出允许的类型。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · `purpose` 缺失、不是 2 / 3（`1 商品图` 走 `POST /admin/uploads`），
              或请求体里没有 `file`、文件为空、缺 `Idempotency-Key` —— .../invalid-request
            · 同一 Idempotency-Key 配了不同的文件 —— .../idempotency-key-reused
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /uploads/{upload_id}:
    get:
      tags: [Upload]
      summary: 读取文件
      description: |
        **这个端点是归属校验的落点。** 文件不按公开静态资源直接暴露，
        而是走这里——服务端按 `uploads.user_id` 与 `purpose` 判定调用者可否读取：

        | purpose | 可读者 |
        |---|---|
        | 1 商品图 | 所有人（上架商品的图本就公开） |
        | 2 头像 | 所有人 |
        | 3 退款凭证 | **仅上传者本人与后台客服** |

        退款凭证是隐私内容，而 URL 会被转发、被日志记录、被截图。
        把它当静态文件发出去，等于任何拿到 URL 的人都能看别人的退货照片
        （见数据模型 §12）。

        **鉴权是可选的**：读公开的两类不用带令牌；读退款凭证时，上传者本人要带
        自己的 access_token（`Authorization: Bearer`）—— 没带、或者带的是别人的，都是 403。
        带了令牌但令牌无效 / 过期 / 不属于本店时回 401（与别的买家接口同一套判定），
        不会悄悄当成匿名。后台客服读凭证走 `GET /admin/uploads/{upload_id}`，不走这里
        （后台接口一律挂在 `/admin/` 前缀下，鉴权按路径前缀挂）。

        小程序的 `<image>` 带不了请求头，所以读自己的凭证要先用带令牌的请求
        （如 `uni.downloadFile` 的 `header`）拿到这里的 302，再用限时地址显示。

        响应为 302，跳转到 driver 生成的**限时**地址：本地磁盘 driver 跳到
        带签名与过期时间的站内地址，S3 driver 跳到预签名 URL。
        两种 driver 都不返回长期有效的裸路径。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '302':
          description: 跳转到限时访问地址
          headers:
            Location:
              description: 限时地址，默认有效期 5 分钟
              schema: { type: string }
        '401':
          description: 带了令牌，但令牌无效、过期或不属于本店
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            无权读取该文件（典型情况：他人的退款凭证，或者读退款凭证却没带令牌）。
            刻意返回 403 而非 404 —— 文件 id 是自增的，用 404 掩盖存在性
            并不能阻止枚举，反而让合法用户分不清「没权限」和「传错了 id」。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: 文件不存在或已被孤儿回收清理
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- User
  /me:
    get:
      tags: [User]
      summary: 当前用户资料
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [User]
      summary: 修改资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nickname:   { type: string, maxLength: 32 }
                avatar_url: { type: string }
                gender:
                  type: integer
                  description: '0 未知 / 1 男 / 2 女'
                  enum: [0, 1, 2]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422':
          description: 字段校验失败（见 Problem.errors）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/identities:
    get:
      tags: [User]
      summary: 已绑定的第三方身份
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserIdentity' }
        default: { $ref: '#/components/responses/Problem' }

  /me/identities/wechat:
    post:
      tags: [User]
      summary: 绑定微信身份
      description: |
        已登录状态下补绑微信。unionid 用于打通小程序 / 公众号 / H5 ——
        同一个人在不同 appid 下 openid 不同，只有 unionid 能认成一个人。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                provider:
                  $ref: '#/components/schemas/IdentityProvider'
                  default: 1
      responses:
        '201':
          description: 绑定成功
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserIdentity' }
        '409':
          description: |
            · 该微信身份已绑定到另一账号（对应 `UNIQUE (provider, external_id)`）——
              type=https://keel.dev/problems/identity-already-bound
            · 当前账号在该 provider 下已有绑定 ——
              type=https://keel.dev/problems/identity-duplicate-provider
            · 同一 Idempotency-Key 正在处理中 ——
              type=https://keel.dev/problems/idempotency-key-in-flight
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /me/identities/{provider}:
    delete:
      tags: [User]
      summary: 解绑第三方身份
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IdentityProvider' }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            解绑后账号将没有任何可登录凭据（既无密码也无其他身份），拒绝解绑。
            type=https://keel.dev/problems/last-credential
            —— 数据模型文档 §8 说明了这条约束跨表、只能由代码兜。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/phone:
    post:
      tags: [User]
      summary: 绑定 / 换绑手机号
      description: 手机号是主登录态。换绑后原号码即可被其他账号注册。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code:  { type: string, description: 新号码收到的短信验证码 }
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: 验证码错误或已过期
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            · 该手机号已被其他账号占用（对应 `uk_users_phone` 部分唯一索引）——
              type=https://keel.dev/problems/phone-already-taken
            · 同一 Idempotency-Key 正在处理中 ——
              type=https://keel.dev/problems/idempotency-key-in-flight
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Notification（买家消息中心）
  /me/notifications:
    get:
      tags: [Notification]
      summary: 我的消息（站内通知）
      description: |
        订单与售后的关键状态变化产生的站内通知，按时间倒序（数据模型 §16）。
        **标题与正文由服务端渲染好**（中文），客户端原样展示，不要按 `kind` 自己拼文案 ——
        `kind` 只用来挑图标、决定点了跳哪里。点了跳哪里看 `target`。

        只看得到**自己的**通知：同一家店里 A 买家读不到 B 买家的（按令牌里的 user_id 过滤）。

        哪些状态变化会发通知、发给谁，见 `NotificationKind` 的描述。
        通知保留 90 天，更早的会被清理。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unread_only
          in: query
          description: 为 `true` 时只返回未读的。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/notifications/unread-count:
    get:
      tags: [Notification]
      summary: 我的未读消息数
      description: 给「我的」页与底栏角标用的轻量接口，只回一个数。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        '401': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/notifications/{notification_id}/read:
    post:
      tags: [Notification]
      summary: 标记一条消息已读
      description: |
        幂等：已经读过的再标一次照样 200，已读时间不变。
        不是自己的通知（或不存在）一律 404，不区分两者。
        响应是标完之后的未读数，客户端据此刷新角标，不必再调一次未读数接口。
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/notifications/read-all:
    post:
      tags: [Notification]
      summary: 全部标记已读
      description: 把自己的未读消息全部标成已读。响应是标完之后的未读数（正常为 0）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        '401': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Address
  /addresses:
    get:
      tags: [User]
      summary: 地址簿
      description: 默认地址排在首位，其余按更新时间倒序。已软删的地址不返回。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [User]
      summary: 新增地址
      description: |
        `is_default=true` 时服务端在同一事务里先清旧默认、再置新，
        与「每用户至多一个默认地址」的部分唯一索引保持一致。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '422':
          description: |
            字段校验失败（见 Problem.errors），或同一 Idempotency-Key 配了不同请求体
            （type=https://keel.dev/problems/idempotency-key-reused）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /addresses/{address_id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    get:
      tags: [User]
      summary: 地址详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [User]
      summary: 修改地址
      description: |
        整体替换。**不要用本接口把 `is_default` 从 false 改成 true** ——
        切换默认地址请用 `PUT /addresses/{address_id}/default`，理由见该接口说明。
        本接口收到 `is_default=true` 且当前不是默认地址时返回 422。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: |
            字段校验失败，或试图通过本接口切换默认地址
            （type=https://keel.dev/problems/use-default-endpoint）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [User]
      summary: 删除地址
      description: |
        软删（写 `deleted_at`）。地址与订单是快照关系而非外键，
        删除不影响任何历史订单的收货信息。
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /addresses/{address_id}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [User]
      summary: 设为默认地址
      description: |
        **互斥切换**：服务端在同一事务里「先清旧默认、再置新」。

        之所以做成专用接口而不是让客户端 PUT `is_default=true`：
        数据库上有「每用户至多一个默认地址」的部分唯一索引
        （`user_addresses(user_id) WHERE is_default AND deleted_at IS NULL`），
        由客户端自己保证唯一性时，并发点两下会直接撞唯一冲突报 500。
        把切换动作收进一个接口，唯一性由服务端事务负责。

        幂等：对已是默认的地址重复调用返回 200，不报错。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Store
  #
  # 买家侧只有两条：列出门店、按位置选店。
  #
  # **「当前门店」在这个契约里永远有一个确定的值**，解析链是：
  #   客户端显式给的 store_id  >  按位置解析出的门店  >  默认门店（全国配送）
  # 三级都落空（商家没配默认门店）才是「不在服务范围」。
  #
  # 这条链的第二级与第三级**在实现上是同一条路径**：「没有位置」与
  # 「位置不在任何围栏内」走同一段代码、给同一种答案。给「没有位置」单开一条
  # 分支是这块最容易长出来的分歧——两条分支迟早只更新一条。
  /stores:
    get:
      tags: [Store]
      summary: 门店列表（手动选店用）
      description: |
        只返回 `status = 1 营业` 且未软删的门店。

        这条端点的存在理由是 `/stores/resolve` 的回落：拒绝定位的买家会被落到
        默认门店，而他应该能自己改。没有这条，「回落」就成了一个用户无法
        纠正的结果。
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Store' }
        default: { $ref: '#/components/responses/Problem' }

  /stores/resolve:
    get:
      tags: [Store]
      summary: 按位置选店
      description: |
        ### 三种结果，由 `match_type` 区分，**不由 HTTP 状态码区分**

        | `match_type` | 什么时候 | `stores` |
        |---|---|---|
        | `fence` | 坐标落在一个或多个门店的电子围栏内 | 命中的全部门店，**按距离升序** |
        | `fallback_default` | 坐标不在任何围栏内，**或根本没传坐标** | 只有默认门店那一家 |
        | `none` | 上面两条都落空——商家还没配默认门店 | 空数组 |

        **三种都是 `200`。** 「不在服务范围」是一个正常的查询结果，不是错误；
        用 404 表达它会让客户端的错误分支同时装着「网络失败」「鉴权失败」
        和「这个地方我们不送」，而第三种要渲染的是一个完全不同的页面。

        ### 不传 `lat` / `lng` 与「坐标在围栏外」是同一条路径

        首次打开 App、拒绝授权定位、或者就是在浏览——一律走回落。
        这不是两条相似的规则，是**一条规则**：服务端的实现要收敛到同一段代码，
        而契约这边的约束是「两种输入的响应必须逐字段相同」。
        这条有机械执行者（数据模型 §4 那张表）：一条 handler 测试，
        拿不带坐标的请求与一个落在全部围栏外的坐标各调一次，断言两次响应的
        `match_type` 与 `stores` 完全相等。

        ### 围栏重叠时返回多家，由客户端处理

        运营可以画出互相重叠的围栏，这是产品要的（商圈交叠）。
        服务端**不替客户端挑**，只保证 `distance_m` 升序——
        挑哪一家涉及配送时效、是否自提、用户上次选过谁，那些服务端不知道。
        `distance_m` 是买家坐标到 `stores.location`（门店自身坐标）的球面距离，
        单位米，由 PostGIS 的 `GEOGRAPHY` 算出（不是把经纬度当平面算的「度」，
        理由见数据模型 §4）。

        ### `size` 的含义

        只在 `match_type = fence` 时有意义：重叠围栏最多返回这么多家。
        `fallback_default` 恒为 1 家，`none` 恒为 0 家。
      security: []
      parameters:
        - name: lat
          in: query
          description: |
            纬度，WGS84。与 `lng` **同时给或同时不给**；只给一个返回 422。
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          description: 经度，WGS84。
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: size
          in: query
          description: 围栏命中时最多返回几家，默认 10。
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: |
            解析完成。**三种结果都走这里**，看 `match_type`，
            包括「不在服务范围」（`none`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreResolveResult' }
        '422':
          description: |
            只给了 `lat` 与 `lng` 中的一个，或取值超出范围。
            `type` 为 `https://keel.dev/problems/invalid-request`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Catalog
  /products:
    get:
      tags: [Catalog]
      summary: 商品列表
      description: |
        ### 这条接口的结果取决于哪家门店服务你

        多门店之后，「这家店卖哪些商品、各卖多少钱、有没有货」是三件都按门店
        变化的事（数据模型 §4：可见性两层排除、价格三层覆盖、库存按门店）。
        所以响应里必返一个 `store` 上下文——**没有它，客户端拿到的
        `in_stock` 与价格是不知道属于谁的**。

        ### 与 `POST /search` 的口径本轮对齐了（M3 独立验收 I10）

        I10 记的是：`/products` 与 `/search` 对「这家店有哪些商品」给不同答案——
        `SearchFilters.in_stock_only` 的默认值是 `true`（缺货的直接不返回），
        而 `/products` 根本没有这个条件。按门店分之后这件事会放大成
        「搜索结果取决于哪家店服务你」，再叠一层「还取决于你走的是列表还是搜索」。

        本轮把两条拆成两个**互相独立**的维度，两边逐字一致：

        | 维度 | 是硬过滤吗 | 可以关掉吗 |
        |---|---|---|
        | **门店/大区上下架**（`*_product_overrides`） | 是。这家店不卖就是不卖 | 不能。它是可见性本身 |
        | **库存水位**（`available_qty > 0`） | 否，默认**不**过滤 | 可以，`in_stock_only = true` 打开 |

        `in_stock_only` 的默认值因此从 `true` 改成 `false`，两条接口一致。
        理由不只是「要一致」：契约原先把同一件事写了两遍且互相矛盾——
        `/search` 的描述写着「业务重排会将缺货、活动失效、负毛利商品**降权**」，
        而 `in_stock_only: true` 说的是**删掉**。两者并存时默认值那一份赢，
        于是「降权」那句话从来没被执行过。
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: store_id
          in: query
          description: |
            按哪家门店算「卖不卖」「多少钱」「有没有货」。

            **不传不是「全租户并集」，是走回落链**：
            服务端按 `GET /stores/resolve` 的同一段逻辑解析出默认门店
            （数据模型 §4 与那条端点的描述：「没有位置」与「位置不在任何围栏内」
            是同一条路径）。商家没配默认门店时，本接口返回**空列表**，
            并在响应的 `store.match_type` 里给出 `none`——
            那不是「这家店没有商品」，是「你不在服务范围」，
            客户端要渲染的是完全不同的页面。

            **刻意没有 default**：查询参数带 default 会被静默代入，
            而这个参数改变的正是「返回哪些行」。
          schema: { type: integer, format: int64 }
        - name: in_stock_only
          in: query
          description: |
            只看当前门店有货的。**不传即 `false`**（不按库存过滤，缺货商品照常
            返回，由 `in_stock` 标出）。与 `SearchFilters.in_stock_only` 同义、
            同默认值——见上方 I10 那一段。
          schema: { type: boolean }
        - name: category_id
          in: query
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          description: 排序字段
          schema:
            type: string
            enum: [default, price_asc, price_desc, sales_desc, newest]
            default: default
        - name: min_price_cents
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: max_price_cents
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items, store]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }
                      store:
                        allOf: [{ $ref: '#/components/schemas/StoreContext' }]
                        description: |
                          本次结果是按哪家门店算的。**必返。**
                          `match_type = none` 时 `items` 是空数组——
                          那是「不在服务范围」，不是「没有商品」。
        default: { $ref: '#/components/responses/Problem' }

  /products/{product_id}:
    get:
      tags: [Catalog]
      summary: 商品详情（含全部 SKU）
      description: |
        `store_id` 的解析与 `GET /products` 逐字一致。
        SKU 的 `price_cents` 与 `available_qty` 都是**这家门店**的值。

        **这家店不卖这件商品时返回 404**，不是返回一个 `in_stock = false` 的详情页：
        「不卖」与「缺货」是两件事，混在一起会让买家一直等一个不会来的补货
        （数据模型 §4）。
      security: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: store_id
          in: query
          description: |
            按哪家门店算「卖不卖」「多少钱」「有没有货」。

            **不传不是「全租户并集」，是走回落链**：
            服务端按 `GET /stores/resolve` 的同一段逻辑解析出默认门店
            （数据模型 §4 与那条端点的描述：「没有位置」与「位置不在任何围栏内」
            是同一条路径）。商家没配默认门店时，本接口返回**空列表**，
            并在响应的 `store.match_type` 里给出 `none`——
            那不是「这家店没有商品」，是「你不在服务范围」，
            客户端要渲染的是完全不同的页面。

            **刻意没有 default**：查询参数带 default 会被静默代入，
            而这个参数改变的正是「返回哪些行」。
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404':
          description: |
            商品不存在、不属于当前租户、已软删、未上架，**或当前门店（或它所在
            大区）不卖这件商品**。四种合成一个 404，理由与 §2「查不到即 404，
            不是 403」一致：分开告诉调用方等于替它做枚举。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /categories:
    get:
      tags: [Catalog]
      summary: 分类树
      description: |
        只返回 `status = 1 启用` 且未软删的分类。后台要看停用的那些，
        走 `GET /admin/categories`（扁平，含停用）。
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        # 本轮补的。这条原先只声明了 200 —— 一个连「我失败了」都说不出来的接口，
        # 客户端照契约生成出来的类型里没有任何错误分支可走。
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Search
  /search:
    post:
      tags: [Search]
      summary: 语义 + 关键词混合检索
      description: |
        四层流水线：双路召回 → RRF 融合 → Reranker 精排 → 业务重排。
        业务重排会将缺货、活动失效、负毛利商品降权 —— 这是与通用向量检索的核心区别。

        ### 检索结果取决于哪家门店服务你

        `store_id` 与 `GET /products` 逐字同义、同回落链。两条召回查询
        （`SearchProductsByVector` / `SearchProductsByKeyword`）的过滤条件
        **必须逐字一致**，这是 `db/queries/search.sql` 文件头的老要求，
        本轮多了两个 anti-join（大区排除、门店排除）与一次对
        `sku_prices_by_store` 的价格联接，两条都要加，不能只加一条——
        不一致的后果不是报错，是一件商品在一路里可见、在另一路里不可见，
        而 RRF 只看名次。

        `in_stock_only` 的默认值本轮从 `true` 改成 `false`，与 `/products` 对齐，
        理由写在那条端点的描述里（M3 独立验收 I10）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, latency_ms, strategy, store]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  store:
                    allOf: [{ $ref: '#/components/schemas/StoreContext' }]
                    description: |
                      本次检索是按哪家门店算的。**必返**，与 `GET /products`
                      的 `store` 逐字同义。`match_type = none` 时 `items`
                      是空数组——那是「不在服务范围」，不是「没搜到」。
                  latency_ms: { type: integer }
                  total:
                    type: integer
                    description: |
                      本次召回并排序后的结果总数（上限即 `size`）。
                      **一期不支持翻页**——检索走「召回 → 融合 → 精排 → 业务重排」
                      的流水线，翻页要么重跑整条流水线，要么缓存中间结果，
                      两者都不是一期该付的成本。需要更多结果就调大 `size`。
                  strategy:
                    type: string
                    description: |
                      本次实际生效的策略标识（回显）。服务端做分流时，
                      客户端必须知道自己落到了哪一桶，否则埋点对不上。
                  trace_id:
                    type: string
                    pattern: '^[0-9a-f]{32}$'
                    description: |
                      本次检索在 `search_logs` 里那一行的定位键（128 位随机数的十六进制，
                      不可枚举）。客户端在用户点击 / 加购 / 下单**这一次检索返回的商品**时，
                      把它原样带给 `POST /search/events`。不透明，不要解析、不要自己造。

                      **可能缺席**：检索日志写失败时不回。日志是辅助数据，写失败不让
                      检索失败（语义检索层 §8）；而回一个库里没有的 id，只会让这次检索
                      之后的每一次回传都 404。缺席时客户端**跳过回传**即可，不要重搜。
        default: { $ref: '#/components/responses/Problem' }

  /search/events:
    post:
      tags: [Search]
      summary: 搜索行为回传
      description: |
        回传点击 / 加购 / 下单事件，回填 `search_logs` 那一行的 `clicked_id` /
        `carted_id` / `ordered_id`（事件 `click` / `add_cart` / `order` 各对一列）。

        没有这个接口，语义检索层设计 §9.2 的在线指标——首屏点击率 CTR@10、
        搜索→加购率、搜索→下单转化率——**一个都算不出来**。
        而「埋点成本极低、补埋成本极高」正是数据模型文档自己强调的。

        `trace_id` 用 `/search` 响应里那个，正好把一次搜索和它的后续行为串起来。

        ### 公开，与 `/search` 一样

        `security: []`：没登录的访客也在搜、也在点，只收登录用户的回传会让
        CTR 只统计到一个有偏的子集。租户仍由 Host 定，`search_logs` 上有 RLS——
        别家店的 `trace_id` 在这里与不存在的 `trace_id` 是同一个 404。

        ### 防刷指标：只认这次检索真正返回过的商品

        `product_id` 必须在这次检索**真正返回的那几条**（`search_logs.ranked_ids`）里，
        否则 422、一列都不写。一个公开接口若接受任意商品 id，任何人都能拿一个
        `trace_id` 把某件商品的「点击」刷上去。

        ### 幂等：每一列首次写入为准，**不接受 `Idempotency-Key`**

        同一次检索的同一种事件只记第一次：`clicked_id` 已有值时再报 `click`
        （不论是不是同一件商品）返回 204，但不覆盖。于是重放与首次效果相同，
        重试是安全的——这是**天然幂等**，不需要幂等键：幂等键的作用域是
        `(接口, user_id, key)`，而这条公开接口上多半没有 `user_id`；
        存档重放也只会把一个 204 存下来再回放一遍。

        「首次」的语义对指标是对的：CTR@10 问的是「这次检索有没有被点」，
        记住第一次点的是哪件（它在 `ranked_ids` 里的名次）正好够算 MRR；
        一次下单里有多件商品时也只记第一件——「这次检索有没有带来下单」是一个是非题。

        ### 失败不影响业务

        回传是辅助数据：任何非 2xx 客户端都可以忽略，**不要重试 4xx**、
        不要因此打断点击 / 加购 / 下单本身。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trace_id, event, product_id]
              properties:
                trace_id:
                  type: string
                  pattern: '^[0-9a-f]{32}$'
                  description: '`POST /search` 响应里的 `trace_id`，原样带回'
                event:
                  type: string
                  enum: [click, add_cart, order]
                product_id:
                  type: integer
                  format: int64
                  description: |
                    被点击 / 加购 / 下单的商品。必须是这次检索返回的 `items[].id` 之一。
      responses:
        '204':
          description: |
            已记录；或这一列此前已经记过（首次为准，本次不覆盖）。两者不区分：
            客户端对两者该做的事一样——什么都不用做。
        '404':
          description: |
            `trace_id` 不存在，或不属于当前店铺。两者合成一个 404，
            理由同 §2「查不到即 404，不是 403」。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            请求体不合法（缺字段、`event` 不在枚举里、`trace_id` 形状不对），
            或 `product_id` 不是这次检索返回过的商品。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: 按来源 IP 限流（与 `/search` 各自一只桶），带 `Retry-After`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /assistant/chat:
    post:
      tags: [Search]
      summary: 对话式导购
      description: |
        **设计原则：LLM 只做意图理解与话术生成，绝不生成商品。**
        返回的商品一定来自真实检索结果。

        写操作（退款/改地址/取消订单）**不在此接口执行**，
        而是返回 `action` 字段，由前端跳转到对应表单并预填参数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 500 }
                session_id:
                  type: string
                  description: 省略则新建会话
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Cart
  /cart:
    get:
      tags: [Cart]
      summary: 购物车
      description: |
        返回当前买家的整辆车，按加购时间倒序。**失效的行不会被静默丢掉**
        （数据模型 §10：「下架、删除的商品不从购物车里清掉，查询时标记为失效」），
        每一行的 `status` 说明它现在能不能买、为什么不能。
      parameters:
        - $ref: '#/components/parameters/CartStoreId'
        - $ref: '#/components/parameters/CartAddressId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: |
            `store_id` 指向的门店不存在或不属于当前店铺，或 `address_id` 指向的地址不存在或
            不属于你（`https://keel.dev/problems/invalid-request`）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Cart]
      summary: 清空购物车
      responses:
        '204': { description: No Content }
        default: { $ref: '#/components/responses/Problem' }

  /cart/items:
    post:
      tags: [Cart]
      summary: 加入购物车
      description: |
        若该 `sku_id` 已在车中，则**数量累加**（`cart_items` 上有
        `UNIQUE (cart_id, sku_id)`，重复加购必然走合并路径），并把这一行重新勾选上。
        累加后超过 999 返回 422，不做静默截断。

        加购按 `store_id` 那家店判「卖不卖」与「够不够」：这家店（或它所在大区）
        不卖、商品已下架或规格已删除，返回 422；累加后的数量超过这家店的可售量，返回 409。
        这两条只在**加购这一刻**判——车里已有的行之后缺货或下架，不会被删，
        而是在 `GET /cart` 里以 `status` 标出来。

        一辆车至多 100 种商品（不同的 `sku_id`），第 101 种返回 422
        （`https://keel.dev/problems/invalid-request`）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CartStoreId'
        - $ref: '#/components/parameters/CartAddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_id, quantity]
              properties:
                sku_id: { type: integer, format: int64 }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: |
            · 库存不足（累加后超过这家店的可售量）—— `https://keel.dev/problems/insufficient-stock`
            · 同一 Idempotency-Key 正在处理中 —— `https://keel.dev/problems/idempotency-key-in-flight`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · 累加后数量超过 999。Problem `type` 为
              `https://keel.dev/problems/cart-quantity-exceeded`，
              `detail` 给出当前数量与上限。不做静默截断——
              客户端以为加了 5 件、实际只加了 2 件，比报错更糟。
            · 这家店（或它所在大区）不卖这件商品 —— `https://keel.dev/problems/sku-not-sold-in-store`
            · SKU 不存在、已停售、所属商品未上架，购物车已满 100 种，或 `store_id` 不认识
              —— `https://keel.dev/problems/invalid-request`
            · 同一 Idempotency-Key 配了不同的请求体 —— `https://keel.dev/problems/idempotency-key-reused`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cart/selection:
    put:
      tags: [Cart]
      summary: 批量勾选 / 取消勾选
      description: |
        `item_ids` 省略即对全车生效（全选 / 全不选）。
        有了这个接口，20 条的购物车做一次「全选」是 1 个请求而不是 20 个。

        `item_ids` 里只要有一个不在当前买家的车里（含别人车里的条目），整个请求
        返回 404、一行都不改——不是改掉认得的那几行再报错。
      parameters:
        - $ref: '#/components/parameters/CartStoreId'
        - $ref: '#/components/parameters/CartAddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected: { type: boolean }
                item_ids:
                  type: array
                  description: 省略则作用于全部条目
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: item_ids 中存在不属于当前用户购物车的条目
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cart/items/batch-delete:
    post:
      tags: [Cart]
      summary: 批量删除购物车条目
      description: |
        有了勾选之后，「删除选中」是标准操作。二选一：给 `item_ids`
        删除指定条目，或给 `selected: true` 删除全部已勾选条目。
        两者都不给返回 422。

        用 POST 而不是 `DELETE /cart/items?ids=1,2,3`，是因为条目多时
        查询串会超长，且 DELETE 带 body 在部分网关与客户端上行为不一致。

        `item_ids` 里有不在当前买家车里的条目时整个请求返回 404、一行都不删，
        与 `PUT /cart/selection` 同一条规矩。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CartStoreId'
        - $ref: '#/components/parameters/CartAddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                item_ids:
                  type: array
                  items: { type: integer, format: int64 }
                selected:
                  type: boolean
                  description: 为 true 时删除全部已勾选条目，与 `item_ids` 互斥
      responses:
        '200':
          description: 删除后的购物车
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: item_ids 中存在不属于当前用户购物车的条目
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '422':
          description: |
            两个字段都没给、同时给了、或 `selected` 给了 false；
            或同一 Idempotency-Key 配了不同的请求体（`https://keel.dev/problems/idempotency-key-reused`）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cart/items/{item_id}:
    patch:
      tags: [Cart]
      summary: 修改数量 / 勾选状态
      description: |
        `quantity` 与 `selected` 都可选，但至少传一个。
        勾选态存在服务端（`cart_items.selected`），换设备打开购物车不会丢。

        **调大**数量时按 `store_id` 那家店判库存，超过可售量返回 409；
        **调小**数量永远放行——车里 5 件、店里只剩 2 件时，用户把 5 改成 4
        不该被拒，那正是他在往能买的方向改。

        条目不在当前买家的车里（含别人车里的条目）返回 404，不是 403。
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/CartStoreId'
        - $ref: '#/components/parameters/CartAddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity: { type: integer, minimum: 1, maximum: 999 }
                selected: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: 条目不在当前买家的购物车里
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 库存不足
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 请求体为空（quantity / selected 至少传一个），或数量不在 [1, 999] 内
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Cart]
      summary: 删除条目
      description: 条目不在当前买家的购物车里（含别人车里的条目）返回 404，不是 403。
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }
        '404':
          description: 条目不在当前买家的购物车里
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Order
  /orders/preview:
    post:
      tags: [Order]
      summary: 下单预览（试算金额与可用券）
      description: |
        **不产生副作用**。返回试算后的金额明细与优惠分摊结果。
        前端据此展示「应付金额」，用户确认后再调 `POST /orders`。

        `store_id` 与 `POST /orders` 一样**必填**：试算与下单必须是同一家店，
        否则用户看到的是 A 店的价、成交的是 B 店的价。
        请求体共用 `OrderCreateRequest`，这一点本轮没变。

        **运费（00056 起）按 `address_id` 那个收货地址算**，与下单同一份实现。
        计价顺序固定为：商品原价 → 营销活动 → 优惠券（门槛按活动后金额判）→ 运费
        （满额包邮按优惠后应付商品金额判）→ 包邮券抵运费（数据模型 §7「优惠计算顺序」）。

        试算会把「这家店（或它所在大区）不卖其中某几件」提前报出来（422），
        所以正常路径上 `POST /orders` 不该再撞上它。
        **但仍然会撞上**——运营随时可以在两次调用之间下架一件商品，
        那是一次正常的竞态，不是 bug。两条端点因此都要能表达这种失败。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPreview' }
        '409':
          description: |
            带的 `user_coupon_id` 本单不可用 —— `https://keel.dev/problems/coupon-not-applicable`，
            `detail` 说明原因（门槛不够、范围不含、已锁定 / 已使用 / 已过期、不是你的券）。
            与 `POST /orders` 同一个 type：试算就是要在下单之前把它说出来。
            **不会忽略这张券按原价试算**——用户正是照着试算结果决定要不要下单的。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            与 `POST /orders` 的 422 逐条一致：这家店不卖其中某几件
            （`https://keel.dev/problems/sku-not-sold-in-store`），
            有商品送不到这个收货地址（`https://keel.dev/problems/region-not-deliverable`，
            `undeliverable_items` 逐行给出 SKU 与原因），
            或 `store_id` / `address_id` / `sku_id` 有一个服务端不认识
            （`https://keel.dev/problems/invalid-request`）。
            试算的全部意义就是在下单之前把这些说出来。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /orders:
    post:
      tags: [Order]
      summary: 创建订单
      description: |
        触发 SAGA 全局事务（gid = `order-{merchant_id}-{order_no}`），三个分支：

        **`store_id` 不进 gid，落在 `orders` 上。** 分支只拿到
        `(gid, branchID, op)` 三个字符串，而订单本来就必须先落库再提交 SAGA
        （这是被那个签名逼出来的顺序，`00013` 与 `internal/service/order.go`
        的文件头都有论证），所以分支按 `order_no` 读回订单行就同时拿到
        `store_id` 与全部明细，补偿分支走同一条路、回补到同一家店。
        改 gid 的文法是要单独论证的动作——gid 是屏障幂等的键，
        改它的形状会让部署切换瞬间在途的事务「旧文法写、新文法读」，
        而屏障失效的表现是业务被执行两遍，不是报错（数据模型 §4）。


        | 分支 | 正向 | 补偿 |
        |---|---|---|
        | 库存 | available_qty -= n | available_qty += n |
        | 优惠券 | status 1 → 3 已使用 | status 3 → 1 |
        | 订单 | 建单 status=10 | status → 90 |

        **必须携带 `Idempotency-Key`**：同一 key 重复调用返回首次的存档响应，
        防止用户连点或网络重试造成重复下单。重放命中时响应带
        `Idempotency-Replayed: true`，客户端据此区分「我真的下了单」
        与「这是上次那单」——影响埋点与提示文案。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: |
            订单创建成功。幂等重放命中成功记录时，同样返回 201 与首次的响应体，
            并带 `Idempotency-Replayed: true`。
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: |
            业务冲突，按 Problem `type` 区分：
            · 库存不足 —— .../insufficient-stock
            · 券不可用 —— .../coupon-not-applicable
            · 价格已变动（与 expected_payable_cents 不一致）—— .../price-changed
            · **同一 Idempotency-Key 正在处理中** —— .../idempotency-key-in-flight，
              响应带 `Retry-After`，客户端应退避重试而不是当成业务失败弹窗
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            请求体里指名的东西不存在或不可用。按 `type` 区分：

            · **这家店（或它所在大区）不卖其中某几件** ——
              `https://keel.dev/problems/sku-not-sold-in-store`，
              响应体带 `store_id` 与冲突的 `sku_id` 列表。
              **刻意不是 409**：409 在本契约里被客户端读成「重读一次再试」
              （`Retry-After`、`InventoryConflict.current` 都在教它这么读），
              而这一种重试永远不会成功——客户端该做的是换一家店。
              也**刻意不是 404**：那条分界线是「路径里指名的资源不存在 → 404，
              请求体里指名的东西不存在或不可用 → 422」，
              而这条路径是 `/orders`，报 404 会被读成「下单接口不存在」。
            · **有商品送不到这个收货地址** —— `https://keel.dev/problems/region-not-deliverable`，
              响应体的 `undeliverable_items` 逐行给出 SKU 与原因（这件商品的运费模板把
              收货地址所在的省列为不配送，或地址归不到省而模板设了不配送地区）。
              同样**不是 409**：重试不会成功，客户端该做的是去掉这几行或换一个地址。
            · **`store_id` / `address_id` / `sku_id` 有一个服务端不认识** ——
              `https://keel.dev/problems/invalid-request`。
              「不是你的门店」与「不是你的 SKU」合用一个 type：
              分开告诉调用方等于替攻击者做区分（与 §2「查不到即 404，
              不是 403」同一个路子）。它们在服务端是两个不同的 sentinel，
              日志与告警分得开。
            · **同一 Idempotency-Key 配了不同的请求体** ——
              `https://keel.dev/problems/idempotency-key-reused`。

            这三种在 SAGA 分支里都表现为 `rows_affected = 0`，
            而它们与「库存不足」（409）的区别就是**重试有没有用**。
            五种成因的完整清单与各自的 sentinel 在数据模型 §4。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Order]
      summary: 我的订单列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 按履约状态筛选
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: refund_status
          in: query
          description: |
            按售后状态筛选。与 `status` 正交，可同时指定——
            例如「已发货且退款中」就是 `status=30&refund_status=1`。
            「我的退款/售后」这个入口没有它就做不出来。
          schema: { $ref: '#/components/schemas/OrderRefundStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{order_no}:
    get:
      tags: [Order]
      summary: 订单详情
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{order_no}/cancel:
    post:
      tags: [Order]
      summary: 取消订单
      description: 仅 status=10（待支付）可取消。触发 SAGA 回滚库存与优惠券。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: |
            · 当前状态不允许取消 —— .../order-status-not-cancelable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{order_no}/confirm:
    post:
      tags: [Order]
      summary: 确认收货
      description: |
        履约维度 `30 已发货 → 40 已完成`，对应 `order_status_transitions` 的 `(30,40)`。

        **部分退款进行中（`refund_status = 1`）不阻断确认收货** ——
        这是两个维度正交的直接体现：`status` 说货到哪儿了，
        `refund_status` 说钱退了多少，货已签收与钱还在退不矛盾。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许确认收货（仅 status=30 可调）——
              type=https://keel.dev/problems/order-status-not-confirmable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{order_no}/refunds:
    post:
      tags: [Refund]
      summary: 申请退款（支持部分退）
      description: |
        按 `order_items.discount_cents` 的分摊结果倒算实退金额，**客户端不传金额**：
        单件实退 = `(amount_cents - discount_cents) × 退货件数 / quantity`，
        退到最后一件时把余数一并退干净，保证
        `SUM(refund_items.amount_cents) = 该行实付净额` 恒等。
        客户端只有拿到服务端算好的数，确认页展示的「预计退款」才不会和实际到账对不上。

        退款单创建后进入 `10 待审核`，后续流转见 `RefundStatus`。
        退款本身用 SAGA 编排：渠道退款、库存回补、订单金额回写三个分支，
        其中渠道退款分支没有补偿（钱退出去收不回来），必须排在最后一个正向分支。

        **运费**：未发货整单退全退运费；部分退款不退运费（运费按整单算，
        没有可分摊的口径）；退货退款的运费责任由客服在审核时裁定。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreateRequest' }
      responses:
        '201':
          description: 退款申请已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404':
          description: |
            订单不存在或不属于当前用户。
            type=https://keel.dev/problems/order-not-found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 Problem `type` 区分，客户端据此给出不同文案：
            · 退款件数超过 `quantity - refunded_qty`（含进行中退款单的占用）——
              .../refund-quantity-exceeded
            · 订单状态不允许申请（如 `10 待支付` / `90 已关闭`，或订单未支付）——
              .../order-status-not-refundable
            · 该 `order_item_id` 已在一张进行中的退款单里 ——
              .../refund-already-in-progress
              （`UNIQUE (refund_id, order_item_id)` 只保证单张单内不重复，
               跨单重复必须业务层拦）
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · `order_item_id` 不属于该订单 —— .../order-item-mismatch
            · 字段校验失败（见 Problem.errors）
            · 同一 Idempotency-Key 配了不同请求体 —— .../idempotency-key-reused
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Refund]
      summary: 订单的退款单列表
      description: 一个订单可以有多张退款单（不同批次、不同明细），按创建时间倒序。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds:
    get:
      tags: [Refund]
      summary: 我的退款单列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Refund' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds/{refund_no}:
    get:
      tags: [Refund]
      summary: 退款单详情（含明细）
      parameters:
        - $ref: '#/components/parameters/RefundNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds/{refund_no}/cancel:
    post:
      tags: [Refund]
      summary: 撤回退款申请
      description: |
        用户主动撤回，退款单进入 `60 已取消`。
        对应 `refund_status_transitions` 的 `(10,60)` 与 `(20,60)` ——
        仅 `10 待审核` 与 `20 待买家退货` 可撤回；
        一旦进入 `30 退款中`，钱已在渠道路上，撤不回来。
      parameters:
        - $ref: '#/components/parameters/RefundNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许撤回 —— .../refund-status-not-cancelable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds/{refund_no}/return-shipment:
    post:
      tags: [Refund]
      summary: 填写退货寄回物流
      description: |
        退货退款（`refund_type=2`）审核通过后退款单停在 `20 待买家退货`，买家把货寄回，
        在这里填承运商与运单号。商家据此查件、收货之后在后台
        「确认收到退货」（`/admin/refunds/{refund_no}/receipt`，`20 → 30`）。

        **状态不变**：填完仍是 `20`。「货寄出了」只是买家的一句声明，退款要等商家
        真的收到、验过货才往下走 —— 所以这里不开一条 `20 → 25` 之类的新边。

        **可以改**：`20` 期间再调一次会覆盖上一次填的（填错单号是常事），
        `submitted_at` 跟着更新。离开 `20` 之后（商家已收货、买家已撤回）不能再改。

        只存承运商与运单号，不查物流轨迹 —— 与发货同一个取舍（数据模型 §5）。
      parameters:
        - $ref: '#/components/parameters/RefundNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnShipmentRequest' }
      responses:
        '200':
          description: OK。响应里的 `return_shipment` 是刚填的这一份
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404':
          description: 退款单不存在或不属于当前用户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            · 这张单不是退货退款，或当前不在 `20 待买家退货` ——
              type=https://keel.dev/problems/refund-status-not-returnable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · `carrier_code` / `tracking_no` 为空或超过 64 个字符 —— .../invalid-request
            · 同一 Idempotency-Key 配了不同请求体 —— .../idempotency-key-reused
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/orders:
    get:
      tags: [Admin, Order]
      summary: 后台订单列表
      description: |
        这家店的订单，按下单时间倒序（同一时刻按内部 id 倒序，翻页才稳定）。
        创建中（`status = 0`，下单 SAGA 还没走完）的草稿单不出现，与买家侧一致。

        **范围**（`StaffRole` 矩阵里「订单与售后」那一行，与「门店库存」同一个判据）：
        管理员、操作员看全店；大区管理员只看**当前**挂在他大区下的门店的单；
        门店管理员只看自己门店的单。按订单的履约门店 `store_id` 判，
        大区看门店**此刻**所属的大区（与发货、审核判权用的是同一个口径），
        不看订单上冗余的 `region_id`——那是下单那一刻的大区，定价用的。

        筛选条件与范围是**交集**：大区管理员带一个别的大区的 `store_id`，
        拿到的是空页，不是 403（与 `GET /admin/stores?region_id=` 一致）。

        `order_no` 与 `phone` 是精确匹配，给客服「报单号 / 报手机号」找单用，
        不做模糊搜索（模糊匹配手机号等于把这条接口变成一个手机号探测器）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: 按履约状态筛选。「待发货」即 `status=20`。
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: store_id
          in: query
          description: 只看某家履约门店的单。与调用者的范围取交集。
          schema: { type: integer, format: int64 }
        - name: created_from
          in: query
          description: 下单时间下界（含）。RFC3339。
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          description: 下单时间上界（**不含**）。RFC3339。半开区间，按天查时传次日零点。
          schema: { type: string, format: date-time }
        - name: order_no
          in: query
          description: 订单号，精确匹配。
          schema: { type: string }
        - name: phone
          in: query
          description: |
            手机号，精确匹配**收货人手机号或下单买家的账号手机号**任一个。
            两个都认，是因为打电话来的人报的号码不一定是收货人那一个。
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrderSummary' }
        '422':
          description: |
            `created_from` / `created_to` 不是合法的 RFC3339 时间，或下界不早于上界
            （type=https://keel.dev/problems/invalid-request）。
            **不当成「没传」**：时间范围写错时回一页不带筛选的全量订单，
            会让人以为那段时间就这么多单。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/orders/{order_no}:
    get:
      tags: [Admin, Order]
      summary: 后台订单详情
      description: |
        订单行（含优惠分摊 `discount_cents`、已退 / 在途件数）、支付记录、发货包裹、
        全部退款单，与订单读自同一个事务 —— 支付回调或退款入账落地的那一瞬间，
        不会出现「订单还是 20、下面却列着一笔已退款」的自相矛盾。

        判权与发货相同（按订单的履约门店，「订单与售后」那一行）：
        不在范围内回 403 out-of-scope（订单在调用者自己的租户里，说「不归你管」是真话，
        与 `GET /admin/stores/{store_id}` 一致）；别家租户的单号回 404。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: 订单不存在，或不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/orders/{order_no}/shipments:
    post:
      tags: [Admin, Order]
      summary: 发货
      description: |
        为订单创建发货包裹，订单状态 `20 已支付 → 30 已发货`。

        **一期只允许整单发货**：一个订单发一次，再次调用返回 409。
        表结构按多包裹设计（见数据模型 §5），将来开部分发货时是增量，不是迁移。

        三条规则：

        - **不动库存。** 下单 SAGA 的正向阶段已经扣过了，发货只是履约动作。
          这是最容易重复扣减的地方，所以写在契约里。
        - **存在未完结的整单退款申请时拒绝发货**（409）。部分退款不阻断——
          与确认收货那条一致，部分退款不该冻结整个履约流程。
        - **不查物流轨迹。** 只记承运商与运单号，前端自己拼查询链接。

        发货后 `shop_settings.auto_confirm_days` 天由定时任务自动
        `30 → 40`，买家也可以主动 `POST /orders/{order_no}/confirm`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentCreateRequest' }
      responses:
        '201':
          description: |
            已发货。幂等重放命中成功记录时，同样返回 201 与首次的响应体，
            并带 `Idempotency-Replayed: true`。
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '404':
          description: 订单不存在，或不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 Problem `type` 区分：

            · 订单状态不允许发货（非 `20 已支付`，或已发过货）——
              `https://keel.dev/problems/order-status-not-shippable`
            · 存在未完结的整单退款申请——
              `https://keel.dev/problems/order-has-pending-full-refund`
            · 该运单号已被登记过（录入重复，不是新包裹）——
              `https://keel.dev/problems/tracking-no-duplicated`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/refunds:
    get:
      tags: [Admin, Refund]
      summary: 后台退款单列表
      description: |
        这家店的退款单，按申请时间倒序。「待审核」即 `status=10`，
        「待确认收到退货」即 `status=20`。

        范围与 `GET /admin/orders` 相同：按退款单所属订单的履约门店判，
        大区管理员看当前挂在他大区下的门店，门店管理员看自己的门店；
        筛选条件与范围取交集。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: store_id
          in: query
          description: 只看某家履约门店的订单上的退款单。与调用者的范围取交集。
          schema: { type: integer, format: int64 }
        - name: created_from
          in: query
          description: 申请时间下界（含）。RFC3339。
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          description: 申请时间上界（**不含**）。RFC3339。
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminRefund' }
        '422':
          description: |
            时间参数不是合法的 RFC3339，或下界不早于上界
            （type=https://keel.dev/problems/invalid-request）。理由同 `GET /admin/orders`。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/refunds/{refund_no}:
    get:
      tags: [Admin, Refund]
      summary: 后台退款单详情
      description: |
        退款明细（每一行的实退金额由服务端按优惠分摊算好，后台界面只展示、不让人填）、
        凭证、审核记录（谁在什么时候通过 / 驳回、驳回理由、裁定的运费；
        退货退款还有谁在什么时候确认收到退货），以及所属订单的摘要 ——
        审核退运费要看订单实收了多少运费。

        判权同审核（按订单的履约门店）：不在范围内 403 out-of-scope，别家租户的 404。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RefundNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRefundDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: 退款单不存在，或不属于当前租户
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/refunds/{refund_no}/audit:
    post:
      tags: [Admin, Refund]
      summary: 审核退款单（后台 API）
      description: |
        **后台 API**，由运营 / 客服调用，鉴权与前台分开。在此契约中定义，
        是因为 `50 已拒绝` 与 `20 待买家退货` 两个态只能由审核动作到达 ——
        留空白的后果是实现时各写各的。

        · `approve` + 仅退款（`refund_type=1`）→ `10 → 30 退款中`
        · `approve` + 退货退款（`refund_type=2`）→ `10 → 20 待买家退货`
        · `reject` → `10 → 50 已拒绝`，必须带 `reject_reason`

        整单退款被驳回时，订单履约状态从 `50 退款中` 回到 `20 已支付`
        （对应 `order_status_transitions` 的 `(50,20)`）。

        `freight_cents` 是退货退款场景下客服裁定的退运费金额 ——
        一期没有可自动判定的口径，故开放给审核人填写。

        **谁能审**：与发货同一个判据（`StaffRole` 矩阵里「门店库存」那一行），
        按订单的履约门店判——管理员与操作员全店可审，大区管理员限本大区门店，
        门店管理员限自己门店。

        **沙箱**：服务端开着沙箱支付（`KEEL_PAYMENT_SANDBOX`）时，退款单进入
        `30 退款中` 的同一个事务里由沙箱渠道回调入账（与
        `/webhooks/refunds/{channel}` 同一条验签、金额校验、幂等路径），
        响应里看到的即 `40 已退款`。沙箱关闭时停在 `30`，等真实渠道回调。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RefundNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                reject_reason:
                  type: string
                  maxLength: 200
                  description: action=reject 时必填
                freight_cents:
                  $ref: '#/components/schemas/Money'
                  description: |
                    审核裁定的退运费金额，**只对退货退款（`refund_type=2`）生效**；
                    省略则保持申请时的值（退货退款申请时为 0）。仅退款的运费按规则
                    计算（未发货整单退全退，其余不退），传一个不同的值回 422。
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许审核（仅 `10 待审核` 可审）——
              .../refund-status-not-auditable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · action=reject 但未填 `reject_reason`
            · 退运费超过订单实收运费 —— .../refund-freight-exceeded
            · 同一 Idempotency-Key 配了不同请求体 —— .../idempotency-key-reused
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/refunds/{refund_no}/receipt:
    post:
      tags: [Admin, Refund]
      summary: 确认收到退货（后台 API）
      description: |
        退货退款的第二步：商家收到买家寄回的货，退款单 `20 待买家退货 → 30 退款中`，
        对应 `refund_status_transitions` 的 `(20,30)`。

        `RefundStatus` 的状态机里一直画着「商家收货」这条边，而此前没有任何一条
        接口走它——退货退款会永远停在 `20`。本接口补上这一步。

        买家填过的寄回物流在退款单的 `return_shipment` 里（后台详情同样返回）。
        **没填也可以确认**：货可能是当面退回、或者买家忘了填，商家手里有货就是事实；
        反过来，填了单号不等于货到了，所以填单号也不会自动推进状态。

        判权与审核相同（按订单的履约门店，「门店库存」那一行）。
        进入 `30` 之后的行为与审核通过（仅退款）一致：沙箱开着时同一事务里入账到 `40`。

        **不回补库存**：退回来的货成色未知，验货入库是商家的手工库存调整，
        不自动加回可售（数据模型 §11）。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/RefundNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许确认收货（仅 `20 待买家退货` 可调）——
              .../refund-status-not-receivable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/notifications:
    get:
      tags: [Admin, Notification]
      summary: 后台待办提醒（铃铛）
      description: |
        商家侧的站内通知：新的已支付待发货订单、新的待审核售后、买家填了寄回物流、
        库存降到预警线（数据模型 §16）。按时间倒序，标题与正文由服务端渲染好。

        **范围**与 `GET /admin/orders` 相同：每条通知都属于一家门店，
        大区管理员看当前挂在他大区下的门店的，门店管理员看自己门店的，
        管理员与操作员看全店的。

        **已读是每个员工各自的**：一条「新订单待发货」是管这家店的所有员工共享的，
        谁点开了只算谁读了（`read_at` 是调用者自己的已读时间）。

        响应里带调用者范围内的未读数，铃铛角标与下拉列表一次取齐。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unread_only
          in: query
          description: 为 `true` 时只返回调用者还没读的。
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/notifications/unread-count:
    get:
      tags: [Admin, Notification]
      summary: 后台未读提醒数
      description: 顶栏铃铛轮询用。范围同 `GET /admin/notifications`。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/notifications/{notification_id}/read:
    post:
      tags: [Admin, Notification]
      summary: 标记一条提醒已读（调用者自己的已读状态）
      description: |
        幂等：已经读过的再标一次照样 200。
        不在调用者范围里（别的大区 / 别的门店的提醒）或不存在：404 —— 铃铛里看不见的，
        也标不了；与「不存在」不作区分，理由同列表收窄（看不见的东西不承认它存在）。
        响应是标完之后调用者范围内的未读数。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/notifications/read-all:
    post:
      tags: [Admin, Notification]
      summary: 范围内的提醒全部标记已读
      description: 只标调用者范围内的；别人的已读状态不受影响。响应是标完之后的未读数。
      parameters:
        - $ref: '#/components/parameters/KeelMerchant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
        default: { $ref: '#/components/responses/Problem' }

  /webhooks/refunds/{channel}:
    post:
      tags: [Refund]
      summary: 退款渠道异步回调
      description: |
        渠道推送退款结果，退款单 `30 退款中 → 40 已退款`，
        并在同一事务里回写 `order_items.refunded_qty` / `refunded_cents`、
        累加 `orders.refunded_cents`、重算 `orders.refund_status`。

        **幂等由 `(channel, channel_refund_id)` 唯一索引兜底** ——
        与支付回调的 `(channel, channel_txn_id)` 完全同构：重复推送时
        第二次写入撞唯一冲突，直接返回 200。这个接口是
        `refunds.channel_refund_id` 的**唯一写入路径**。

        退款回调的重复率比支付回调只高不低 —— 退款到账往往延迟数小时，
        渠道会反复推，所以这条幂等路径必须一次做对。

        注意 `30 退款中` **没有通向失败态的边**：渠道调用失败是重试，不是终态。
        因此本接口不接受「退款失败」的终局语义，失败只体现为「还没退到」。

        签名验证失败返回 401，且不得泄露任何内部状态。

        **报文与验签**与支付回调同构：本期实现的是 Keel 的规范报文
        `{refund_no, channel_refund_id, amount_cents, refunded_at?}` 加
        `X-Keel-Signature: hex(HMAC-SHA256(该店该渠道的回调密钥, 原始请求体))`，
        没配密钥一律拒绝。真实渠道的报文与验签由适配器翻译，业务这一段不变。

        入账同一事务里还按规则处理库存与券（数据模型 §11）：**未发货**的退款回补
        库存到履约门店；整单的货全部退完才把券退回「未使用」（已过期不退）。
      security: []
      parameters:
        - name: channel
          in: path
          required: true
          description: |
            余额退款不产生渠道回调，故此处没有 balance。
          schema:
            type: string
            enum: [wechat, alipay]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: |
            已受理（无论首次还是重复）。

            **业务性结论也回 200**：订单查不到、金额不符、订单已不在待支付、
            报文解不开——这四种渠道重推也没用，让它继续重推只会放大噪音。
            这类结论在服务端留 Error 日志等人处置。
        '401':
          description: 签名验证失败
        default:
          description: |
            未能入账，**请渠道重推**。基础设施故障（库不可达之类）走这里。

            这条不是形式：回 200 会让渠道停止重推，而我们确实没入账，
            一笔真实到账就只在日志里留个影。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- Payment
  /orders/{order_no}/payments:
    post:
      tags: [Payment]
      summary: 发起支付
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreateRequest' }
      responses:
        '201':
          description: |
            **支付调起**已创建。

            注意这里创建的不是支付单：支付单在渠道回调入账时才落库，
            主键之外还要带上渠道流水号（`uk_payments_channel_txn` 是回调幂等的
            唯一闸门，预落一行同号的支付单会让真回调撞上它、订单永远推不到已支付）。
            本响应里的 `payment_no` 是**这次调起的凭据**，入账后以
            `channel_txn_id` 的形式出现在支付单上，两者据此对账。
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 订单当前状态不允许支付（非 `10 待支付`，或已超时关闭）——
              .../order-status-not-payable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /webhooks/payments/{channel}:
    post:
      tags: [Payment]
      summary: 支付渠道异步回调
      description: |
        **幂等由 `(channel, channel_txn_id)` 唯一索引兜底** ——
        重复回调时写入冲突，直接返回 200。

        触发二阶段消息：订单状态 `10 → 20` · 支付单落库 · 积分发放 · 触发履约。

        库存与优惠券在下单的 SAGA 正向阶段就已完成扣减与核销，此处**无动作** ——
        这正是 SAGA 相比 TCC 少一半方法数的体现（Confirm 是 TCC 的词，
        本系统下单链路没有这一步）。

        签名验证失败返回 401，且不得泄露任何内部状态。
      security: []
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [wechat, alipay]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: |
            已受理（无论首次还是重复）。

            **业务性结论也回 200**：订单查不到、金额不符、订单已不在待支付、
            报文解不开——这四种渠道重推也没用，让它继续重推只会放大噪音。
            这类结论在服务端留 Error 日志等人处置。
        '401':
          description: 签名验证失败
        default:
          description: |
            未能入账，**请渠道重推**。基础设施故障（库不可达之类）走这里。

            这条不是形式：回 200 会让渠道停止重推，而我们确实没入账，
            一笔真实到账就只在日志里留个影。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- Coupon
  /coupons:
    get:
      tags: [Coupon]
      summary: 我的优惠券
      description: |
        按领取时间倒序。`status` 不传即全部。

        **「已过期」是现算的**：`user_coupons.status = 1` 但已过 `valid_end_at` 的券，
        在这里以 `status = 4` 返回，也只会出现在 `status=expired` 的筛选里
        （数据模型 §7：判据必须在判定点上，不在一个异步的定时任务里）。
        `available` 同理只含还没过期的——包括尚未到 `valid_start_at` 的
        （它们确实是「我的可用券」，只是还不能用；客户端按 `valid_start_at` 提示）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: |
            `locked` 对应 `user_coupons.status = 2`（下单占用中）。
            漏掉它会让用户在下单未支付期间找不到自己的券。
          schema: { type: string, enum: [available, locked, used, expired] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/UserCoupon' }
        default: { $ref: '#/components/responses/Problem' }

  /coupons/applicable:
    post:
      tags: [Coupon]
      summary: 查询本单可用券
      description: |
        传入拟购商品与**履约门店**，返回这个买家手里本单可用的券及各自能减多少，
        按优惠额降序（相同时按过期时间升序——快过期的先用）。

        `store_id` 必填，理由与 `POST /orders` 一样：券按**那家门店的生效价**算
        （三层定价），而且券可能限定大区或门店——同一车商品在 A 店可用的券，
        在 B 店可能不可用。

        计算与 `POST /orders/preview`、`POST /orders` 是**同一份实现**，
        这里说能减多少，下单就减多少（数据模型 §7「券怎么算」）。
        不可用的券（门槛不够、范围不含、已过期、已锁定）不出现在结果里。

        **包邮券只在带了 `address_id` 时出现**：它抵的是运费，而运费取决于收货地址。
        本单运费为 0（包邮或没配运费模板）时包邮券不可用——用了也抵不了一分钱。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponApplicableRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApplicableCoupon' }
        '422':
          description: |
            与 `POST /orders/preview` 的 422 一致：这家店不卖其中某几件
            （`https://keel.dev/problems/sku-not-sold-in-store`），或 `store_id` / `sku_id` /
            `address_id` 有一个服务端不认识（`https://keel.dev/problems/invalid-request`），
            或带了 `address_id` 而有商品送不到那里（`https://keel.dev/problems/region-not-deliverable`，
            `undeliverable_items` 逐行列出）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /coupon-templates:
    get:
      tags: [Coupon]
      summary: 领券中心：当前可领的券
      description: |
        列出本店**启用、设为可领、没领完、没结束**的券模板，按创建时间倒序。
        每一项带上**当前买家**已领了几张（`claimed_count`）与还能不能领（`can_claim`），
        所以要登录。

        领完（`remaining = 0`）的模板不出现在这里；`remaining` 为 `null` 表示不限量。
        范围（`scopes`）原样给出，客户端据此显示「限华北大区」「新店专享」之类——
        「在哪家店能用」由买家自己判断，这条接口不按门店过滤。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ClaimableCouponTemplate' }
        default: { $ref: '#/components/responses/Problem' }

  /coupon-templates/{template_id}/claim:
    post:
      tags: [Coupon]
      summary: 领券
      description: |
        领一张。受三条约束，**全部在数据库层原子地挡住**（数据模型 §7）：
        总量（`total_count`）、每人限领（`per_user_limit`，数这个买家持有该模板的全部券，
        含商家定向发给他的）、以及绝对时间模式下的结束时间。

        几十个人同时抢最后一张时恰好一个人领到，其余拿到 409 `coupon-sold-out`。

        要 `Idempotency-Key`：`per_user_limit` 大于 1 时，一次网络重试会实实在在地多领一张。
        重放命中时返回首次领到的那一张，并带 `Idempotency-Replayed: true`。
      parameters:
        - $ref: '#/components/parameters/CouponTemplateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 领到了
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCoupon' }
        '404':
          description: |
            模板不存在、不属于本店、已停用、或没有设为可领。
            四种合用一个 404：领券中心里本来就看不到它们。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 `type` 区分：
            · 领完了 —— `https://keel.dev/problems/coupon-sold-out`
            · 这个买家已达每人限领 —— `https://keel.dev/problems/coupon-claim-limit-reached`
            · 活动已结束（绝对时间模式下已过 `valid_end_at`）—— `https://keel.dev/problems/coupon-claim-ended`
            · 同一 Idempotency-Key 正在处理中 —— `https://keel.dev/problems/idempotency-key-in-flight`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    OrderNo:
      name: order_no
      in: path
      required: true
      schema: { type: string }
    RefundNo:
      name: refund_no
      in: path
      required: true
      description: 退款单对外编号，不可枚举
      schema: { type: string }
    AddressId:
      name: address_id
      in: path
      required: true
      description: |
        `user_addresses.id`。按约定 4，地址用自增 id 对外，
        越权由服务端按 `user_id` 强制过滤 —— 查不到当前用户名下的该 id 即 404。
      schema: { type: integer, format: int64 }
    ProductId:
      name: product_id
      in: path
      required: true
      description: |
        `products.id`。按约定 4，商品对外用自增 id；越权由服务端按租户强制过滤 ——
        查不到当前租户名下的该 id 即 404（不是 403，理由见 /admin/ 段头第 3 条）。
      schema: { type: integer, format: int64 }
    SkuId:
      name: sku_id
      in: path
      required: true
      description: '`skus.id`。同 ProductId，查不到即 404。'
      schema: { type: integer, format: int64 }
    StoreId:
      name: store_id
      in: path
      required: true
      description: |
        `stores.id`。同 ProductId，查不到即 404（含「不属于当前租户」与「已软删」）。
      schema: { type: integer, format: int64 }
    CouponTemplateId:
      name: template_id
      in: path
      required: true
      description: '`coupon_templates.id`。查不到（含属于别家店）即 404。'
      schema: { type: integer, format: int64 }
    FreightTemplateId:
      name: template_id
      in: path
      required: true
      description: '`freight_templates.id`。查不到（含已删除、属于别家店）即 404。'
      schema: { type: integer, format: int64 }
    RegionId:
      name: region_id
      in: path
      required: true
      description: '`regions.id`。同上，查不到即 404。'
      schema: { type: integer, format: int64 }
    CategoryId:
      name: category_id
      in: path
      required: true
      description: '`categories.id`。同 ProductId，查不到即 404。'
      schema: { type: integer, format: int64 }
    CartStoreId:
      name: store_id
      in: query
      description: |
        购物车按哪家门店算「卖不卖」「多少钱」「有没有货」。**每一条返回 `Cart` 的
        购物车接口都收它**，解析规则与 `GET /products` 的 `store_id` 逐字一致：
        不传走回落链（默认门店），指名一家不存在的门店返回 422，不静默回落。

        车里存的只是 `sku_id` 与数量（数据模型 §10 不存价格快照），所以
        「这一行多少钱」只有在定下门店之后才有答案——三层定价下同一个 SKU
        在两家店是两个价。客户端应当传它在商品页 / 下单页用的**同一个** `store_id`，
        于是购物车显示的价、`/orders/preview` 试算的价、成交的价是同一个。
        响应里的 `store` 回显本次按哪家店算的。

        **刻意没有 default**：理由同 `GET /products`。
      schema: { type: integer, format: int64 }
    CartAddressId:
      name: address_id
      in: query
      description: |
        按哪个收货地址算运费（`Cart.freight`）与「送不送得到」（`CartItem.undeliverable`）。
        **每一条返回 `Cart` 的购物车接口都收它**，与 `store_id` 同一个道理：
        客户端应当传结算页选中的那一个，于是购物车显示的运费与 `/orders/preview` 的一致。

        不传时用这个买家的**默认地址**；也没有默认地址时 `freight` 与 `undeliverable`
        整个不出现（没有地址就没有运费可算，不是「包邮」）。
        指名一个不存在或不属于你的地址返回 422，不静默改用默认地址。
      schema: { type: integer, format: int64 }
    KeelMerchant:
      name: X-Keel-Merchant
      in: header
      required: false
      description: |
        **平台级会话**切换「这一次请求管的是哪家店」。值是商家的 `code`。

        它是 `servers` 那句「请求不携带任何标识租户的头」的**唯一例外**，
        而例外成立的前提是平台级鉴权：

        · 只在**已经通过后台会话校验、且会话是平台级**的请求上读它；
          读到之后用它指定的商家**替换**由 Host 解析出的租户，之后这个请求的
          行级安全落在这家店上。
        · **商家级员工带了这个头：403**
          （`https://keel.dev/problems/tenant-switch-forbidden`），不生效，也不静默忽略。
          静默忽略的话，一个以为自己切过去了的客户端会往错的店里写数据。
        · **code 不存在或已软删：422**（`https://keel.dev/problems/unknown-merchant`），
          **不回落**到 Host 解析出的那家 —— 回落意味着运营以为在管 B 店，
          实际改的是 A 店。按本契约的分法：路径里指名的资源不存在是 404，
          请求其余部分指名的东西不存在是 422。
        · **停用的商家可以切进去**（要进得去才修得好、再启用）；
          买家侧对它照旧 404。
        · 公开接口、买家接口、以及三条未认证的 `/admin/auth/*` **一律不读**这个头
          （契约里也不声明）：它们没有平台级鉴权可以作为前提。

        后台每一条挂后台会话的操作都声明了它（机械核对：
        `internal/handler/contract_test.go` 的 `TestKeelMerchantHeaderDeclaredExactlyOnStaffOperations`）。
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,30}$' }
    NotificationId:
      name: notification_id
      in: path
      required: true
      description: '`notifications.id`。按约定 4 用自增 id 对外，越权由服务端按收件人 / 员工范围过滤，查不到即 404。'
      schema: { type: integer, format: int64 }
    MerchantId:
      name: merchant_id
      in: path
      required: true
      description: '`merchants.id`。软删的商家 404。'
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端生成的 UUID。幂等作用域为 `(接口 scope, user_id, key)`，
        有效期 24h，过期后同一 key 可复用（见数据模型文档 §11）。

        · **重放命中成功记录**：返回首次的存档响应（状态码与响应体都是存档的那一份），
          并带 `Idempotency-Replayed: true` 响应头
        · **同 key 正在处理中**：`409` + `Retry-After`，
          type=https://keel.dev/problems/idempotency-key-in-flight，
          客户端应退避重试，不要当成业务失败
        · **同 key 但请求体不同**（`request_hash` 不一致）：`422`，
          type=https://keel.dev/problems/idempotency-key-reused。
          宁可显式失败，也不把不同的请求当成重放静默吞掉 ——
          那会让用户以为下单成功了而实际什么都没发生
        · 首次执行失败（存档为失败态）时同样回放该失败响应；
          确需重试的场景请换一个新 key
      schema: { type: string, format: uuid }

  headers:
    IdempotencyReplayed:
      description: |
        `true` 表示本次响应是幂等重放 —— 返回的是首次请求的存档响应，
        本次调用**没有真正执行**任何业务动作。首次执行时不返回该头或为 `false`。
        客户端据此区分「我真的下了单」与「这是上次那单」。
      schema: { type: boolean }

  responses:
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    IdempotencyInFlight:
      description: |
        同一 Idempotency-Key 正在处理中（另一并发请求已抢占）。
        type=https://keel.dev/problems/idempotency-key-in-flight。
        客户端应按 `Retry-After` 退避重试，而不是当成业务失败弹窗。
      headers:
        Retry-After:
          description: 建议退避秒数
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    IdempotencyKeyReused:
      description: |
        同一 Idempotency-Key 配了不同的请求体（`request_hash` 不一致），拒绝执行。
        type=https://keel.dev/problems/idempotency-key-reused。
        见数据模型文档 §11：这类失败必须显式，不能被当成重放静默吞掉。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ---- 通用 ----
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:   { type: string, format: uri, examples: ['https://keel.dev/problems/insufficient-stock'] }
        title:  { type: string, examples: ['Insufficient stock'] }
        status: { type: integer, examples: [409] }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          description: 字段级校验错误
          items: { $ref: '#/components/schemas/FieldError' }
        undeliverable_items:
          type: array
          description: |
            只在 `region-not-deliverable`（试算 / 下单时有商品送不到这个收货地址）时出现：
            逐行列出送不到的 SKU 与原因，客户端据此把这几行标出来让用户去掉或换地址。
          items: { $ref: '#/components/schemas/FreightUndeliverableLine' }

    FieldError:
      type: object
      description: |
        一条字段级错误。`field` 是请求体（或商品对象）里的字段名。

        `offset` / `length` 只在错误**能定位到具体位置**时出现，眼下唯一的
        生产者是发布时的广告法违禁词拦截（`compliance-rejected`）：
        商家要知道是哪个字段的第几个字，「拒绝」这两个字不够他改。

        **单位是 Unicode 码点，从 0 开始数**，不是字节，也不是「第几个字」
        那种从 1 开始的说法。选码点是因为它是服务端与客户端唯一能对上的单位：
        服务端按码点切，浏览器与 uni-app x 拿到的是 UTF-16 码元，
        而商品文案里的字符几乎全在 BMP 内，两者逐字相等。
        文案里出现 emoji（非 BMP）时 UTF-16 会多算一个码元，
        高亮会偏一格——这条偏差写在这里，不假装它不存在。
      properties:
        field:   { type: string, examples: ['title'] }
        message: { type: string }
        offset:
          type: integer
          description: 命中位置（Unicode 码点下标，从 0 开始）
        length:
          type: integer
          description: 命中长度（Unicode 码点数）

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:      { type: integer }
        page_size: { type: integer }
        total:     { type: integer }

    Money:
      type: integer
      format: int64
      description: 金额，单位「分」。禁止使用浮点。

    # ---- 商品 ----
    Category:
      type: object
      required: [id, name, level]
      properties:
        id:       { type: integer, format: int64 }
        name:     { type: string }
        level:    { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    ProductSummary:
      type: object
      required: [id, title, min_price_cents, status]
      properties:
        id:        { type: integer, format: int64 }
        title:     { type: string }
        subtitle:  { type: string }
        image_url: { type: string }
        min_price_cents: { $ref: '#/components/schemas/Money' }
        max_price_cents: { $ref: '#/components/schemas/Money' }
        in_stock:  { type: boolean }
        sales_count: { type: integer }
        status:
          type: integer
          description: |
            对应 `products.status`：0 草稿 / 1 上架 / 2 下架。
            前台列表与检索只返回 `1`；订单、购物车里引用的历史商品可能是 `2`，
            客户端据此展示「已下架」而不是让用户点进去才发现买不了。
          enum: [0, 1, 2]

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [skus]
          properties:
            description: { type: string }
            category_id: { type: integer, format: int64 }
            images:
              type: array
              items: { type: string }
            skus:
              type: array
              items: { $ref: '#/components/schemas/Sku' }

    Sku:
      type: object
      required: [id, sku_code, price_cents, available_qty]
      properties:
        id:          { type: integer, format: int64 }
        sku_code:    { type: string }
        spec_values:
          type: object
          additionalProperties: { type: string }
          examples: [{ "颜色": "黑", "尺码": "XL" }]
        price_cents:   { $ref: '#/components/schemas/Money' }
        available_qty: { type: integer }
        image_url:     { type: string }

    # ---- 后台商品域（M4 补的写接口，见 paths 里 /admin/products 那一段的段头）----
    #
    # 为什么另起一组 Admin* 而不是复用 ProductSummary / Sku：
    # 前台那两个是**对买家**的视图，里面没有成本、没有草稿状态、没有软删标记，
    # 而这三样恰恰是后台要管的。把它们加进前台 schema，等于让生成出来的买家
    # 客户端带着一组它永远收不到、也不该收到的字段——而客户端会照着类型去渲染。

    AdminProduct:
      type: object
      description: |
        后台视角的商品。与 `ProductSummary` 的差别是状态面：
        草稿与软删在这里是一等公民。
      required: [id, title, category_id, status, min_price_cents, max_price_cents,
                 total_stock, sales_count, created_at]
      properties:
        id:          { type: integer, format: int64 }
        title:       { type: string }
        subtitle:    { type: string }
        description: { type: string }
        category_id: { type: integer, format: int64 }
        brand_id:
          type: [integer, 'null']
          format: int64
          description: 品牌，可空。一期没有品牌管理接口，只透传。
        freight_template_id:
          type: [integer, 'null']
          format: int64
          description: |
            这件商品单独挂的运费模板（只能是全店模板）。null = 不单独挂：按履约门店的门店模板、
            再按全店默认模板算（数据模型 §7「一行用哪个模板」）。
        status:
          type: integer
          enum: [0, 1, 2]
          description: |
            `products.status`：0 草稿 / 1 上架 / 2 下架。
            改它只能经 `POST /admin/products/{product_id}/publication`。
        published_at:
          type: [string, 'null']
          format: date-time
          description: |
            **首次**上架时间。为 null 表示从未上架过（即 `status` 一直是 0 草稿）。
            再次上架不会覆盖它——理由见 publication 端点。
        deleted_at:
          type: [string, 'null']
          format: date-time
          description: 软删时间。非 null 时该商品只在 `include_deleted=true` 的后台列表里出现。
        min_price_cents:
          $ref: '#/components/schemas/Money'
          description: |
            未软删 SKU 的**基准价**下界，服务端按需现算（迁移 00019 之前它是
            `products` 上的一列冗余字段）。一个 SKU 都没有时为 0。不接受写入。
        max_price_cents:
          $ref: '#/components/schemas/Money'
          description: 同 `min_price_cents`，上界。
        total_stock:
          type: integer
          description: |
            未软删 SKU 的 `inventories.available_qty` 之和，服务端按需现算。
            不接受写入。
        sales_count:
          type: integer
          description: 冗余字段，由订单变更时同步。不接受写入。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/AdminProduct'
        - type: object
          required: [skus, images]
          properties:
            skus:
              type: array
              description: 含已软删的 SKU 吗——**不含**。软删的 SKU 不在任何视图里返回。
              items: { $ref: '#/components/schemas/AdminSku' }
            images:
              type: array
              description: 按展示顺序，`images[0]` 是主图。
              items: { $ref: '#/components/schemas/ProductImage' }

    ProductCreateRequest:
      type: object
      description: |
        **没有 `status` 也没有 `merchant_id`。** 前者因为创建与发布是两个动作，
        后者因为租户从会话继承（与 `StaffCreateRequest` 同理）。
      required: [category_id, title]
      properties:
        category_id:
          type: integer
          format: int64
          description: 必填。`products.category_id` 是 NOT NULL 的复合外键，没有「未分类」这个态。
        title:       { type: string, minLength: 1, maxLength: 200 }
        subtitle:    { type: string, maxLength: 200 }
        description: { type: string }
        brand_id:    { type: [integer, 'null'], format: int64 }
        freight_template_id:
          type: [integer, 'null']
          format: int64
          description: 单独挂的运费模板（全店模板的 id）。不填或 null = 不单独挂。指向门店模板、不存在或已删除时 422。

    # ---- 商品批量导入 ----
    ProductImportFormat:
      type: string
      enum: [xlsx, csv]
      description: 导入文件格式。服务端按内容判断，不按文件名。

    ProductImportIssue:
      type: object
      required: [code, message]
      description: |
        一行里的一条问题。`code` 给程序认，`message` 给人看。

        | code | 级别 | 含义 |
        |---|---|---|
        | `required` | 错误 | 必填列没填 |
        | `too_long` | 错误 | 超长（按字符数） |
        | `invalid_price` | 错误 | 不是合法金额（负数、三位小数、千分位逗号、超过一亿元……） |
        | `invalid_integer` | 错误 | 库存 / 重量不是非负整数；或数字超出 Excel 能原样保存的精度 |
        | `formula_cell` | 错误 | 公式格 |
        | `date_cell` | 错误 | 被 Excel 识别成了日期 / 时间 |
        | `error_cell` | 错误 | 错误值（`#N/A` 之类）或逻辑值 |
        | `duplicate_sku_code` | 错误 | SKU 编码与文件里前面某一行重复 |
        | `sku_code_exists` | 错误 | SKU 编码在店里已经存在（含已删除的 SKU） |
        | `spec_invalid` | 错误 | 规格名与规格值对不上、有空项、名字重复 |
        | `spec_mismatch` | 错误 | 同一商品各行的规格名不一致，或多行商品有一行没填规格 |
        | `spec_duplicate` | 错误 | 同一商品里规格值组合重复 |
        | `group_conflict` | 错误 | 同一商品的副标题 / 类目 / 描述前后不一致 |
        | `image_url_invalid` | 错误 | 图片地址不是 http / https 或格式不对 |
        | `numeric_sku_code` | 提示 | SKU 编码被 Excel 存成了数字，前导 0 可能已丢 |
        | `merged_cell` | 提示 | 合并单元格，已按左上角的值填入 |
        | `price_zero` | 提示 | 基准价是 0 元 |
        | `not_contiguous` | 提示 | 与前面不相邻的某一行同标题，已合并为同一件商品 |
        | `category_unmatched` | 提示 | 类目列填了，但对不上已有的（启用中的）类目 |
        | `group_blocked` | 提示 | 同一商品的别的行有错，这一行随整件商品不导入 |
      properties:
        column:
          type: string
          description: 出问题的那一列的表头名。与某一列无关时缺席。
        code:    { type: string }
        message: { type: string }

    ProductImportRow:
      type: object
      required: [row, first_row, sku_code, spec_values, errors, warnings, violations]
      description: |
        文件里的一行（一个 SKU）。有错的格对应的字段缺席（比如价格写错了就没有 `price_cents`）。
      properties:
        row:
          type: integer
          description: 行号，与 Excel 左侧的行号一致（表头是第 1 行）。整行空白的行被跳过，但不重新编号。
        first_row:
          type: integer
          description: 这一行所属商品的首行行号（同一件商品的各行相同）
        title:       { type: string }
        subtitle:    { type: string }
        category:    { type: string, description: 类目列的原文 }
        description: { type: string }
        sku_code:    { type: string }
        spec_values:
          type: object
          additionalProperties: { type: string }
          description: 规格名 → 规格值；单规格商品为空对象
        price_cents: { $ref: '#/components/schemas/Money' }
        stock:       { type: integer }
        weight_gram: { type: integer }
        image_urls:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ProductImportIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ProductImportIssue' }
        violations:
          type: array
          description: |
            广告法违禁词命中（`field` 是 title / subtitle / description，`offset` / `length`
            是码点位置，语义同 `FieldError`）。挂在提供这段文字的那一行上。**不阻断导入**：
            导入的是草稿，上架时才拦。
          items: { $ref: '#/components/schemas/FieldError' }

    ProductImportCategoryCandidate:
      type: object
      required: [category_id, path_name, score]
      properties:
        category_id: { type: integer, format: int64 }
        path_name:
          type: string
          description: 从一级到这一级的名字，用「 > 」连接
        score:
          type: number
          description: 标题向量与类目路径名向量的余弦相似度，[-1, 1]，越大越像

    ProductImportCategoryDecision:
      type: object
      required: [status, candidates]
      description: |
        一件商品的类目怎么定。

        | status | 含义 | `category_id` |
        |---|---|---|
        | `matched` | 类目列填的名字 / 路径对上了一个启用中的类目 | 那一个 |
        | `recommended` | 类目列为空或对不上，推荐的 Top-1 足够可信，**已替商家选中** | 推荐的 Top-1 |
        | `needs_review` | 有候选，但置信度不够，**需人工确认** | 缺席 |
        | `unavailable` | 推理引擎没配 / 不可用 / 店里没有可选的叶子类目，**需手选** | 缺席 |

        「足够可信」是两道门：Top-1 余弦 ≥ `ProductImportPreview.category_gate.min_score`，
        且与 Top-2 的分差 ≥ `min_margin`（只有一个候选时只看前者）。两个数由离线评测定出
        （人工标注的标题集，见商品理解服务设计文档「批量导入」一节）。

        推荐只在**叶子类目**（启用中、没有启用中的子类目）里选；`matched` 可以是任意一级。
      properties:
        status:
          type: string
          enum: [matched, recommended, needs_review, unavailable]
        category_id: { type: integer, format: int64 }
        path_name:   { type: string }
        candidates:
          type: array
          maxItems: 3
          description: 按分数降序的候选（`matched` 与 `unavailable` 时为空）
          items: { $ref: '#/components/schemas/ProductImportCategoryCandidate' }

    ProductImportProduct:
      type: object
      required: [first_row, rows, title, importable, category]
      description: 文件里的一件商品（同一标题的若干行）
      properties:
        first_row: { type: integer }
        rows:
          type: array
          description: 这件商品包含的行号
          items: { type: integer }
        title: { type: string }
        importable:
          type: boolean
          description: 每一行都没有错误。为 false 时确认导入会跳过它。
        category: { $ref: '#/components/schemas/ProductImportCategoryDecision' }

    ProductImportPreview:
      type: object
      required: [file_sha256, format, total_rows, error_rows, products, rows, notices,
                 category_engine, category_gate]
      properties:
        file_sha256:
          type: string
          description: 文件字节的 sha256（十六进制）。「同一份文件」的判据。
        format: { $ref: '#/components/schemas/ProductImportFormat' }
        total_rows: { type: integer, description: 数据行数（不含表头与整行空白） }
        error_rows: { type: integer, description: 自身有错误的行数 }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductImportProduct' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProductImportRow' }
        notices:
          type: array
          description: 文件级提示（不阻断），如「csv 按 GBK 读取」「列『备注』不认得，已忽略」
          items: { type: string }
        category_engine:
          type: string
          enum: [ok, unavailable, not_configured]
          description: |
            这次预检的类目推荐跑成了没有：`not_configured` 是部署没配推理引擎，
            `unavailable` 是配了但这次没在预算内给出结果（引擎忙或挂了）。后两种时所有
            需要推荐的商品都是 `unavailable`，请手选——**导入本身不受影响**。
        category_gate:
          type: object
          required: [min_score, min_margin]
          description: 自动选中类目的两道门（见 ProductImportCategoryDecision）
          properties:
            min_score:  { type: number }
            min_margin: { type: number }
        previous_import:
          type: object
          required: [import_id, created_at]
          description: 同一份文件（sha256 相同）在本店已经确认导入过时出现：再确认不会重复建。
          properties:
            import_id:  { type: integer, format: int64 }
            created_at: { type: string, format: date-time }

    ProductImportCategoryChoice:
      type: object
      required: [first_row, category_id]
      properties:
        first_row:
          type: integer
          description: 商品在文件里的首行行号（预检结果里的 `products[].first_row`）
        category_id: { type: integer, format: int64 }

    ProductImportOutcome:
      type: object
      required: [first_row, rows, title, status]
      properties:
        first_row: { type: integer }
        rows:
          type: array
          items: { type: integer }
        title: { type: string }
        status:
          type: string
          enum: [created, failed]
        product_id:
          type: integer
          format: int64
          description: '`created` 时有：新建的草稿商品'
        sku_count: { type: integer, description: '`created` 时有：建了几个 SKU' }
        category_id: { type: integer, format: int64 }
        reasons:
          type: array
          description: '`failed` 时有：为什么没导入（每条带行号）'
          items: { type: string }
        image_urls:
          type: array
          description: 文件里给这件商品填的图片地址，**只记录、没有下载**，请在商品页上传
          items: { type: string }

    ProductImportResult:
      type: object
      required: [import_id, file_sha256, already_imported, total_rows, created_products,
                 created_skus, failed_rows, products, created_at]
      properties:
        import_id: { type: integer, format: int64 }
        file_sha256: { type: string }
        already_imported:
          type: boolean
          description: 同一份文件此前已经确认导入过，这一次什么都没建，下面是那一次的结果
        total_rows: { type: integer }
        created_products: { type: integer }
        created_skus: { type: integer }
        failed_rows: { type: integer, description: 没有导入的行数（含被同组错误拖累的行） }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductImportOutcome' }
        created_at: { type: string, format: date-time }

    ProductUpdateRequest:
      type: object
      minProperties: 1
      description: |
        只改文案与归属。**不含 `status` / `published_at` / `deleted_at`**，
        也不含任何冗余字段——它们各有自己的入口，或者根本不该由客户端写。
      properties:
        title:       { type: string, minLength: 1, maxLength: 200 }
        subtitle:    { type: string, maxLength: 200 }
        description: { type: string }
        category_id: { type: integer, format: int64 }
        brand_id:    { type: [integer, 'null'], format: int64 }
        freight_template_id:
          type: [integer, 'null']
          format: int64
          description: |
            改挂的运费模板（全店模板的 id）；传 null 解除单独挂的模板。
            指向门店模板、不存在或已删除时 422。只影响之后的试算与下单。

    ProductPublicationRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [publish, unpublish]
          description: |
            `publish` → `status = 1`；`unpublish` → `status = 2`。
            没有回到 `0 草稿` 的取值，理由见端点描述。

    ProductImage:
      type: object
      description: |
        商品图与商品的关联。落地在数据模型 §3 的 `product_images` 表上——
        M2 验收记过一笔账：`ProductSummary.image_url` 与 `ProductDetail.images`
        声明了但服务端从不填，因为 `products` 上根本没有图片列，
        `uploads` 与商品也没有任何关联。本轮补的就是这个关联。
      required: [upload_id, url, sort_order]
      properties:
        upload_id:
          type: integer
          format: int64
          description: '`uploads.id`。由 `POST /admin/uploads` 得到。'
        url:
          type: string
          description: |
            形如 `/api/v1/uploads/{upload_id}`，与 `Upload.url` 同一个形状：
            指向 `GET /uploads/{upload_id}`，不是裸的存储路径。客户端原样使用。
        sort_order:
          type: integer
          description: |
            展示顺序，从 0 起。**0 就是主图**，没有单独的 `is_primary`。
            它与数组下标一致，冗余返回是为了让单独拿到一个元素时也说得清位置。

    ProductImageInput:
      type: object
      required: [upload_id]
      description: |
        只收 `upload_id`，不收 URL。收 URL 意味着客户端能往商品上挂任意地址，
        而收 id 把取值域关死在自己的 `uploads` 表里，并让 `referenced` 能在
        同一个事务里置位（数据模型 §13）。
      properties:
        upload_id: { type: integer, format: int64 }

    ProductImagesReplaceRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          maxItems: 20
          description: |
            **整组替换**，数组顺序即展示顺序，第 0 个是主图。
            传空数组即清空。同一个 `upload_id` 不得出现两次（422）。
          items: { $ref: '#/components/schemas/ProductImageInput' }

    AdminSku:
      type: object
      description: |
        后台视角的 SKU。比前台的 `Sku` 多出成本、重量、售卖开关与库存预警位——
        `cost_cents` 尤其不能出现在任何前台响应里。
      required: [id, product_id, sku_code, price_cents, status, available_qty]
      properties:
        id:         { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        sku_code:
          type: string
          description: 商家自己的货号，租户内唯一（`uk_skus_code`），不是全局唯一。
        spec_values:
          type: object
          additionalProperties: { type: string }
          description: '`skus.spec_values`（JSONB）。键名不由契约规定。'
          examples: [{ "颜色": "黑", "尺码": "XL" }]
        price_cents: { $ref: '#/components/schemas/Money' }
        cost_cents:
          $ref: '#/components/schemas/Money'
          description: 成本。用于业务重排（数据模型 §3），**只在后台接口里出现**。
        weight_gram:
          type: integer
          description: 重量（克）。按重量计费的运费模板按它算；0 表示没填，按重量计费时这一件按 0 克计（只收首重费）
        image_url:
          type: string
          description: 该规格的小图，形如 `/api/v1/uploads/{upload_id}`。
        status:
          type: integer
          enum: [0, 1]
          description: '`skus.status`：0 停售 / 1 在售。停售的规格仍在规格矩阵里显示，但不可加购。'
        available_qty:
          type: integer
          description: '来自 `inventories.available_qty`。改它要走 `PUT /admin/skus/{sku_id}/inventory`。'
        warning_qty:
          type: integer
          description: 低库存预警线。一期只是一个存着的数，没有接到任何告警。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkuCreateRequest:
      type: object
      required: [sku_code, price_cents]
      description: |
        `available_qty` 在这里是**允许的**，而在 `SkuUpdateRequest` 里不允许：
        建行与改行是两件事——建的时候没有并发对手（这一行还不存在），
        改的时候有（下单 SAGA 正在扣它）。
      properties:
        sku_code:    { type: string, minLength: 1, maxLength: 64 }
        spec_values:
          type: object
          additionalProperties: { type: string }
        price_cents:  { $ref: '#/components/schemas/Money' }
        cost_cents:   { $ref: '#/components/schemas/Money' }
        weight_gram:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 重量（克），按重量计费的运费模板用它。省略即 0
        image_upload_id:
          type: [integer, 'null']
          format: int64
          description: |
            该规格小图的 `uploads.id`，服务端据此写出 `skus.image_url`。
            与商品图同理：收 id 不收 URL。
        available_qty:
          type: integer
          minimum: 0
          description: 初始库存。服务端在同一事务里建出 `inventories` 行，省略即 0。
        warning_qty:
          type: integer
          minimum: 0
          description: 低库存预警线，省略即 0。

    SkuUpdateRequest:
      type: object
      minProperties: 1
      description: |
        **刻意没有 `available_qty`**：库存有自己的端点，因为它要表达乐观并发。
        见 `PUT /admin/skus/{sku_id}/inventory`。
      properties:
        sku_code:    { type: string, minLength: 1, maxLength: 64 }
        spec_values:
          type: object
          additionalProperties: { type: string }
        price_cents: { $ref: '#/components/schemas/Money' }
        cost_cents:  { $ref: '#/components/schemas/Money' }
        weight_gram:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 重量（克），按重量计费的运费模板用它
        image_upload_id: { type: [integer, 'null'], format: int64 }
        status:
          type: integer
          enum: [0, 1]
          description: '0 停售 / 1 在售'

    AdminInventory:
      type: object
      required: [sku_id, store_id, available_qty, warning_qty, updated_at]
      properties:
        sku_id:        { type: integer, format: int64 }
        sku_code:      { type: string }
        store_id:
          type: integer
          format: int64
          description: |
            这一行库存属于哪家门店。**必返。**
            `inventories` 的主键本轮变成 `(sku_id, store_id)`（数据模型 §4），
            少了这一列，一个库存水位就不知道是谁的——而按门店分之后，
            同一个 SKU 会有好几行。
        available_qty:
          type: integer
          description: |
            这家门店的可售量。**这一行不存在时视同 0，不是「这家店不卖」**——
            两件事在库里长得很像（都是查不到行），但语义相反：
            一家刚开的店在录库存之前每个 SKU 都缺行，
            判成「不卖」会让新店什么都不卖，和「开店即营业」正面冲突
            （数据模型 §4）。「不卖」由 `*_product_overrides` 表达。
        warning_qty:   { type: integer }
        updated_at:    { type: string, format: date-time }

    InventorySetRequest:
      type: object
      required: [expected_available_qty, available_qty]
      description: |
        比较并设置。两个数量都是必填，缺一不可——只给 `available_qty` 就退化成
        无条件覆盖，那正是这条接口存在的理由要防的东西。
      properties:
        expected_available_qty:
          type: integer
          minimum: 0
          description: |
            **我看到的那个值。** 服务端把它作为 UPDATE 的条件；
            对不上说明这行在你读到它之后被改过（多半是并发下单扣减），返回 409。
        available_qty:
          type: integer
          minimum: 0
          description: 要写进去的新值（绝对值，不是增量）。
        warning_qty:
          type: integer
          minimum: 0
          description: 低库存预警线。省略则不动。

    InventoryConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current]
          description: |
            CAS 失败时的 Problem 扩展。RFC 9457 允许 problem 对象带扩展成员，
            这里带上当前真实值，省掉调用方「先重查再重试」的那一跳——
            而那一跳本身又是一次会过期的读。
          properties:
            current: { $ref: '#/components/schemas/AdminInventory' }

    AdminCategory:
      type: object
      description: |
        后台视角的分类，**扁平**。与前台的 `Category` 不同，它不嵌 `children`：
        后台管的是单个节点，而 `path` / `level` 足以让客户端自己拼出树。
      required: [id, name, path, level, sort_order, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        parent_id:
          type: [integer, 'null']
          format: int64
          description: 为 null 即根分类。
        name: { type: string }
        path:
          type: string
          description: |
            物化路径，形如 `/1/23/456/`（数据模型 §3）。
            **服务端维护，不接受写入**——它是 `idx_categories_path` 的内容。
          examples: ['/1/23/456/']
        level:
          type: integer
          description: 层级，根为 1。同样由服务端从 `parent_id` 算出。
        sort_order: { type: integer }
        status:
          type: integer
          enum: [0, 1]
          description: |
            `categories.status`：0 停用 / 1 启用。
            停用只让它从前台目录树里消失，**不影响挂在它下面的商品的在架状态**。
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoryCreateRequest:
      type: object
      required: [name]
      description: '**没有 `path` 与 `level`**，它们由服务端从 `parent_id` 算出。'
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parent_id:
          type: [integer, 'null']
          format: int64
          description: 省略或为 null 即建根分类。必须属于当前租户。
        sort_order: { type: integer }

    CategoryUpdateRequest:
      type: object
      minProperties: 1
      description: |
        传 `parent_id` 就是**移动子树**，服务端会在同一事务里重写整棵子树的
        `path` 与 `level`，并拒绝成环。详见端点描述。
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parent_id:
          type: [integer, 'null']
          format: int64
          description: |
            显式传 `null` 表示移到根。**不传这个字段则不动层级** ——
            `null` 与「没传」在这里是两件事。
        sort_order: { type: integer }
        status:
          type: integer
          enum: [0, 1]
          description: '0 停用 / 1 启用'

    # ---- 检索 ----
    SearchRequest:
      type: object
      required: [query]
      description: |
        `POST /search` 的请求体。**本轮从内联 schema 提成具名的**——
        内联的生成器不出类型，handler 只能手写绑定，这条刚在
        `PaymentCreateRequest` 和这个 `/search` 上踩过两次。
      properties:
        query: { type: string, minLength: 1, maxLength: 200 }
        store_id:
          type: integer
          format: int64
          description: |
            按哪家门店检索。与 `GET /products` 的同名查询参数逐字同义、
            同回落链（不传即走「默认门店 → 不在服务范围」那条链，
            **不是**全租户并集）。

            放在请求体顶层而不是 `filters` 里：`filters` 是**筛选条件**
            （买家自己勾的），门店是**上下文**（服务端解析出来的）。
            混在一起会让「清空筛选」这个动作把门店也清掉。
        filters:
          $ref: '#/components/schemas/SearchFilters'
        size: { type: integer, default: 20, maximum: 100 }
        strategy:
          type: string
          default: default
          description: |
            排序策略标识，用于 A/B 对比。记入检索日志后可按策略分组
            对比 NDCG@10 / CTR@10 等在线指标。省略则用默认策略。
            一期不做完整分流，但接口层先留出这个参数 ——
            否则后续每次改排序都是不可逆的「拍脑袋上线」
            （语义检索层设计 §9.3）。

            当前认得的两条（M5）：`rrf-biz-v1`（默认：双路召回 + RRF +
            业务重排）与 `rrf-v1`（双路召回 + RRF，不做业务重排，留作对照）。
            省略、`default` 或任何不认得的值都落到默认那条，**不报错**——
            响应里的 `strategy` 回显的是真正跑过的那一条，不是请求原文。
            Reranker 精排还没有落地，没有任何策略包含它。
        explain:
          type: boolean
          default: false
          description: 返回各阶段得分，用于调试与效果评估

    SearchFilters:
      type: object
      properties:
        category_id: { type: integer, format: int64 }
        min_price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            按**当前门店的生效价**过滤（三层 `COALESCE` 之后的值），
            不是按基准价。`products.min_price_cents` / `max_price_cents`
            两列本轮已从数据模型里删掉——三层定价之后它们不再是商品的属性
            （数据模型 §3 / §4）。
        max_price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 同上。
        in_stock_only:
          type: boolean
          default: false
          description: |
            只要当前门店有货的。**默认值本轮从 `true` 改成 `false`**，
            与 `GET /products?in_stock_only=` 对齐（M3 独立验收 I10）。

            改的不只是为了一致：契约原先把同一件事写了两遍且互相矛盾——
            `/search` 的描述写着业务重排会把缺货商品**降权**，
            而这个默认值说的是**删掉**。两者并存时默认值那一份赢，
            于是「降权」那句话从来没被执行过。

            注意这个开关**管不到「这家店卖不卖」**：门店与大区的上下架是
            可见性本身，无条件生效、关不掉（数据模型 §4）。

    SearchHit:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            scores:
              type: object
              description: explain=true 时返回，用于效果调优
              properties:
                vector:   { type: number }
                keyword:  { type: number }
                rrf:      { type: number }
                rerank:   { type: number }
                business: { type: number }
                final:    { type: number }
            recall_source:
              type: string
              enum: [vector, keyword, both]
              description: |
                该结果来自哪一路召回，`explain=true` 时返回。
                调双路召回权重时这是第一手信息——某类查询长期只由单路命中，
                说明另一路在这类查询上失效了。

    ChatReply:
      type: object
      required: [session_id, reply]
      properties:
        session_id: { type: string }
        reply:
          type: string
          description: 面向用户的自然语言回复
        products:
          type: array
          description: 真实检索结果，非模型生成
          items: { $ref: '#/components/schemas/ProductSummary' }
        intent:
          type: object
          description: 解析出的结构化意图
          additionalProperties: true
          examples: [{ "scene": "birthday_gift", "recipient": "mother", "budget_max_cents": 30000 }]
        action:
          type: object
          description: |
            写操作路由指令。前端据此跳转到对应表单并预填参数，
            **服务端不执行任何写操作**。
          properties:
            type:
              type: string
              enum: [navigate_refund, navigate_address, navigate_order, navigate_cancel]
            params:
              type: object
              additionalProperties: true

    # ---- 购物车 ----
    Cart:
      type: object
      required: [items, total_cents, selected_total_cents, store]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        store:
          allOf: [{ $ref: '#/components/schemas/StoreContext' }]
          description: |
            本次的价格与可买状态是按哪家门店算的。**必返**，理由同 `GET /products`。
            `match_type = none`（商家没配默认门店、又没指名门店）时没有任何一行买得到：
            失效的行照旧报 `off_shelf`，其余一律 `not_sold_in_store`，两个合计都是 0；
            此时加购返回 422（没有门店就判不了卖不卖）。
        total_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            **全车**商品金额合计，与 `selected` 无关。
            只计 `status = available` 的行：失效、缺货的行没有一个此刻能成交的金额，
            算进去会让「全选」显示一个结算时注定对不上的数。
        selected_total_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            **仅已勾选**（`selected: true`）条目的金额合计，即点「去结算」时的预估金额。
            同样只计 `status = available` 的行。把这些行按同一个 `store_id` 送进
            `/orders/preview`，得到的 `goods_amount_cents` 与它逐分相等——两边读的是
            同一条定价查询（数据模型 §4 `sku_prices_by_store`）。

            两个字段都给，是因为购物车页同时要显示这两个数——底部结算栏显示已选金额，
            而「全选」复选框需要知道全车总数。只给一个的话客户端就得自己遍历累加，
            那等于把金额计算规则复制到每个端上。

            **送不到的行（`undeliverable` 非空）仍然算在里面**：它们在这家店是买得到的，
            只是送不到这个地址。带着它们去 `/orders/preview` 会收到 422
            `region-not-deliverable`——客户端应当在结算前提示用户取消勾选或换地址。
        address_id:
          type: integer
          format: int64
          description: 本次按哪个收货地址算的运费（回显 `address_id` 参数，或买家的默认地址）。没有地址时不出现。
        freight:
          allOf: [{ $ref: '#/components/schemas/FreightBreakdown' }]
          description: |
            已勾选、可买、送得到的那些行按 `address_id` 那个地址算出的**预估运费**。
            满额包邮按 `selected_total_cents`（去掉送不到的行）判——购物车不算券，
            所以它是「用券之前」的运费；用了券可能因为不满额而不包邮，也可能用包邮券抵掉。
            最终以 `/orders/preview` 为准。没有地址时整个不出现。

    CartItem:
      type: object
      required: [id, sku_id, quantity, price_cents, selected, available, status]
      properties:
        id:        { type: integer, format: int64 }
        sku_id:    { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        title:     { type: string }
        spec_values:
          type: object
          additionalProperties: { type: string }
        image_url: { type: string }
        price_cents:
          type: [integer, 'null']
          format: int64
          description: |
            **实时价，不是加购时的快照。** 购物车刻意不存价格快照（见数据模型 §10），
            这个值随商品调价而变。不要据此做「降价提醒」；
            最终以 `/orders/preview` 的试算结果为准，价格快照只在下单瞬间产生。

            单位「分」。按响应里 `store` 那家门店的生效价（门店价 > 大区价 > 基准价）。
            **`status` 为 `not_sold_in_store` 或 `off_shelf` 时为 null**：这家店此刻
            不卖它，也就没有一个「它多少钱」的答案——给一个基准价会让用户以为
            还能按这个价买到。
        quantity:  { type: integer }
        selected:
          type: boolean
          default: true
          description: |
            是否勾选结算，对应 `cart_items.selected`。
            勾选态存在服务端，换设备打开购物车不会丢。
        available:
          type: boolean
          description: |
            此刻能否按 `quantity` 买下这一行，恒等于 `status == available`。
            保留它是为了只关心「能不能买」的简单客户端；要给用户看原因请读 `status`。
        status: { $ref: '#/components/schemas/CartItemStatus' }
        undeliverable:
          allOf: [{ $ref: '#/components/schemas/FreightUndeliverableLine' }]
          description: |
            这一行送不到 `Cart.address_id` 那个地址（运费模板把那个省列为不配送，或地址归不到省）。
            送得到、或没有地址时整个不出现。它与 `status` 正交：`status` 说的是
            这家店卖不卖、有没有货，这个字段说的是能不能送到这个地址。

    CartItemStatus:
      type: string
      enum: [available, insufficient_stock, out_of_stock, not_sold_in_store, off_shelf]
      description: |
        这一行此刻能不能买，按响应里 `store` 那家门店判。判定顺序即下表顺序，
        先命中的先报——一件被下架的商品通常也没有库存，先判库存会报「缺货」，
        而用户会一直等一个不会来的补货（与库存扣减的判定顺序同一个理由，数据模型 §4）。

        | 值 | 含义 | `price_cents` |
        |---|---|---|
        | `off_shelf` | 失效：规格已停售或删除，或商品已下架 / 删除 | null |
        | `not_sold_in_store` | 这家店（或它所在大区）不卖；换一家店可能买得到 | null |
        | `out_of_stock` | 这家店可售量为 0 | 有 |
        | `insufficient_stock` | 这家店有货，但不够 `quantity` 件 | 有 |
        | `available` | 能按 `quantity` 买下 | 有 |

        **这些行不会被服务端删掉**（数据模型 §10）：替用户默默删东西，
        比让他看到一条划掉的商品更讨人嫌。

    # ---- 订单 ----
    OrderStatus:
      type: integer
      description: |
        **履约维度** —— 货走到哪儿了。资金维度另见 `Order.refund_status`。

        10 待支付 / 20 已支付 / 30 已发货 / 40 已完成
        50 退款中 / 60 已退款 —— **仅用于未发货的整单退款**
        90 已关闭

        `50` / `60` 不表达部分退款：用户买三件退一件，订单**不会**变成
        `50 退款中`，`status` 保持不变继续走履约（已发货的照发），
        售后进度看 `Order.refund_status`。若按「用户一申请退款就把订单置 50」
        来实现，「部分退款后订单还能不能确认收货」这个问题会直接无解。

        合法迁移（`order_status_transitions`）：
        `(10,20) (10,90) (20,30) (20,50) (30,40) (50,60) (50,20)`。
        没有 `(30,50)` —— 已发货订单的退款走资金维度，
        履约进度不该被售后流程抹掉。
      enum: [10, 20, 30, 40, 50, 60, 90]

    OrderRefundStatus:
      type: integer
      description: |
        **资金维度** —— 钱退了多少，与 `status` 正交，由退款单驱动。

        0 无退款 / 1 退款中 / 2 部分退款完成 / 3 全额退款完成

        「全额退款」是**资金口径**：退到 `refunded_cents = paid_cents` 才是 `3`，
        只退货款不退运费的是 `2`。`2` 与 `1` 之间可以来回（退完一笔又申请下一笔）。

        | 场景 | `status` | `refund_status` |
        |---|---|---|
        | 未发货整单退 | `20 → 50 → 60` | `0 → 1 → 3` |
        | 买三退一（已发货） | 不变，继续 `30 → 40` | `0 → 1 → 2` |
        | 已完成后全部退回 | 停在 `40 已完成` | `1 → 3` |
        | 退款被驳回 | 未发货的从 `50` 回 `20`；已发货的本就没动过 | 回到 `0` 或 `2` |

        订单列表的售后标签必须由这两列**组合**渲染，不能只看 `status`。
      enum: [0, 1, 2, 3]
      # 注意：这里**不能**放 default。这个 schema 同时被 GET /orders 的
      # refund_status 查询参数引用，参数上的 default 会在客户端不传时被代入，
      # 于是「我的订单」默认只返回从未退款的订单。默认值放在 Order.refund_status
      # 这个响应属性上（它对应 DDL 的 NOT NULL DEFAULT 0）。

    OrderItemInput:
      type: object
      required: [sku_id, quantity]
      properties:
        sku_id:   { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }

    OrderCreateRequest:
      type: object
      required: [items, address_id, store_id]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
        store_id:
          type: integer
          format: int64
          description: |
            由哪家门店履约。**必填，服务端不替客户端猜。**

            读接口（`/products`、`/search`）省略 `store_id` 时会走回落链，
            这里刻意不走：买家在 A 店看到的价格与库存，下单时若被服务端
            静默落到默认门店 B，结果是**在 A 店看的货从 B 店发出、按 B 店的价成交**。
            那是一个没有任何东西会报出来的错——两家店都有这件商品、
            两个价都是合法价。

            所以这一列在 `orders` 上是 `NOT NULL`，在这里是 required。
            客户端从 `GET /stores/resolve` 或任一读接口回显的 `store.store_id`
            拿到它；单店商家同样拿得到。
        address_id:     { type: integer, format: int64 }
        user_coupon_id:
          type: integer
          format: int64
          description: |
            第一期仅支持单张券。

            券按**这一单的门店**的生效价算，门槛比的是券适用范围内商品的小计。
            包邮券（`coupon_type = 4`）抵的是运费，最多抵到 0；本单运费为 0 时它不可用（409）。
            不可用（不是你的、已锁定 / 已使用 / 已过期、门槛不够、范围不含这些商品或这家店）
            时试算与下单都返回 409 `coupon-not-applicable`，**不会静默按原价成交**。
            下单成功后券进入「锁定」，付款成功变成「已使用」，取消或超时关单回到「未使用」。
        remark: { type: string, maxLength: 200 }
        expected_payable_cents:
          $ref: '#/components/schemas/Money'
          description: |
            前端展示的应付金额。服务端试算不一致时返回 409，
            防止价格变动导致用户以旧价成交。

    OrderPreview:
      type: object
      required: [goods_amount_cents, freight_cents, freight_discount_cents, freight,
                 payable_cents, items, store_id]
      properties:
        store_id:
          type: integer
          format: int64
          description: |
            本次试算按哪家门店算的（回显请求里的 `store_id`）。
            必返：试算与下单必须是同一家店，回显是客户端唯一能核对这件事的办法。
        region_id:
          type: integer
          format: int64
          description: 那家门店所属大区。价格的中间一层按它算（数据模型 §4）。
        goods_amount_cents: { $ref: '#/components/schemas/Money' }
        freight_cents:
          $ref: '#/components/schemas/Money'
          description: |
            运费（包邮券抵扣之前）。按 `address_id` 那个收货地址、履约门店、每行商品挂的
            运费模板算（数据模型 §7「运费怎么算」）。**必返**：商家没配任何运费模板时是
            算出来的 0（`freight.groups[].free_reason = no_template`），不是「没算」。
        freight_discount_cents:
          $ref: '#/components/schemas/Money'
          description: 包邮券抵掉的运费，≤ `freight_cents`，已经算在 `discount_cents` 里。没用包邮券为 0
        freight:
          allOf: [{ $ref: '#/components/schemas/FreightBreakdown' }]
          description: 运费的明细：按模板分组、命中哪条规则、为什么包邮
        discount_cents:
          $ref: '#/components/schemas/Money'
          description: |
            优惠合计 = 各行分摊的商品优惠之和 + `freight_discount_cents`。
            应付 `payable_cents = goods_amount_cents + freight_cents − discount_cents`（与订单上的
            金额恒等式同一条）。
        payable_cents:      { $ref: '#/components/schemas/Money' }
        items:
          type: array
          description: |
            含优惠分摊结果。包邮券抵的是运费，不分摊到行（各行 `discount_cents` 为 0）。

            > **这一段是内联 schema，而内联在这里已经是一笔债了。**
            > 本轮想给每一行加一个 `price_source`（这一行的单价来自基准价 /
            > 大区价 / 门店价的哪一层，与 `order_items.price_source` 同源），
            > **加不进去**：内联 schema 让 oapi-codegen 生成一个**匿名 struct**，
            > 而 `internal/handler/order.go` 里有一处按字段拼出来的
            > `[]struct{...}` 字面量 —— 匿名类型只要多一个字段就不再可赋值，
            > 实测报错：
            >
            > ```
            > internal/handler/order.go:92:21: cannot use items (variable of type
            >   []struct{AmountCents ...; DiscountCents ...; Quantity ...; SkuId ...})
            >   as []struct{AmountCents ...; DiscountCents ...;
            >               PriceSource *api.OrderPreviewItemsPriceSource; ...}
            > ```
            >
            > 这正是「请求体不要用内联 schema」那条规矩的**响应侧同一个毛病**：
            > 内联类型没有名字，于是它的每一次演进都是一次破坏性变更。
            > 提成具名的 `OrderPreviewItem` 会同样破坏那个字面量，
            > 所以这件事要和 handler 一起改，不能只改契约。
            > 记在数据模型 §15。
          items:
            type: object
            properties:
              sku_id:         { type: integer, format: int64 }
              quantity:       { type: integer }
              amount_cents:   { $ref: '#/components/schemas/Money' }
              discount_cents:
                $ref: '#/components/schemas/Money'
                description: 该行分摊到的优惠。余数归金额最大行，保证求和恒等。
        user_coupon_id:
          type: integer
          format: int64
          description: 本次试算用上的券（回显请求里的 `user_coupon_id`）。没带券时不出现。
        applicable_coupons:
          type: array
          description: |
            这个买家手里本单可用的全部券，按优惠额降序——与 `POST /coupons/applicable`
            同一份结果。客户端据此渲染「选券」，不必再单独请求一次。
          items: { $ref: '#/components/schemas/ApplicableCoupon' }

    Order:
      type: object
      required: [order_no, status, refund_status, payable_cents, created_at, store_id]
      properties:
        order_no: { type: string }
        store_id:
          type: integer
          format: int64
          description: |
            履约门店。**必返**（DB 上是 `NOT NULL`）。
            它是真正的外键列，报表按它聚合——门店名走 `OrderDetail.store`
            那份快照，因为门店会改名（数据模型 §5）。
        region_id:
          type: integer
          format: int64
          description: |
            下单时那家门店所属的大区。**冗余在订单上，不靠 `stores.region_id` 推**：
            门店可以被调到另一个大区去，而这一单的价格是按当时那个大区算的。
        status:   { $ref: '#/components/schemas/OrderStatus' }
        refund_status:
          allOf: [{ $ref: '#/components/schemas/OrderRefundStatus' }]
          default: 0
          description: |
            售后状态，与 status 正交，必返字段（DB 上是 `NOT NULL DEFAULT 0`）。
            没有它，「买 3 件退 1 件的已发货订单」和「完全没有售后的订单」
            在响应里一模一样 —— `refunded_cents` 在退款到账前是 0，
            区分不出「退款中」与「没退款」。
        goods_amount_cents: { $ref: '#/components/schemas/Money' }
        freight_cents:
          $ref: '#/components/schemas/Money'
          description: |
            运费（包邮券抵扣之前），下单时算好写进订单（00056 之前的订单是 0：那时不计运费）。
            **实收运费 = `freight_cents − freight_discount_cents`**，售后退运费的上限按它算。
        freight_discount_cents:
          $ref: '#/components/schemas/Money'
          description: 包邮券抵掉的运费，已经算在 `discount_cents` 里。没用包邮券为 0
        discount_cents:
          $ref: '#/components/schemas/Money'
          description: 优惠合计 = 各行分摊的商品优惠之和 + `freight_discount_cents`
        user_coupon_id:
          type: integer
          format: int64
          description: 这一单用的券。没用券时不出现。
        coupon_name:
          type: string
          description: |
            这一单用的券的名字，**下单时的快照**。没用券时不出现（与 `user_coupon_id` 同进同出）。

            它存在订单上，不从券模板现读：模板后来改名，历史订单仍显示下单那一刻的名字 ——
            与 `order_items.title_snapshot`、`OrderDetail.store` 是同一条道理。
            客户端展示「已用：满 100 减 20」这类文案请用它，不要拿 `user_coupon_id`
            再去查券（那张券的模板此刻可能已经叫别的名字了）。
        payable_cents:      { $ref: '#/components/schemas/Money' }
        paid_cents:         { $ref: '#/components/schemas/Money' }
        refunded_cents:     { $ref: '#/components/schemas/Money' }
        expire_at:  { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        paid_at:    { type: string, format: date-time }
        shipped_at:
          type: string
          format: date-time
          description: 发货时间。「发货后 N 天自动确认收货」的倒计时从这里算
        finished_at: { type: string, format: date-time }

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            receiver:
              allOf: [{ $ref: '#/components/schemas/ReceiverSnapshot' }]
              description: 下单时的收货信息快照
            store:
              allOf: [{ $ref: '#/components/schemas/OrderStoreSnapshot' }]
              description: |
                下单时的门店与大区展示信息快照。
                门店改名、搬家、换大区之后，历史订单仍显示当时那一份——
                与 `order_items` 存 `title_snapshot` 是同一条道理。
            freight:
              allOf: [{ $ref: '#/components/schemas/FreightBreakdown' }]
              description: |
                下单那一刻的运费计算明细快照（`orders.freight_snapshot`）：用的哪个模板、
                命中哪条规则、为什么包邮。之后改模板不影响它。00056 之前的订单没有，整个不出现。
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderItem' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/PaymentRecord' }
            refunds:
              type: array
              description: |
                该订单下的全部退款单，按申请时间倒序。
                有 `payments` 却没有 `refunds` 是不对称的——订单详情页要展示售后进度，
                否则客户端得再请求一次 `GET /orders/{order_no}/refunds`。
              items: { $ref: '#/components/schemas/Refund' }

    OrderItem:
      type: object
      required: [id, sku_id, title, price_cents, quantity]
      properties:
        id:         { type: integer, format: int64 }
        sku_id:     { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        title:      { type: string, description: 下单时快照 }
        spec_values:
          type: object
          additionalProperties: { type: string }
        image_url:      { type: string }
        price_cents:    { $ref: '#/components/schemas/Money' }
        quantity:       { type: integer }
        amount_cents:   { $ref: '#/components/schemas/Money' }
        discount_cents: { $ref: '#/components/schemas/Money' }
        refunded_qty:
          type: integer
          description: 已退款完成的件数
        refunding_qty:
          type: integer
          description: |
            退款流程中（退款单尚未到达 `40 已退款` 或终态）占用的件数。

            **本行还可退的件数 = `quantity - refunded_qty - refunding_qty`。**

            这不是持久化列，是 `refund_items ⋈ refunds WHERE status IN (10,20,30)`
            的聚合，定义式见数据模型 §11。**数据库的 CHECK 拦不住在途超退**，
            服务端必须在同一事务内复算——不要以为提交上去有兜底。
            没有这个字段，客户端算不出可退数量，只能先提交再被 409
            `refund-quantity-exceeded` 打回——那是把校验规则藏在服务端错误里。

    # ---- 支付与退款 ----
    PaymentCreateRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [wechat, alipay, balance]
          description: |
            渠道。**沙箱与否不在这个枚举里** —— 「用哪个渠道付」和「这是不是
            沙箱」是两件正交的事，挤进同一个字段之后真接渠道时还得把枚举改回去。
            沙箱形态由服务端配置决定，并在响应的 `payload` 里自报。

    PaymentIntent:
      type: object
      required: [payment_no, channel, amount_cents]
      properties:
        payment_no:   { type: string }
        channel:
          type: string
          enum: [wechat, alipay, balance]
          description: '对外字符串 ↔ `payments.channel`：wechat=1 / alipay=2 / balance=3'
        amount_cents: { $ref: '#/components/schemas/Money' }
        payload:
          type: object
          description: 渠道特定的调起参数（如微信 JSAPI 的 prepay 参数）
          additionalProperties: true

    PaymentRecord:
      type: object
      properties:
        payment_no: { type: string }
        channel:
          type: string
          enum: [wechat, alipay, balance]
          description: '对外字符串 ↔ `payments.channel`：wechat=1 / alipay=2 / balance=3'
        amount_cents: { $ref: '#/components/schemas/Money' }
        status:     { type: integer, description: '0待支付 1成功 2失败 3已关闭' }
        paid_at:    { type: string, format: date-time }

    RefundStatus:
      type: integer
      description: |
        退款单状态机，与 `refunds.status` 的 SMALLINT 取值逐值一致。

        10 待审核 / 20 待买家退货 / 30 退款中 / 40 已退款
        50 已拒绝 / 60 已取消

        ```
        10 待审核 ─通过(退货退款)─► 20 待买家退货 ─商家收货─► 30 退款中 ─渠道成功─► 40 已退款
           │                                                   ▲
           ├─通过(仅退款)───────────────────────────────────────┘
           │
           ├─驳回──► 50 已拒绝
           └─撤销──► 60 已取消   （20 超时未寄回 / 买家撤销，同样进 60）
        ```

        合法迁移（`refund_status_transitions`，由数据库触发器执行）：
        `(10,20) (10,30) (10,50) (10,60) (20,30) (20,60) (30,40)`。
        每条边由谁走：`10→20/30/50` 审核（`/admin/refunds/{refund_no}/audit`）；
        `20→30` 商家确认收到退货（`/admin/refunds/{refund_no}/receipt`）；
        停在 `20` 期间买家填寄回物流（`/refunds/{refund_no}/return-shipment`），状态不变；
        `10/20→60` 买家撤回；`30→40` 渠道回调（`/webhooks/refunds/{channel}`）。

        `50 已拒绝` 与 `30 退款中` 失败**不是一回事**，客户端要分开展示：
        前者是商家驳回，要展示 `reject_reason` 并允许重新申请；
        后者只是「还没退到」—— `30` 没有通向失败态的边，渠道调用失败是重试而非终态，
        钱不会凭空消失，最终要么成功要么人工介入。
      enum: [10, 20, 30, 40, 50, 60]

    RefundType:
      type: integer
      description: |
        1 仅退款 / 2 退货退款。对应 `refunds.refund_type`。
        退货退款要展示寄回地址与物流填写入口，仅退款不要 ——
        已发货但用户还没收到货时两种都合法，只有用户能决定，
        所以必须由客户端显式传入，不能让服务端按订单状态猜。
      enum: [1, 2]

    RefundReasonCode:
      type: integer
      description: |
        对应 `refunds.reason_code`：
        1 不想要了 / 2 少发漏发 / 3 商品损坏 / 4 描述不符 / 5 其他
      enum: [1, 2, 3, 4, 5]

    RefundItemInput:
      type: object
      required: [order_item_id, quantity]
      properties:
        order_item_id:
          type: integer
          format: int64
          description: |
            必须属于该订单。服务端强制校验「该 item 属于该 order
            且该 order 属于当前 user」，不信任前端传入的 ID。
        quantity: { type: integer, minimum: 1 }

    RefundItem:
      type: object
      required: [order_item_id, quantity, amount_cents]
      properties:
        order_item_id: { type: integer, format: int64 }
        title:         { type: string, description: 下单时的商品标题快照 }
        image_url:     { type: string }
        quantity:      { type: integer, minimum: 1 }
        amount_cents:
          $ref: '#/components/schemas/Money'
          description: |
            该行实退金额，**由服务端算完回传，不接受客户端传入**。
            未退完时 = `floor(net × 退货件数 / quantity)`，其中
            `net = item.amount_cents - item.discount_cents`；
            退到最后一件时 = `net - 已退金额`（把余数退干净），
            保证 `SUM(amount_cents) = net` 恒等。
            余数规则与订单优惠分摊一致 —— 否则用户会遇到「我退完了，钱没退全」。

    RefundCreateRequest:
      type: object
      required: [items, refund_type, reason_code]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RefundItemInput' }
        refund_type: { $ref: '#/components/schemas/RefundType' }
        reason_code: { $ref: '#/components/schemas/RefundReasonCode' }
        reason_text:
          type: string
          maxLength: 200
          description: 补充说明。reason_code=5（其他）时建议必填
        evidence_urls:
          type: array
          maxItems: 9
          uniqueItems: true
          description: |
            凭证图片，先走 `POST /uploads`（`purpose=3 退款凭证`）拿到 `Upload.url`，原样填在这里。

            服务端逐个核对：必须是形如 `/api/v1/uploads/{upload_id}` 的地址、那个文件在本店、
            `purpose = 3`、而且**是你自己传的** —— 任何一条不满足回 422 invalid-request。
            外链图片、别人的凭证、商品图都不收：凭证要能被归属校验保护起来
            （见 `GET /uploads/{upload_id}`），一个外链地址谁都能看。
            申请成功的同一个事务里，这些文件被标记为「已引用」，不会被 24 小时的孤儿回收清掉。
          items: { type: string }

    Refund:
      type: object
      required: [refund_no, order_no, status, refund_type, amount_cents, items, created_at]
      properties:
        refund_no:  { type: string, description: 对外编号，不可枚举 }
        order_no:   { type: string }
        payment_no:
          type: string
          description: |
            原路退回的落点 —— 退的是哪一笔支付。一个订单可能有多次支付尝试，
            客户端据此显示「退回到微信 xxxx」。对应 `refunds.payment_id`。
        refund_type: { $ref: '#/components/schemas/RefundType' }
        status:      { $ref: '#/components/schemas/RefundStatus' }
        items:
          type: array
          description: |
            退款明细，对应 `refund_items`。申请时按明细提交了，查询时就要能拿回来，
            否则用户点开退款详情看不到「退了哪一件、退了几件」。
          items: { $ref: '#/components/schemas/RefundItem' }
        goods_amount_cents:
          $ref: '#/components/schemas/Money'
          description: 退的货款，已按订单优惠分摊倒算
        freight_cents:
          $ref: '#/components/schemas/Money'
          description: |
            退的运费。未发货整单退全退；部分退款不退运费
            （运费按整单算，没有可分摊的口径）；退货退款由客服审核时裁定。
        amount_cents:
          $ref: '#/components/schemas/Money'
          description: 实退总额 = goods_amount_cents + freight_cents
        channel:
          type: string
          enum: [wechat, alipay, balance]
          description: |
            退款渠道，冗余自原支付单（对账按渠道跑）。
            对外字符串 ↔ `refunds.channel`：wechat=1 / alipay=2 / balance=3。
        channel_refund_id:
          type: string
          description: |
            渠道退款流水号，由退款回调写入。用户报障与客服对账要这个号。
            `UNIQUE (channel, channel_refund_id)` 是退款回调幂等的最后一道锁。
        reason_code: { $ref: '#/components/schemas/RefundReasonCode' }
        reason_text: { type: string }
        evidence_urls:
          type: array
          items: { type: string }
        return_shipment:
          allOf: [{ $ref: '#/components/schemas/ReturnShipment' }]
          description: |
            买家寄回退货的物流（`POST /refunds/{refund_no}/return-shipment` 填的那一份）。
            只有退货退款、且买家填过时才出现；仅退款的单永远没有它。
        reject_reason:
          type: string
          description: |
            审核驳回理由，`status=50 已拒绝` 时返回。
            没有这个字段，被驳回的用户只能看到一句「已拒绝」，
            既不知道为什么，也不知道改什么再申请。
        audited_at:   { type: string, format: date-time, description: 审核时间 }
        refunded_at:  { type: string, format: date-time, description: 到账时间 }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    ReturnShipmentRequest:
      type: object
      required: [carrier_code, tracking_no]
      properties:
        carrier_code:
          type: string
          minLength: 1
          maxLength: 64
          description: '承运商标识，如 sf / jd / yto（与发货的 `Shipment.carrier_code` 同一套）'
        tracking_no:
          type: string
          minLength: 1
          maxLength: 64

    ReturnShipment:
      type: object
      required: [carrier_code, tracking_no, submitted_at]
      properties:
        carrier_code: { type: string }
        tracking_no:  { type: string }
        submitted_at:
          type: string
          format: date-time
          description: 买家最近一次填写（或修改）的时间。不是承运商揽收时间 —— 那要查物流，一期不做

    # ---- 用户与地址 ----
    IdentityProvider:
      type: integer
      description: |
        第三方身份来源，对应 `user_identities.provider`：
        1 微信小程序 / 2 微信公众号 / 3 微信开放平台 / 4 支付宝 / 5 Apple

        微信 openid 按 appid 隔离 —— 同一个人在小程序、公众号、App 里
        拿到三个不同的 openid，只有 unionid 能认成一个人，所以身份是多条而非一列。
      enum: [1, 2, 3, 4, 5]

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:  { type: string, description: 'JWT，放进 Authorization: Bearer 头' }
        refresh_token: { type: string }
        token_type:    { type: string, enum: [Bearer], default: Bearer }
        expires_in:    { type: integer, description: access_token 有效期，单位秒 }
        user:          { $ref: '#/components/schemas/User' }
        is_new_user:
          type: boolean
          default: false
          description: 首登即注册时为 true，供前端引导补全资料

    StaffRole:
      type: integer
      enum: [1, 2, 3, 4]
      description: |
        1 管理员 · 2 操作员 · 3 大区管理员 · 4 门店管理员

        角色在各自层级内生效：平台级的管理员能加平台操作员、能开店；
        商家级的管理员只能加自己店的员工。3 / 4 只存在于商家级，
        各自带管辖范围（`Staff.region_ids` / `Staff.store_ids`，一个人可以管多个）。

        同一租户内的权限矩阵（服务端逐条执行，界面上的置灰只是体验）：

        | 能做什么 | 1 | 2 | 3 | 4 |
        |---|:-:|:-:|:-:|:-:|
        | 商品、SKU、基准价、类目、上传、批量导入 | ✅ | ✅ | 只读 | 只读 |
        | 运费模板：全店模板（建、改、删、设默认）；商品挂哪个模板随商品 | ✅ | ✅ | 只读 | 只读 |
        | 运费模板：门店模板（建、改、删） | ✅ | ✅ | 本大区的门店 | 只限自己的门店 |
        | 大区：改、删、大区价、大区上下架 | ✅ | ✅ | 只限自己的大区 | ❌ |
        | 大区：建 | ✅ | ✅ | ❌ | ❌ |
        | 门店：建、改、删、围栏 | ✅ | ✅ | 只限本大区的门店（换大区时新旧都得在范围内） | ❌ |
        | 门店价、门店上下架、门店库存 | ✅ | ✅ | 本大区的门店 | 只限自己的门店 |
        | 订单与售后：订单 / 退款单的列表与详情、发货、退款审核、确认收到退货 | ✅ | ✅ | 本大区的门店 | 只限自己的门店 |
        | 设默认门店（含建店时 is_default） | ✅ | ❌ | ❌ | ❌ |
        | 员工管理 | ✅ | ❌ | 只能加、改本大区门店的门店管理员 | ❌ |
        | 开店 | 仅平台级管理员 | | | |

        `PUT /admin/skus/{sku_id}/inventory`（商家恰好一家门店时的捷径）对 3 / 4
        只在那家店在范围内时放行。列表类接口对 3 / 4 只返回范围内的；
        订单与售后按订单的**履约门店**判，门店所属的大区取它**此刻**的大区
        （货从哪家店出，就由管那家店库存的人处理这一单）；
        商品目录全量可读。被拒回 403，type 是 role-forbidden 或 out-of-scope。

    Shipment:
      type: object
      required: [id, carrier_code, tracking_no, status, shipped_at]
      properties:
        id:           { type: integer, format: int64 }
        carrier_code: { type: string, description: '承运商标识，如 sf / jd / yto' }
        tracking_no:  { type: string }
        status:
          type: integer
          enum: [1, 2, 3]
          description: '1 已发出 · 2 已签收 · 3 异常'
        shipped_at:   { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }

    ShipmentCreateRequest:
      type: object
      required: [carrier_code, tracking_no]
      description: |
        一期不接受发货明细——整单发货，包裹内容即订单全部商品。
        将来支持部分发货时在这里加 `items`，属于向后兼容的增量。
      properties:
        carrier_code: { type: string }
        tracking_no:  { type: string }

    # ---- 后台订单与售后（后台视角的读） ----
    StaffRef:
      type: object
      required: [id]
      description: |
        审计字段里的「谁」。`name` 取员工此刻的名字；平台级员工（不属于这家店）
        在租户作用域里读不到名字，此时只有 `id`。
      properties:
        id:   { type: integer, format: int64 }
        name: { type: string }

    AdminOrderSummary:
      description: |
        后台视角的订单摘要：买家侧 `Order` 的全部字段，加上收货人与门店的**下单时快照**，
        以及「这一单现在有没有在途的售后」。

        `has_open_refund` 与 `refund_status = 1` 说的是同一件事，但它是现查的
        （`EXISTS` 一张 `10/20/30` 的退款单），列表上据此挂「售后中」标签、
        提醒发货前先看一眼退款单。
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [receiver, store, has_open_refund]
          properties:
            receiver:
              allOf: [{ $ref: '#/components/schemas/ReceiverSnapshot' }]
              description: 下单时的收货信息快照
            store:
              allOf: [{ $ref: '#/components/schemas/OrderStoreSnapshot' }]
              description: 下单时的门店与大区展示快照
            has_open_refund:
              type: boolean
              description: 有没有处于 10 待审核 / 20 待买家退货 / 30 退款中的退款单

    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/AdminOrderSummary'
        - type: object
          required: [items, payments, shipments, refunds]
          properties:
            freight:
              allOf: [{ $ref: '#/components/schemas/FreightBreakdown' }]
              description: 下单那一刻的运费计算明细快照，同买家侧 `OrderDetail.freight`
            items:
              type: array
              description: 订单行，含优惠分摊（`discount_cents`）与已退 / 在途件数
              items: { $ref: '#/components/schemas/OrderItem' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/PaymentRecord' }
            shipments:
              type: array
              description: 发货包裹，按发货先后。一期整单发货，至多一个
              items: { $ref: '#/components/schemas/Shipment' }
            refunds:
              type: array
              description: 该订单下的全部退款单，按申请时间倒序
              items: { $ref: '#/components/schemas/AdminRefund' }

    AdminRefund:
      description: |
        后台视角的退款单：买家侧 `Refund` 的全部字段，加上履约门店与审核记录。

        审核记录不进买家侧的 `Refund`：「哪个员工审的」是商家内部的事。
        `audited_by` / `received_by` 只对迁移 00035 之后的动作有值，之前的单只有时间。
      allOf:
        - $ref: '#/components/schemas/Refund'
        - type: object
          required: [store_id, store, order_status]
          properties:
            store_id:
              type: integer
              format: int64
              description: 所属订单的履约门店（后台判权按它）
            store:
              allOf: [{ $ref: '#/components/schemas/OrderStoreSnapshot' }]
              description: 所属订单下单时的门店快照
            order_status:
              allOf: [{ $ref: '#/components/schemas/OrderStatus' }]
              description: 所属订单此刻的履约状态
            audited_by:
              allOf: [{ $ref: '#/components/schemas/StaffRef' }]
              description: 通过或驳回这张单的员工（与 `audited_at` 同一次动作）
            received_at:
              type: string
              format: date-time
              description: 确认收到退货的时间（退货退款 `20 → 30` 那一步）
            received_by:
              allOf: [{ $ref: '#/components/schemas/StaffRef' }]
              description: 确认收到退货的员工

    AdminRefundDetail:
      allOf:
        - $ref: '#/components/schemas/AdminRefund'
        - type: object
          required: [order]
          properties:
            order:
              allOf: [{ $ref: '#/components/schemas/AdminOrderSummary' }]
              description: |
                所属订单的摘要。审核退货退款时裁定运费要看订单实收运费
                （`freight_cents − freight_discount_cents`）；
                服务端另外会扣掉这一单别的退款单已占的运费，超了回 422 refund-freight-exceeded。

    Staff:
      type: object
      required: [id, email, role, status, merchant_id, region_ids, store_ids, created_at]
      properties:
        id:    { type: integer, format: int64 }
        email: { type: string, format: email }
        name:  { type: string }
        role:  { $ref: '#/components/schemas/StaffRole' }
        status: { type: integer, enum: [1, 2], description: '1 正常 2 停用' }
        merchant_id:
          type: [integer, 'null']
          format: int64
          description: |
            所属商家。**为 null 表示平台级操作员**——他不属于任何一家店，
            能建商家、做跨租户运维。
        region_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 管辖的大区（仅 role 3 非空）。按 id 升序
        store_ids:
          type: array
          items: { type: integer, format: int64 }
          description: 管辖的门店（仅 role 4 非空）。按 id 升序
        last_login_at: { type: string, format: date-time }
        created_at:    { type: string, format: date-time }

    StaffSession:
      type: object
      required: [token, expire_at, staff]
      properties:
        token:
          type: string
          description: |
            会话 token，放进 `Authorization: Bearer`。默认 7 天。

            **服务端只存它的 sha256**，明文仅在这一次响应里出现。
            后台 token 能读全部订单与客户手机号、能改价、能发起退款——
            它和支付密钥是同一个量级的东西。
        expire_at: { type: string, format: date-time }
        staff:     { $ref: '#/components/schemas/Staff' }

    StaffLoginToken:
      type: object
      required: [staff_id, token, expire_at]
      description: |
        一串一次性登录 token，与新建员工时服务端签的那一串同一种（15 分钟、用掉即失效），
        拿去换 `POST /admin/auth/session`。
      properties:
        staff_id: { type: integer, format: int64, description: 这串 token 属于谁 }
        token:
          type: string
          description: |
            一次性登录 token 明文。**服务端只存它的 sha256**，明文只在这一次响应
            （和进程日志）里出现。
        expire_at: { type: string, format: date-time }

    StaffCreateRequest:
      type: object
      required: [email, role]
      description: |
        **没有 `merchant_id` 字段，这是刻意的。** 租户归属从调用者的会话继承。
      properties:
        email: { type: string, format: email }
        name:  { type: string }
        role:  { $ref: '#/components/schemas/StaffRole' }
        region_ids:
          type: array
          items: { type: integer, format: int64 }
          description: role 3 必填且至少一个；其余角色不带
        store_ids:
          type: array
          items: { type: integer, format: int64 }
          description: role 4 必填且至少一个；其余角色不带

    Merchant:
      type: object
      required: [id, code, name, status, created_at]
      properties:
        id:     { type: integer, format: int64 }
        code:
          type: string
          description: 短标识，全局唯一，用于域名或路径路由
        name:   { type: string }
        status: { type: integer, enum: [1, 2, 3], description: '1 正常 2 停用 3 待审核' }
        domain:
          type: string
          description: 自定义域名；为空则走 `/s/{code}` 路径路由
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: 最近一次改名或改状态的时间（最新一行 `merchant_revisions` 的时间）。从没改过时缺席。

    MerchantList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, single_merchant_mode]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Merchant' }
            single_merchant_mode:
              type: boolean
              description: |
                这套部署是不是单商家形态（配了 `KEEL_DEFAULT_MERCHANT`）。**必返。**
                为 `true` 时 `POST /admin/merchants` 一定返回 409 `single-merchant-mode`，
                后台据此把开店入口置灰并说明原因。

    MerchantUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        status:
          type: integer
          enum: [1, 2]
          description: '1 正常 2 停用。没有 3：审核流程本轮不存在。'

    MerchantCreateRequest:
      type: object
      required: [code, name, admin_email]
      properties:
        code: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,30}$' }
        name: { type: string }
        admin_email:
          type: string
          format: email
          description: 该店第一个管理员的邮箱，建好后给他发登录链接

    UploadTarget:
      type: integer
      enum: [1, 2, 3]
      description: |
        文件用途，取值与 `uploads.purpose` 逐值一致：
        1 商品图 · 2 头像 · 3 退款凭证。

        用途决定了服务端的归属校验规则——退款凭证只有上传者本人与客服可读。

    Upload:
      type: object
      required: [id, url, content_type, size_bytes, created_at]
      properties:
        id: { type: integer, format: int64 }
        url:
          type: string
          description: |
            可直接写入业务字段（如 `evidence_urls`、`avatar_url`）的访问地址，
            形如 `/api/v1/uploads/{upload_id}`。

            **它指向 `GET /uploads/{upload_id}`，不是裸的存储路径。**
            读取时在那里做归属校验，再 302 到限时地址——
            无论底层是本地磁盘还是 S3，对客户端都是同一个形状。
            客户端不应解析它，原样回传即可。
        content_type: { type: string, example: image/jpeg }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    User:
      type: object
      required: [id, nickname]
      properties:
        id:      { type: integer, format: int64 }
        nickname:   { type: string }
        avatar_url: { type: string }
        phone:
          type: string
          description: 脱敏返回，如 138****8000。完整号码只在绑定流程中由用户自己输入
          examples: ['138****8000']
        gender:
          type: integer
          description: '0 未知 / 1 男 / 2 女'
          enum: [0, 1, 2]
        has_password:
          type: boolean
          description: |
            `users.password_hash` 可空 —— 仅第三方登录的用户没有密码。
            前端据此决定是否显示「设置密码」入口，而不是显示「修改密码」。
        created_at:    { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    UserIdentity:
      type: object
      required: [id, provider, created_at]
      properties:
        id:       { type: integer, format: int64 }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        has_union_id:
          type: boolean
          description: 是否已取到 unionid（能否跨应用打通）
        created_at: { type: string, format: date-time, description: 绑定时间 }
      # 注意：external_id（openid）与 union_id 属于渠道敏感标识，一律不对外返回

    AddressInput:
      type: object
      required: [receiver_name, phone, province, city, district, detail]
      properties:
        receiver_name: { type: string, maxLength: 32 }
        phone:         { type: string }
        province:      { type: string }
        city:          { type: string }
        district:      { type: string }
        street:        { type: string, default: '' }
        detail:        { type: string, maxLength: 200, description: 门牌号等 }
        region_code:
          type: string
          description: |
            行政区划码。比省市区三个字符串可靠 ——「内蒙古」与「内蒙古自治区」
            是同一个地方，但字符串匹配不出来，而运费模板与偏远地区判定都按区划做。
        postal_code:   { type: string }
        tag:
          type: integer
          description: '0 无 / 1 家 / 2 公司 / 3 学校'
          enum: [0, 1, 2, 3]
          default: 0
        is_default:
          type: boolean
          default: false
          description: |
            仅在**新增**时有效（服务端同事务内先清旧默认再置新）。
            后续切换默认地址请用 `PUT /addresses/{address_id}/default`。

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, is_default]
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    ReceiverSnapshot:
      type: object
      required: [receiver_name, phone, province, city, district, detail]
      description: |
        下单瞬间从 `user_addresses` 拷贝的收货信息快照，落在
        `orders.receiver_snapshot`。地址簿后来改了或删了，历史订单不受影响。

        字段与 `AddressInput` 同源但**不复用 $ref**：快照不该带 `is_default`、
        `tag` 这些属于地址簿管理的字段，也不该随地址簿 schema 演进而变形——
        快照的字段集一旦定下就不能再动，否则历史数据解析不了。
      properties:
        receiver_name: { type: string }
        phone:         { type: string }
        province:      { type: string }
        city:          { type: string }
        district:      { type: string }
        street:        { type: string }
        detail:        { type: string }
        region_code:   { type: string }
        postal_code:   { type: string }

    # ---- 优惠券 ----
    CouponType:
      type: integer
      description: |
        1 满减 · 2 折扣 · 3 立减 · 4 包邮。

        **4 包邮**抵的是运费（00056 运费模板落地之后可建）：`max_discount_cents` 是最多抵多少
        （0 = 运费全免），门槛与范围的判法与别的券相同。本单运费为 0 时不可用（数据模型 §7）。
      enum: [1, 2, 3, 4]

    CouponScope:
      type: object
      description: |
        一条适用范围规则（数据模型 §7 `coupon_scopes`）。1–4 决定哪几行商品参与计算，
        5–6 决定在哪家店下单可用；`include = false` 是排除，排除优先。
      required: [scope_type, target_id, include]
      properties:
        scope_type:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
          description: 1全场 2分类（含子孙） 3商品 4品牌 5大区 6门店
        target_id:
          type: [integer, 'null']
          format: int64
          description: 全场为 null；其余按 `scope_type` 指向分类 / 商品 / 品牌 / 大区 / 门店的 id
        include: { type: boolean }
        target_name:
          type: string
          description: |
            目标的展示名（分类名、商品标题、大区名、门店名），只读。品牌没有目录，不返回；
            目标已软删时也不返回——客户端据此显示「已删除」。

    CouponScopeInput:
      type: object
      required: [scope_type]
      properties:
        scope_type:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
        target_id:
          type: [integer, 'null']
          format: int64
        include:
          type: boolean
          default: true

    CouponScopesSetRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CouponScopeInput' }

    UserCoupon:
      type: object
      required: [id, coupon_code, template_id, name, coupon_type, threshold_cents, discount_cents,
                 discount_rate, max_discount_cents, status, source, valid_start_at, valid_end_at, scopes]
      properties:
        id:          { type: integer, format: int64 }
        coupon_code: { type: string }
        template_id: { type: integer, format: int64 }
        name:        { type: string }
        coupon_type: { $ref: '#/components/schemas/CouponType' }
        threshold_cents: { $ref: '#/components/schemas/Money' }
        discount_cents:  { $ref: '#/components/schemas/Money' }
        discount_rate:
          type: integer
          description: 千分比，850 = 8.5 折
        max_discount_cents: { $ref: '#/components/schemas/Money' }
        status:
          type: integer
          enum: [1, 2, 3, 4]
          description: |
            1 未使用 · 2 锁定 · 3 已使用 · 4 已过期

            **锁定**指下单流程中已占用但订单尚未支付。取消订单或超时关单后
            回到「未使用」；支付成功后变成「已使用」。这个态必须能被前端查到——
            否则用户下单未支付时，券在「可用」和「已使用」里都找不到，像凭空消失。

            **已过期是现算的**：未使用且已过 `valid_end_at` 即返回 4。
        source:
          type: integer
          enum: [1, 2]
          description: 1 领券中心领取 · 2 商家定向发放
        valid_start_at: { type: string, format: date-time }
        valid_end_at:   { type: string, format: date-time }
        used_at:        { type: string, format: date-time }
        scopes:
          type: array
          description: 这张券的适用范围（来自模板）。空数组即全场、全店。
          items: { $ref: '#/components/schemas/CouponScope' }

    ApplicableCoupon:
      allOf:
        - $ref: '#/components/schemas/UserCoupon'
        - type: object
          required: [applicable_discount_cents]
          properties:
            applicable_discount_cents:
              $ref: '#/components/schemas/Money'
              description: |
                这张券用在本单上能减多少。与带上这张券调 `POST /orders/preview` 得到的
                `discount_cents` 逐分相等（同一份实现）。

                不叫 `discount_cents`：`UserCoupon.discount_cents` 已经是「券面减免额」
                （满 100 减 20 的那个 20），同名字段在 allOf 里会互相覆盖。

    CouponApplicableRequest:
      type: object
      required: [items, store_id]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
        store_id:
          type: integer
          format: int64
          description: 履约门店，必填。理由同 `OrderCreateRequest.store_id`。
        address_id:
          type: integer
          format: int64
          description: |
            收货地址，可选。**包邮券要它**：包邮券能抵多少取决于运费，运费取决于地址。
            不传时结果里没有包邮券（判不了它能不能用），其余券型不受影响。
            传了却不存在或不属于你：422。

    ClaimableCouponTemplate:
      type: object
      required: [id, name, coupon_type, threshold_cents, discount_cents, discount_rate, max_discount_cents,
                 valid_mode, valid_days, remaining, per_user_limit, claimed_count, can_claim, scopes]
      properties:
        id:   { type: integer, format: int64 }
        name: { type: string }
        coupon_type: { $ref: '#/components/schemas/CouponType' }
        threshold_cents:    { $ref: '#/components/schemas/Money' }
        discount_cents:     { $ref: '#/components/schemas/Money' }
        discount_rate:      { type: integer, description: 千分比 }
        max_discount_cents: { $ref: '#/components/schemas/Money' }
        valid_mode:
          type: integer
          enum: [1, 2]
          description: 1 绝对时间 · 2 领取后 N 天
        valid_start_at: { type: string, format: date-time }
        valid_end_at:   { type: string, format: date-time }
        valid_days:     { type: integer }
        remaining:
          type: [integer, 'null']
          description: 还剩多少张；`null` 表示不限量
        per_user_limit: { type: integer }
        claimed_count:
          type: integer
          description: 当前买家已持有这个模板的券数（含商家定向发放的）
        can_claim:
          type: boolean
          description: 当前买家现在能不能领（没到每人限领）
        scopes:
          type: array
          items: { $ref: '#/components/schemas/CouponScope' }

    CouponTemplateStats:
      type: object
      description: 发放与核销统计。`issued = claimed + granted = unused + locked + used + expired`。
      required: [issued, claimed, granted, unused, locked, used, expired]
      properties:
        issued:  { type: integer, description: 已发出（与 `issued_count` 相等） }
        claimed: { type: integer, description: 其中买家在领券中心领的 }
        granted: { type: integer, description: 其中商家定向发放的 }
        unused:  { type: integer, description: 未使用且未过期 }
        locked:  { type: integer, description: 被待支付订单占用中 }
        used:    { type: integer, description: 已核销（订单已支付） }
        expired: { type: integer, description: 未使用且已过期 }

    AdminCouponTemplate:
      type: object
      required: [id, name, coupon_type, threshold_cents, discount_cents, discount_rate,
                 max_discount_cents, valid_mode, valid_days, total_count, issued_count,
                 per_user_limit, claimable, status, locked, scopes, stats, created_at, updated_at]
      properties:
        id:   { type: integer, format: int64 }
        name: { type: string }
        coupon_type: { $ref: '#/components/schemas/CouponType' }
        threshold_cents:    { $ref: '#/components/schemas/Money' }
        discount_cents:     { $ref: '#/components/schemas/Money' }
        discount_rate:      { type: integer, description: 千分比 }
        max_discount_cents: { $ref: '#/components/schemas/Money' }
        valid_mode:     { type: integer, enum: [1, 2] }
        valid_start_at: { type: string, format: date-time }
        valid_end_at:   { type: string, format: date-time }
        valid_days:     { type: integer }
        total_count:    { type: integer, description: 总量，0 = 不限 }
        issued_count:   { type: integer }
        per_user_limit: { type: integer }
        claimable:      { type: boolean }
        status:
          type: integer
          enum: [0, 1]
          description: 1 启用 · 0 停用（停止领取与发放，不回收已发出的券）
        locked:
          type: boolean
          description: 已发出过券，券面字段与范围不能再改
        scopes:
          type: array
          items: { $ref: '#/components/schemas/CouponScope' }
        stats: { $ref: '#/components/schemas/CouponTemplateStats' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CouponTemplateCreateRequest:
      type: object
      required: [name, coupon_type, valid_mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        coupon_type: { $ref: '#/components/schemas/CouponType' }
        threshold_cents:    { $ref: '#/components/schemas/Money' }
        discount_cents:     { $ref: '#/components/schemas/Money' }
        discount_rate:      { type: integer, minimum: 0, maximum: 999 }
        max_discount_cents: { $ref: '#/components/schemas/Money' }
        valid_mode:     { type: integer, enum: [1, 2] }
        valid_start_at: { type: string, format: date-time }
        valid_end_at:   { type: string, format: date-time }
        valid_days:     { type: integer, minimum: 0, maximum: 3650 }
        total_count:    { type: integer, minimum: 0, description: 0 = 不限 }
        per_user_limit: { type: integer, minimum: 1, default: 1 }
        claimable:      { type: boolean, default: false }

    CouponTemplatePatchRequest:
      type: object
      description: 只改传了的字段。有效期整组替换：改 `valid_mode` 时要把那一模式的字段一起给。
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        coupon_type: { $ref: '#/components/schemas/CouponType' }
        threshold_cents:    { $ref: '#/components/schemas/Money' }
        discount_cents:     { $ref: '#/components/schemas/Money' }
        discount_rate:      { type: integer, minimum: 0, maximum: 999 }
        max_discount_cents: { $ref: '#/components/schemas/Money' }
        valid_mode:     { type: integer, enum: [1, 2] }
        valid_start_at: { type: string, format: date-time }
        valid_end_at:   { type: string, format: date-time }
        valid_days:     { type: integer, minimum: 0, maximum: 3650 }
        total_count:    { type: integer, minimum: 0 }
        per_user_limit: { type: integer, minimum: 1 }
        claimable:      { type: boolean }
        status:         { type: integer, enum: [0, 1] }

    CouponGrantRequest:
      type: object
      required: [phones]
      properties:
        phones:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, minLength: 1, maxLength: 32 }

    CouponGrantResult:
      type: object
      required: [template_id, granted, coupons]
      properties:
        template_id: { type: integer, format: int64 }
        granted:     { type: integer, description: 本次发出的张数 }
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/CouponGrantItem'

    CouponGrantItem:
      type: object
      required: [phone, user_id, user_coupon_id, coupon_code]
      properties:
        phone:          { type: string }
        user_id:        { type: integer, format: int64 }
        user_coupon_id: { type: integer, format: int64 }
        coupon_code:    { type: string }

    # ---- 消息通知（数据模型 §16）----
    NotificationKind:
      type: string
      description: |
        通知的种类。**文案不要按它拼**（服务端已渲染好 `title` / `body`），
        它只用来挑图标与分组。发给谁、由哪一次状态变化产生：

        买家（`GET /me/notifications`）：
        · `order_paid` —— 支付成功（订单 `10 → 20`，支付回调入账）
        · `order_shipped` —— 已发货，正文带承运商与运单号（`20 → 30`）
        · `order_auto_confirm_soon` —— 自动确认收货即将到期（到期前 1 天；有在途售后的单不提醒）
        · `order_finished` —— 系统自动确认收货，订单完成（`30 → 40`，定时任务）。
          买家**自己**点确认收货不发：动作是他做的，不需要再告诉他
        · `order_timeout_closed` —— 超时未支付被系统关闭（`10 → 90`，超时补偿任务）。
          买家自己取消不发，理由同上
        · `refund_approved` —— 售后审核通过（退货退款提示去填寄回物流）
        · `refund_rejected` —— 售后被驳回，正文带驳回理由
        · `refund_succeeded` —— 退款到账（退款单 `30 → 40`）

        商家（`GET /admin/notifications`）：
        · `merchant_order_paid` —— 新的已支付待发货订单
        · `merchant_refund_requested` —— 新的待审核售后
        · `merchant_return_shipped` —— 买家填了（或改了）退货寄回物流
        · `merchant_inventory_low` —— 下单扣减后门店库存降到预警线（`warning_qty`）或以下；
          扣到 0 时标题是「已售罄」
      enum:
        - order_paid
        - order_shipped
        - order_auto_confirm_soon
        - order_finished
        - order_timeout_closed
        - refund_approved
        - refund_rejected
        - refund_succeeded
        - merchant_order_paid
        - merchant_refund_requested
        - merchant_return_shipped
        - merchant_inventory_low

    NotificationTarget:
      type: object
      required: [type, order_no, refund_no, store_id, sku_id]
      description: |
        点了这条通知跳到哪里。四个定位字段都一定出现，用不上的是 `null`：
        · `order` —— `order_no` 非空，跳订单详情；
        · `refund` —— `refund_no` 非空（`order_no` 也给出所属订单），跳售后详情；
        · `inventory` —— `store_id` 与 `sku_id` 非空，跳那家门店的库存（只出现在后台）。
      properties:
        type:
          type: string
          enum: [order, refund, inventory]
        order_no:  { type: [string, 'null'] }
        refund_no: { type: [string, 'null'] }
        store_id:  { type: [integer, 'null'], format: int64 }
        sku_id:    { type: [integer, 'null'], format: int64 }

    Notification:
      type: object
      required: [id, kind, title, body, target, read_at, created_at]
      properties:
        id:    { type: integer, format: int64 }
        kind:  { $ref: '#/components/schemas/NotificationKind' }
        title: { type: string, description: 服务端渲染好的中文标题，原样展示 }
        body:  { type: string, description: 服务端渲染好的中文正文，原样展示 }
        target: { $ref: '#/components/schemas/NotificationTarget' }
        read_at:
          type: [string, 'null']
          format: date-time
          description: 已读时间；`null` 即未读。后台是**调用者自己**的已读时间。
        created_at: { type: string, format: date-time }

    NotificationList:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, unread_count]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Notification' }
            unread_count:
              type: integer
              description: 调用者的未读总数（与 `unread_only` 无关，也不受分页影响）。

    NotificationUnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer }

    # ---- 门店、大区与围栏（数据模型 §4）----

    # ---- 运费（00055 / 00056）----
    ProvinceCode:
      type: string
      pattern: '^[1-9][0-9]0000$'
      description: |
        省级行政区划码（GB/T 2260 的 6 位码，后四位为 0），如 `110000` 北京、`440000` 广东、
        `650000` 新疆。只收 34 个省级行政区的码（含港澳台），别的 422。
        收货地址按 `region_code` 的前两位归到省；地址没有 `region_code` 时按 `province`
        文字匹配（「内蒙古」与「内蒙古自治区」都认）。
      examples: ['110000']

    FreightChargeMode:
      type: integer
      enum: [1, 2]
      description: '1 按件 · 2 按重量（单位克，取 SKU 的 `weight_gram`）'

    FreightRule:
      type: object
      description: |
        一条计费规则：管哪些省、首件（首重）多少钱、续件（续重）多少钱、满什么条件包邮。
        运费 = `first_fee_cents` + ⌈max(0, 件数或克数 − `first_unit`) ÷ `additional_unit`⌉ × `additional_fee_cents`。
      required: [region_codes, first_unit, first_fee_cents, additional_unit, additional_fee_cents,
                 free_threshold_cents, free_quantity]
      properties:
        region_codes:
          type: array
          maxItems: 34
          items: { $ref: '#/components/schemas/ProvinceCode' }
          description: 这条规则管哪些省。**空数组 = 默认规则**（其余地区），一个模板恰好一条。
        first_unit:
          type: integer
          minimum: 1
          maximum: 1000000
          description: 首件件数（按件）或首重克数（按重量）
        first_fee_cents:
          $ref: '#/components/schemas/Money'
          description: 首件（首重）费，0～1000000 分
        additional_unit:
          type: integer
          minimum: 1
          maximum: 1000000
          description: 续件件数或续重克数：每超出这么多收一次续费，不足一个单位按一个算
        additional_fee_cents:
          $ref: '#/components/schemas/Money'
          description: 续件（续重）费，0～1000000 分
        free_threshold_cents:
          $ref: '#/components/schemas/Money'
          description: |
            满额包邮：**整单优惠后应付商品金额**（营销活动、优惠券都减完之后）≥ 它即这条规则免运费。
            0 = 不设。
        free_quantity:
          type: integer
          minimum: 0
          maximum: 999999
          description: 满件包邮：整单件数 ≥ 它即这条规则免运费。0 = 不设

    FreightTemplateInput:
      type: object
      description: 新建与整体替换共用。字段含义见 `POST /admin/freight-templates`。
      required: [name, charge_mode, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        store_id:
          type: [integer, 'null']
          format: int64
          description: null 或不填 = 全店模板；非 null = 这家门店的门店模板（每店至多一个）。
        charge_mode: { $ref: '#/components/schemas/FreightChargeMode' }
        is_default:
          type: boolean
          default: false
          description: |
            设为全店默认模板（只有全店模板能设）。同一时刻至多一个：设了这一个，
            原来的默认在同一个事务里被取消。
        rules:
          type: array
          minItems: 1
          maxItems: 35
          items: { $ref: '#/components/schemas/FreightRule' }
        undeliverable_region_codes:
          type: array
          maxItems: 34
          default: []
          items: { $ref: '#/components/schemas/ProvinceCode' }
          description: 不配送的省。不能与任何一条规则的 `region_codes` 重叠。

    AdminFreightTemplate:
      type: object
      required: [id, name, store_id, charge_mode, is_default, rules, undeliverable_region_codes,
                 product_count, created_at, updated_at]
      properties:
        id:   { type: integer, format: int64 }
        name: { type: string }
        store_id:
          type: [integer, 'null']
          format: int64
          description: null = 全店模板
        charge_mode: { $ref: '#/components/schemas/FreightChargeMode' }
        is_default:
          type: boolean
          description: 是不是全店默认模板
        rules:
          type: array
          description: 默认规则（`region_codes` 为空）排在最后，其余按录入顺序
          items: { $ref: '#/components/schemas/FreightRule' }
        undeliverable_region_codes:
          type: array
          items: { $ref: '#/components/schemas/ProvinceCode' }
        product_count:
          type: integer
          description: 挂着这个模板的未删除商品数。大于 0 时不能删除
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FreightFreeReason:
      type: string
      enum: [threshold, quantity, no_template]
      description: |
        这一组为什么免运费：`threshold` 满额包邮、`quantity` 满件包邮、
        `no_template` 这些商品没有任何可用的运费模板（商家没配，不计运费）。
        照常计费时整个字段不出现。**包邮券抵掉的运费不算在这里**，那一笔看
        `freight_discount_cents`。

    FreightGroup:
      type: object
      description: |
        按运费模板分的一组商品及其运费。一单里的商品挂不同模板时分成几组，
        各组分别计费、**求和**（不做「首费取最大」那种跨模板合并，数据模型 §7 写了理由）。
      required: [sku_ids, units, fee_cents]
      properties:
        template_id:
          type: [integer, 'null']
          format: int64
          description: 用的是哪个模板；`free_reason = no_template` 时为 null
        template_name:
          type: string
          description: 模板名（订单上是下单那一刻的名字）
        charge_mode: { $ref: '#/components/schemas/FreightChargeMode' }
        sku_ids:
          type: array
          items: { type: integer, format: int64 }
        units:
          type: integer
          description: 计费量：按件是件数，按重量是克数
        rule:
          allOf: [{ $ref: '#/components/schemas/FreightRule' }]
          description: 命中的那一条规则（`region_codes` 为空即默认规则）。没有模板时不出现
        fee_cents:
          $ref: '#/components/schemas/Money'
          description: 这一组的运费（包邮时为 0）
        free_reason: { $ref: '#/components/schemas/FreightFreeReason' }

    FreightBreakdown:
      type: object
      description: |
        运费是怎么算出来的。试算与购物车里是**现算**的，订单上是**下单那一刻的快照**
        （`orders.freight_snapshot`），之后改模板不影响它。
      required: [freight_cents, freight_discount_cents, groups]
      properties:
        province_code:
          allOf: [{ $ref: '#/components/schemas/ProvinceCode' }]
          description: 收货地址归到的省。地址既没有可用的 `region_code` 也匹配不上省名时不出现（此时按各模板的默认规则算）
        freight_cents:
          $ref: '#/components/schemas/Money'
          description: 运费合计（包邮券抵扣之前），= 各组 `fee_cents` 之和
        freight_discount_cents:
          $ref: '#/components/schemas/Money'
          description: 包邮券抵掉的运费，≤ `freight_cents`。没用包邮券为 0
        groups:
          type: array
          items: { $ref: '#/components/schemas/FreightGroup' }

    FreightUndeliverableLine:
      type: object
      required: [sku_id, reason_code, reason]
      properties:
        sku_id: { type: integer, format: int64 }
        reason_code:
          type: string
          enum: [region_excluded, province_unknown]
          description: |
            `region_excluded`：这件商品用的运费模板把收货地址所在的省列为不配送；
            `province_unknown`：收货地址归不到任何一个省（没有可用的 `region_code`，省名也匹配不上），
            而这个模板设了不配送地区，判不了在不在配送范围——请买家补全地址。
        reason:
          type: string
          description: 给人看的一句话，如「新疆维吾尔自治区不在「默认运费」的配送范围」

    GeoPolygon:
      type: object
      description: |
        GeoJSON Polygon，SRID 固定 4326。落库成 `GEOGRAPHY(POLYGON, 4326)`。

        **坐标序是 `[经度, 纬度]`**，和中文口语里的「纬度、经度」相反。
        这是 GeoJSON 规范定的，不是本项目的选择。写反了不会报错——
        它会得到一个在地球另一侧的合法多边形，而所有判定都「正常工作」。
        服务端按经度 ∈ [-180,180]、纬度 ∈ [-90,90] 做范围校验，
        那是唯一能机械发现写反的办法。

        `coordinates` 的第一个环是外环，后续是内环（洞）。
        每个环必须**闭合**（首尾点相同），至少 4 个点，且**不自交**——
        自交多边形在 `ST_Intersects` 下的行为是未定义的，落库前过 `ST_IsValid`。
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          description: 环的数组。第一个是外环。
          items:
            type: array
            minItems: 4
            description: 一个环，首尾点必须相同。
            items:
              type: array
              minItems: 2
              maxItems: 2
              description: '`[经度, 纬度]`。'
              items: { type: number }
          examples:
            - [[[116.30, 39.85], [116.50, 39.85], [116.50, 39.95], [116.30, 39.95], [116.30, 39.85]]]

    StoreMatchType:
      type: string
      enum: [fence, fallback_default, none]
      description: |
        「当前门店」是怎么定下来的。这三个值是产品规则的对外形状，
        每一个都有机械执行者（数据模型 §4 那张表）：

        · `fence` —— 坐标落在一个或多个围栏内，按距离升序返回
        · `fallback_default` —— 不在任何围栏内，**或根本没有位置**，回落默认门店
        · `none` —— 连默认门店都没配，这个租户对这次请求**不在服务范围**

        `none` 不是错误，是一个正常的查询结果。

    StoreContext:
      type: object
      description: |
        每一条会受门店影响的读接口都回显它。**没有它，客户端拿到的
        `in_stock` 与价格是不知道属于谁的**——按门店分之后，
        同一件商品对不同的人有不同的答案。
      required: [match_type]
      properties:
        store_id:
          type: [integer, 'null']
          format: int64
          description: 本次响应是按哪家门店算的。`match_type = none` 时为 null。
        region_id:
          type: [integer, 'null']
          format: int64
          description: 那家门店所属大区。价格的中间一层按它算。
        match_type: { $ref: '#/components/schemas/StoreMatchType' }

    Store:
      type: object
      description: 买家视角的门店。不含围栏——围栏是运营数据，不该发给客户端。
      required: [id, name, is_default]
      properties:
        id:         { type: integer, format: int64 }
        name:       { type: string }
        phone:      { type: string }
        address:    { type: string }
        lat:        { type: [number, 'null'] }
        lng:        { type: [number, 'null'] }
        is_default:
          type: boolean
          description: 是否是这家商家的「全国配送」回落门店。

    StoreMatch:
      allOf:
        - $ref: '#/components/schemas/Store'
        - type: object
          required: [distance_m]
          properties:
            distance_m:
              type: [number, 'null']
              description: |
                买家坐标到门店坐标的球面距离，**单位米**。
                `/stores/resolve` 的排序键，升序。

                为 null **当且仅当**本次请求没带坐标（`fallback_default`）——
                那时没有起点，算不出距离。客户端据此决定显示不显示「距您 x 米」。

                单位是米而不是「度」：`stores.location` 是
                `GEOGRAPHY(POINT, 4326)`，走球面计算。用 `GEOMETRY` 的话
                `ST_Distance` 返回度，而一度经度与一度纬度在中纬度差约 30%，
                排序会在东西向与南北向上系统性偏斜——且看起来完全正常
                （数据模型 §4）。

    StoreResolveResult:
      type: object
      required: [match_type, stores]
      properties:
        match_type: { $ref: '#/components/schemas/StoreMatchType' }
        stores:
          type: array
          description: |
            `fence` 时是命中的全部门店按 `distance_m` 升序；
            `fallback_default` 时恰好一家（默认门店）；
            `none` 时是**空数组**，不是 null。
          items: { $ref: '#/components/schemas/StoreMatch' }

    AdminRegion:
      type: object
      description: |
        后台视角的大区。**没有几何**——大区是门店的分组，
        归属由 `stores.region_id` 决定（数据模型 §4 论证过为什么不给它画边界）。
      required: [id, code, name, status, store_count, created_at]
      properties:
        id:     { type: integer, format: int64 }
        code:   { type: string, description: 租户内唯一（软删的不占用）。 }
        name:   { type: string }
        status:
          type: integer
          enum: [0, 1]
          description: 0 停用 / 1 启用。
        store_count:
          type: integer
          description: |
            名下未软删的门店数。删大区时会因为它非零而被拒（409），
            所以列表里直接给出来，省掉「点了删除才知道删不掉」那一跳。
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegionCreateRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 100 }

    RegionUpdateRequest:
      type: object
      description: 只给要改的字段。`code` 改了要重查唯一性。
      properties:
        code:   { type: string, maxLength: 64 }
        name:   { type: string, maxLength: 100 }
        status: { type: integer, enum: [0, 1] }

    AdminStore:
      type: object
      description: |
        后台视角的门店，**含围栏**。与买家侧的 `Store` 分成两个 schema，
        理由与 `AdminProduct` / `ProductSummary` 一样：围栏、停业状态、软删标记
        是运营要管的，把它们加进买家 schema 等于让生成出来的买家客户端
        带着一组它永远收不到、也不该收到的字段。
      required: [id, region_id, code, name, is_default, status, created_at]
      properties:
        id:        { type: integer, format: int64 }
        region_id:
          type: integer
          format: int64
          description: |
            所属大区，**必填且不可空**（`stores.region_id NOT NULL`）。
            换大区会同时改变这家店的价格与可见性——大区是两层覆盖里的外层。
        region_name: { type: string }
        code:      { type: string, description: 租户内唯一（软删的不占用）。 }
        name:      { type: string }
        phone:     { type: string }
        province:  { type: string }
        city:      { type: string }
        district:  { type: string }
        address:   { type: string }
        lat:       { type: [number, 'null'] }
        lng:       { type: [number, 'null'] }
        fence:
          oneOf:
            - $ref: '#/components/schemas/GeoPolygon'
            - type: 'null'
          description: |
            电子围栏。**为 null 且 `is_default = false` 的门店是一家永远接不到单的店**——
            它不会被任何坐标命中，也不是回落目标。
            这是一个**可达的中间态**：建店不传围栏（`POST /admin/stores`），
            以及把默认位让给别家（`PUT .../default`），都会造出它。
            后台列表应当据此挂「未完成」提示——那个提示是这个状态唯一的出口，
            数据库不挡它（理由见迁移 00020 里 `stores` 的定义）。
        is_default:
          type: boolean
          description: |
            是否是「全国配送」的回落门店。每个商家**至多一个**
            （`uk_stores_default` 部分唯一索引，与 §9 的默认地址同构）。
            改它走 `PUT /admin/stores/{store_id}/default`——
            要在同一个事务里先清旧再置新。
        status:
          type: integer
          enum: [0, 1]
          description: 0 停业 / 1 营业。停业的门店不参与围栏判定，也不能下单。
        deleted_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminStoreList:
      type: object
      description: |
        门店列表。比一般的分页响应多一个 `has_default`——
        它是「没配默认门店的商家，店面对未授权定位的访客全是空的」这条代价
        在契约上的出口（数据模型 §4）。
      required: [page, page_size, total, items, has_default]
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, has_default]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminStore' }
            has_default:
              type: boolean
              description: |
                这家商家有没有默认门店。**必返。**

                为 `false` 时后台首页必须挂提示：此时所有未授权定位的访客
                都会拿到 `match_type = none`（不在服务范围），
                而那看起来像「商品没上架」，和真因毫无关系。

                做成响应字段而不是建店时的强制项，理由是建店与画围栏是
                两个人在两个时刻做的事，强制会把第一步卡死在第二步上。

    StoreCreateRequest:
      type: object
      required: [region_id, code, name]
      description: |
        **围栏不在这里传**，走 `PUT /admin/stores/{store_id}/fence`。
        建店是表单、画围栏是地图，是后台的两个界面。
      properties:
        region_id:
          type: integer
          format: int64
          description: 必填。大区不存在或不属于当前租户时返回 422。
        code:     { type: string, maxLength: 64 }
        name:     { type: string, maxLength: 100 }
        phone:    { type: string, maxLength: 32 }
        province: { type: string, maxLength: 64 }
        city:     { type: string, maxLength: 64 }
        district: { type: string, maxLength: 64 }
        address:  { type: string, maxLength: 200 }
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: 门店自身坐标的纬度，`/stores/resolve` 的 `distance_m` 按它算。
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: 经度。与 `lat` 同时给或同时不给。
        is_default:
          type: boolean
          description: |
            建出来就是默认门店。已经有一家时返回 409——切换默认店请用
            `PUT /admin/stores/{store_id}/default`，那条会先清旧再置新。

    StoreUpdateRequest:
      type: object
      description: |
        只给要改的字段。**改不了两样**：`fence` 走 `PUT .../fence`（要过
        `ST_IsValid`），`is_default` 走 `PUT .../default`（要在同一事务里
        先清旧再置新）。
      properties:
        region_id: { type: integer, format: int64 }
        code:      { type: string, maxLength: 64 }
        name:      { type: string, maxLength: 100 }
        phone:     { type: string, maxLength: 32 }
        province:  { type: string, maxLength: 64 }
        city:      { type: string, maxLength: 64 }
        district:  { type: string, maxLength: 64 }
        address:   { type: string, maxLength: 200 }
        lat:       { type: number, minimum: -90,  maximum: 90 }
        lng:       { type: number, minimum: -180, maximum: 180 }
        status:    { type: integer, enum: [0, 1] }

    StoreFenceRequest:
      type: object
      required: [fence]
      description: 整体替换这家门店的围栏。
      properties:
        fence:
          oneOf:
            - $ref: '#/components/schemas/GeoPolygon'
            - type: 'null'
          description: |
            传 `null` 即清空围栏。**清空只对默认门店合法**——
            给一家非默认门店清空围栏会让它永远接不到单，返回 409
            （`https://keel.dev/problems/store-fence-required`）。

    ScopedProductListing:
      type: object
      description: |
        一件商品在某个作用域（大区或门店）下的可见性与生效价。
        `GET /admin/stores/{store_id}/products` 与
        `GET /admin/regions/{region_id}/products` 共用这一个形状。
      required: [product_id, title, listed, effective_listed, price_source]
      properties:
        product_id: { type: integer, format: int64 }
        title:      { type: string }
        image_url:  { type: string }
        status:
          type: integer
          enum: [0, 1, 2]
          description: 租户级的 `products.status`：0 草稿 / 1 上架 / 2 下架。
        listed:
          type: boolean
          description: |
            **本作用域**有没有把它下架。`true` 表示这一层没有排除它——
            也就是 `store_product_overrides` / `region_product_overrides`
            里**没有**那一行（缺一行即在售，数据模型 §4）。
        effective_listed:
          type: boolean
          description: |
            两层都算完之后买家到底看不看得见。

            **与 `listed` 刻意分开**：一件被大区排掉的商品，门店这一层设成
            `listed = true` 也捞不回来（两层是**与**不是**或**）。
            合成一个字段的话，后台会显示「已上架」而买家看不到，
            而那种不一致没有任何东西会报出来。
        min_price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 本作用域下这件商品各 SKU 生效价的最小值。
        max_price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 最大值。
        price_source:
          type: integer
          enum: [1, 2, 3]
          description: |
            这个价来自哪一层：**1 基准价 / 2 大区价 / 3 门店价**。
            取自 `sku_prices_by_store` 视图——全仓库唯一一处写
            `COALESCE(门店价, 大区价, 基准价)` 的地方（数据模型 §4）。

            一件商品的多个 SKU 可能落在不同层上，此时取**最内的那一层**
            （有任何一个 SKU 用了门店价就是 3）——它回答的是
            「这一行有没有被本地覆盖过」，运营要按它筛。

    ProductListingRequest:
      type: object
      required: [listed]
      description: |
        `listed = false` 写一行排除，`listed = true` 删掉那一行。
        **幂等**：重复设成同一个值不报错。
      properties:
        listed:
          type: boolean
          description: |
            这一层卖不卖它。注意这不保证买家看得见——
            上一层（大区）排掉的，这一层捞不回来，见 `effective_listed`。

    ScopedSkuPrice:
      type: object
      description: 一个 SKU 在某个作用域（大区或门店）下的价格覆盖与生效价。
      required: [sku_id, effective_price_cents, price_source]
      properties:
        sku_id:   { type: integer, format: int64 }
        sku_code: { type: string }
        base_price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '`skus.price_cents`，最外层的基准价。'
        override_price_cents:
          type: [integer, 'null']
          format: int64
          description: |
            **本作用域**自己定的价。为 null 表示这一层没有覆盖，
            沿用上一层——那正是这两张表「缺一行即继承」的语义
            （数据模型 §4）。撤销覆盖走 `DELETE`，不是把它设成 null。
        effective_price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 三层 `COALESCE` 之后真正生效的价。
        price_source:
          type: integer
          enum: [1, 2, 3]
          description: 1 基准价 / 2 大区价 / 3 门店价。

    SkuPriceSetRequest:
      type: object
      required: [price_cents]
      description: |
        设置本作用域的价格覆盖（upsert）。
        **不接受 `null`**——撤销覆盖走 `DELETE`，两个动作的语义不同：
        设成 0 是「这家店免费送」，删掉是「这家店不要自己的价」。
      properties:
        price_cents:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 本作用域的价，单位分，非负。

    OrderStoreSnapshot:
      type: object
      description: |
        下单那一瞬间的门店与大区展示信息，取自 `orders.store_snapshot`。

        **只有展示字段，没有 id。** id 在 `Order.store_id` / `Order.region_id`
        上，是真正的外键列，报表按它们聚合。快照这边刻意不放 id——
        放了就会有人去 `GROUP BY` 一个 JSONB 里的字符串，
        而门店改一次名那张报表就断了（数据模型 §5）。
      required: [store_name]
      properties:
        store_name:   { type: string }
        store_phone:  { type: string }
        store_address: { type: string }
        region_name:  { type: string }

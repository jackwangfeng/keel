# 把仓库里已有的每一道闸门接到 PR 上。
#
# 这些闸门本来就都在：scripts/check-all.sh（六个文档/契约校验 + 契约产物漂移
# 比对 + schema-check）、make test-db、docker compose + scripts/smoke.sh +
# make sdk-smoke。这个文件刻意**不重新实现**其中任何一条，只调用它们。
#
# 理由是「本地绿、CI 红」这类事故的排查成本：闸门一旦有两份实现，每次不一致
# 都要先花时间分辨是代码错了还是两份实现错开了。把判据留在仓库里那一份，
# 贡献者在本地跑的和 CI 跑的就是同一段代码，对不上的时候只有一个嫌疑人。
#
# ## 为什么是一个 job 里的四路，而不是四个 job
#
# 前置条件不相交：gates 只要 Go 工具链 + Node，go 要一个 PostgreSQL，
# e2e 要 Docker，flutter 要 Flutter SDK 与 pub 依赖。曾经拆成四个 job，好让最快的
# 文档闸门不必等最慢的镜像构建。但这台机器只有一个 keel runner，四个 job 实际是排队，
# 2026-10-07 实测墙钟 9 分 50 秒，等于各段相加。scripts/ci_parallel.sh 把这四路
# 放进同一个 job 同时跑，墙钟变成最慢的那一路。哪一路红了，日志按路分开。
#
# （曾经有第五个 job：inference，跑真模型。M4 换引擎之后它没有执行者了，
# 已经删掉 —— 理由与后果见下面「没有覆盖到的」第一条。）
#
# 代价是 Go 模块要各下一遍。可以接受：真正贵的是 docker build，而它只在 e2e 里。
#
# ## 没有覆盖到的（说出来，别让读者以为都盖住了）
#
#   - 多商家形态**跑进 CI 了**（e2e job 倒数第二步），但只验到 HTTP 与租户管理这一层：
#     买家端界面在多家店之间怎么切、`MerchantListView` 那一页在多商家形态下点不点得动，
#     仍然没有自动化。
#     （2026-10-07 之前这一条是「只有人手动验证过」，即 compose.multi.yaml 从 M1
#     起就在仓库里、而自动化一次都没碰过它。）
#   - -race。make test-db 是 `go test -count=1 -timeout=$(TEST_TIMEOUT) ./...`，没有 -race；
#     要加得先决定它属于 Makefile 还是属于这里。
#   - examples/dtmrs-embedded 在自己的 workflow 里（example-dtmrs.yml）。
#     它跑的是那个例子自己的五项验证（TCC、拉取式分支、崩溃恢复…），
#     和服务端要的东西不一样，所以没有并进来。
#   - 买家端的**原生 App 产物**。flutter 这个 job 只编 Web；Android（Gradle 在这台
#     runner 上要另配代理）与 iOS（要 macOS）发版前手动编，见 flutter_app/README.md。
#   - 客户端跑起来之后的行为。flutter 只跑单元与组件测试，不启动浏览器、不打真后端；
#     无头 Web 端到端（make flutter-e2e-web）要真后端与账号，目前人手动跑。
#   - **真引擎（`make test-engine`）在 CI 里没有任何执行者，一个都没有。**
#     这一条从「不挡 PR 的 inference job」退成了「不存在」，因为 M4 把引擎从
#     Python + BGE-M3 换成了自研的 infero，而 infero 只有 CUDA / Metal 后端。
#     原来那个 job 建的是 services/inference（已删），留着必然永远红。
#
#     所以 keel-integration.md 那三条判据（归一化从库里读回来验、语义 margin
#     > 0.10、引擎挂了要报错）现在**只有人手动跑**：
#
#         ./scripts/infero-up.sh
#         KEEL_EMBED_ENDPOINT=http://127.0.0.1:18081 PGHOST=… PGPORT=… make test-engine
#
#     **这一条原本写的是「唯一的路是一台自托管 GPU runner，在那之前这里是空的」。
#     那个前提已经不成立了** —— 全部 job 现在就跑在 lenserver 上，而 lenserver
#     正是那台带 NVIDIA GPU、infero 就在上面跑着的机器。也就是说这不再是
#     「做不到」，是**「还没写」**。两者差别很大，别让这行字继续冒充前者。
#
#     写它的时候有一条约束先记在这里，免得下一个人照着别的 job 的样子起容器：
#     **这个 job 不许自己起 infero**。那块卡（A4000 16G）是三个项目共用的，
#     infero 一份权重约 4.8 GB，实测起第二份直接 CUDA_ERROR_OUT_OF_MEMORY。
#     正确的形状是**连宿主机上已经跑着的那一份**（127.0.0.1:18081），
#     和演示栈的做法一致；起不来就跳过，而不是把线上那份挤掉。
#   - **向量检索这条路的端到端。** e2e 验的是不带引擎的默认栈 —— 那时 smoke 里
#     的检索走的是纯关键词降级路径。「索引任务把真向量写进库、/search 用它召回」
#     这条完整链路在 CI 里同样没有执行者，只有人手动跑过（M4 这一轮真的跑过一次，
#     输出记在那次的交付报告里）。
#   - **「无 GPU 也能跑语义检索」现在成立了，但 CI 里没有验证它。**
#     infero 2026-09-26 起有了 CPU 后端，首版单线程、单条约 5 秒、64 条一批约 4 分钟撑不起
#     查询与索引；infero `cb0ccbd`（2026-09-29）并行化 GEMM / attention 之后，本机 20 核
#     空闲实测单条 117 ms 中位数、64 条一批 2.68 s，三条判据全过（实测见
#     docs/电商系统-总体架构.md §1「那个缺口」）。M3 那个跑 BGE-M3 的 Python 服务已经退役，
#     这个仓库不为「无 GPU 备胎」长期维护第二个推理引擎实现（它退役前有整整
#     一轮既没有调用方也没有测试，那就是维护第二实现的真实成本）——CPU 路走的还是
#     同一个 infero 二进制，只是编译开关不同。**默认的无 GPU 部署仍然是**：不配
#     KEEL_EMBED_ENDPOINT、/search 走 §8 的纯关键词降级链 —— 栈起得来、搜索有结果，
#     只是没有语义召回；CPU 版是可选项，要专门编译、留够核数（见
#     docs/指南/部署与配置.md「没有 GPU」一节），今天这个仓库的 CI 里没有专门验它的 job，
#     是人在本机手动跑 `make test-engine` 验的。
#     这一条与上面那条的关系变了：CI 现在**有** GPU（lenserver），
#     所以「CI 只跑得到降级那一侧」已经不是硬约束，只是 e2e 这个 job 今天
#     刻意只验降级侧 —— 它起的是裸 compose，不连引擎。带引擎那一侧要等
#     上面那个还没写的 job。
#
# ## M2 起 Rust 进了关键路径
#
# 主模块经 cgo 嵌入 dtmrs（internal/dtm），所以 `go build ./...` 需要
# libdtmrs.so。go 与 e2e 两个 job 都要它，gates 不要（它只跑文档校验与契约产物
# 比对，一行主模块代码都不编）。
#
# **「ubuntu-latest 自带 rustup 与 stable 工具链」这条至今没有在真 runner 上
# 验证过。** 上一轮给 example-dtmrs.yml 写这条时就明确标注了，这一轮仍然没有 ——
# 本机验证不了 runner 镜像里装了什么。区别是代价变了：那个 workflow 是路径触发的，
# 这个挡着每一个 PR。所以这里没有沿用「不装 action」的做法去赌，而是
# **显式检查并在缺失时当场失败**，让报错就是真因（见下面「Rust 工具链」那一步）。
# 真到了那一天，修法是在这个文件里加一行 dtolnay/rust-toolchain@stable。
name: CI

# ## 公开仓库 + 自托管 runner（2026-09-30）
#
# 仓库是公开的，而 runner 就是 lenserver（同机跑着演示站、推理引擎、别的项目的库）。两道闸：
#   1. 仓库设置：所有外部贡献者的 PR 都要维护者点「批准运行」（Actions → fork PR approval =
#      all_external_contributors），不是只拦首次贡献者。
#   2. 每个 job 的 `if:`：来自 fork 的 PR 一律不在这台机器上跑（本仓库分支的 PR 与 push 照常）。
#      外部贡献者的改动由维护者拉到本仓库分支后再跑 CI。
on:
  push:
    branches: [main]
  pull_request:
  # 手动触发。没有它，一个还没开 PR 的分支没有任何办法看见 CI 的判断，
  # 而「先跑一遍再开 PR」是这个仓库的习惯。
  workflow_dispatch:

# 只读。这些 job 一个字都不往仓库里写，默认的可写令牌是白给的风险面。
permissions:
  contents: read

# ## 跑在哪
#
# 全部 job 跑在自建 runner 上（lenserver，192.168.0.110，label `keel`）：当初仓库私有，
# GitHub 托管的 runner 按分钟计费，额度用完 job 直接不启动（仓库已公开，fork PR 的防护见文件头）。自建 runner 不计费，
# 但它是一台**长期运行、和别的服务共用**的机器 —— 托管 runner 每次都是新虚拟机，
# 这里不是。所以下面凡是占宿主机端口、起具名容器、建 compose 项目的地方，都满足三条：
#   · 不用宿主机上已被占的端口（5432 有 quant_postgres，8080 有别的服务）；
#   · 名字带 keelci 前缀，和同机的演示环境（COMPOSE_PROJECT_NAME=keeldemo，18099）隔开；
#   · 开始前、结束后都清理（结束后 if: always()），上一次残留不会让下一次重名失败。
# 只有一个 keel runner。四路在同一个 job 里并发，容器名和端口在脚本里就分开了
# （测试库 15432 / keelci-pg，单商家 28180，多商家 29185），不会互相占。
# 29185 不是开发机上那套 keelmulti（28185）：那套可能正开着，CI 不能占它的端口。
# 不同 ref 的两次 CI 仍由下面的 concurrency 排队，所以这些固定名字不会撞车。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只在 PR 上取消。往 PR 连推三次，没必要让三个 e2e 同时建镜像——有意义的
  # 判断只有最后一个 commit 那次。main 上不取消：那里每个 commit 的结论
  # 都要留痕，被取消的那次事后说不清是绿还是红。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, keel]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 下限 22.18（Node 自带类型剥离）。闸门的漂移比对要 npx，sdk-smoke 直接跑 .mts。
          node-version: '24'

      # 四路同时跑：Go 测试、Flutter、文档闸门、端到端。时间账和端口写在脚本文件头。
      - name: 四路并行
        run: bash scripts/ci_parallel.sh

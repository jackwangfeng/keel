# =============================================================================
#  开源电商系统 · OpenAPI 3.1 契约
#
#  设计约定（与数据模型文档一致）：
#   1. 金额一律 integer(int64)，单位「分」，字段名后缀 _cents
#   2. 时间一律 RFC3339 带时区字符串（UTC），字段名后缀 _at
#   3. 不使用 {code,message,data} 信封包装 —— 用 HTTP 状态码表达结果，
#      错误体遵循 RFC 9457 Problem Details。理由：信封包装让所有响应都是
#      200，破坏了 HTTP 语义，也让代码生成出来的客户端必须手写拆包逻辑。
#   4. 订单/支付/退款用不可枚举业务编号（order_no / payment_no / refund_no），
#      其余对象对外用自增 id。越权防护靠服务端按 user_id 强制过滤，
#      不靠编号不可猜 —— 详见数据模型文档 §1
#   5. 写操作幂等：POST 类接口接受 Idempotency-Key 头
# =============================================================================
openapi: 3.1.0
info:
  title: Commerce API
  version: 0.1.0
  description: |
    Open-source commerce platform API.
    AI-native: semantic search & conversational shopping assistant run on
    a self-hosted inference engine — no external API calls, no data egress.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.example.com/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: 认证与令牌签发（含微信小程序 openid 登录）
  - name: User
    description: 用户资料、第三方身份绑定与收货地址簿
  - name: Catalog
    description: 商品与分类
  - name: Search
    description: 语义检索与对话导购
  - name: Cart
  - name: Order
  - name: Payment
  - name: Refund
    description: 退款与售后（买家侧）
  - name: Admin
    description: |
      后台 API（运营 / 客服使用）。与前台 C 端接口分开鉴权与限流，
      在此契约中占位是为了让状态机的每一条边都有明确的触发入口，
      避免实现时各写各的。
  - name: Coupon

# =============================================================================
paths:

  # ---------------------------------------------------------------- Auth
  /auth/wechat/login:
    post:
      tags: [Auth]
      summary: 微信登录（小程序 / 公众号）
      description: |
        小程序 `wx.login` 拿到的 `code` 换 openid / unionid，
        命中 `user_identities(provider, external_id)` 则登录，未命中则
        **首登即注册**（同事务建 `users` + `user_identities`），`is_new_user=true`。

        `external_id`（openid）与 `union_id` 属于渠道敏感标识，**一律不对外返回**。

        边界：小程序先授权、后绑手机号时，可能撞上一个已存在的手机号账号。
        一期不做账号自动合并，直接返回 409 提示用户换绑 —— 见数据模型文档 §8。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 返回的临时登录凭证，一次性
                provider:
                  $ref: '#/components/schemas/IdentityProvider'
                  default: 1
                encrypted_data:
                  type: string
                  description: 可选。getUserProfile 的加密数据，用于同步昵称头像
                iv:
                  type: string
                  description: 与 encrypted_data 配套的初始向量
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: code 无效或已被使用
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            该微信身份关联的手机号已属于另一账号，需用户手动换绑。
            type=https://errors.example.com/identity-conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/sms/code:
    post:
      tags: [Auth]
      summary: 发送短信验证码
      description: 同一手机号与同一 IP 均有频次限制，超限返回 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 国内手机号 }
                scene:
                  type: string
                  enum: [login, bind_phone]
                  default: login
      responses:
        '204': { description: 已发送 }
        '422':
          description: 手机号格式不合法
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            发送过于频繁。type=https://errors.example.com/rate-limited
          headers:
            Retry-After:
              description: 建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: 手机号登录（验证码 / 密码）
      description: |
        `code` 与 `password` 二选一。`users.password_hash` 可空 ——
        仅第三方登录的用户没有密码，只能走验证码，此时传 `password` 返回 401。

        验证码登录且手机号未注册时**首登即注册**，`is_new_user=true`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:    { type: string }
                code:     { type: string, description: 短信验证码 }
                password: { type: string, format: password }
              oneOf:
                - required: [code]
                - required: [password]
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: 验证码错误 / 密码错误 / 该账号未设置密码
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            账号已封禁或已注销（对应 users.status = 2 / 3）。
            type=https://errors.example.com/account-disabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: refresh_token 无效或已过期，需重新登录
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: 服务端吊销当前 refresh_token；access_token 到期自然失效。
      responses:
        '204': { description: No Content }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- User
  /me:
    get:
      tags: [User]
      summary: 当前用户资料
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [User]
      summary: 修改资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nickname:   { type: string, maxLength: 32 }
                avatar_url: { type: string }
                gender:
                  type: integer
                  description: '0 未知 / 1 男 / 2 女'
                  enum: [0, 1, 2]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422':
          description: 字段校验失败（见 Problem.errors）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/identities:
    get:
      tags: [User]
      summary: 已绑定的第三方身份
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserIdentity' }
        default: { $ref: '#/components/responses/Problem' }

  /me/identities/wechat:
    post:
      tags: [User]
      summary: 绑定微信身份
      description: |
        已登录状态下补绑微信。unionid 用于打通小程序 / 公众号 / H5 ——
        同一个人在不同 appid 下 openid 不同，只有 unionid 能认成一个人。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                provider:
                  $ref: '#/components/schemas/IdentityProvider'
                  default: 1
      responses:
        '201':
          description: 绑定成功
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserIdentity' }
        '409':
          description: |
            · 该微信身份已绑定到另一账号（对应 `UNIQUE (provider, external_id)`）——
              type=https://errors.example.com/identity-already-bound
            · 当前账号在该 provider 下已有绑定 ——
              type=https://errors.example.com/identity-duplicate-provider
            · 同一 Idempotency-Key 正在处理中 ——
              type=https://errors.example.com/idempotency-key-in-flight
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /me/identities/{provider}:
    delete:
      tags: [User]
      summary: 解绑第三方身份
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IdentityProvider' }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            解绑后账号将没有任何可登录凭据（既无密码也无其他身份），拒绝解绑。
            type=https://errors.example.com/last-credential
            —— 数据模型文档 §8 说明了这条约束跨表、只能由代码兜。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /me/phone:
    post:
      tags: [User]
      summary: 绑定 / 换绑手机号
      description: 手机号是主登录态。换绑后原号码即可被其他账号注册。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code:  { type: string, description: 新号码收到的短信验证码 }
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: 验证码错误或已过期
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            · 该手机号已被其他账号占用（对应 `uk_users_phone` 部分唯一索引）——
              type=https://errors.example.com/phone-already-taken
            · 同一 Idempotency-Key 正在处理中 ——
              type=https://errors.example.com/idempotency-key-in-flight
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Address
  /addresses:
    get:
      tags: [User]
      summary: 地址簿
      description: 默认地址排在首位，其余按更新时间倒序。已软删的地址不返回。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [User]
      summary: 新增地址
      description: |
        `is_default=true` 时服务端在同一事务里先清旧默认、再置新，
        与「每用户至多一个默认地址」的部分唯一索引保持一致。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: 已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '409': { $ref: '#/components/responses/IdempotencyInFlight' }
        '422':
          description: |
            字段校验失败（见 Problem.errors），或同一 Idempotency-Key 配了不同请求体
            （type=https://errors.example.com/idempotency-key-reused）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /addresses/{address_id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    get:
      tags: [User]
      summary: 地址详情
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [User]
      summary: 修改地址
      description: |
        整体替换。**不要用本接口把 `is_default` 从 false 改成 true** ——
        切换默认地址请用 `PUT /addresses/{address_id}/default`，理由见该接口说明。
        本接口收到 `is_default=true` 且当前不是默认地址时返回 422。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: |
            字段校验失败，或试图通过本接口切换默认地址
            （type=https://errors.example.com/use-default-endpoint）。
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [User]
      summary: 删除地址
      description: |
        软删（写 `deleted_at`）。地址与订单是快照关系而非外键，
        删除不影响任何历史订单的收货信息。
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /addresses/{address_id}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [User]
      summary: 设为默认地址
      description: |
        **互斥切换**：服务端在同一事务里「先清旧默认、再置新」。

        之所以做成专用接口而不是让客户端 PUT `is_default=true`：
        数据库上有「每用户至多一个默认地址」的部分唯一索引
        （`user_addresses(user_id) WHERE is_default AND deleted_at IS NULL`），
        由客户端自己保证唯一性时，并发点两下会直接撞唯一冲突报 500。
        把切换动作收进一个接口，唯一性由服务端事务负责。

        幂等：对已是默认的地址重复调用返回 200，不报错。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Catalog
  /products:
    get:
      tags: [Catalog]
      summary: 商品列表
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category_id
          in: query
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          description: 排序字段
          schema:
            type: string
            enum: [default, price_asc, price_desc, sales_desc, newest]
            default: default
        - name: min_price_cents
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: max_price_cents
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }
        default: { $ref: '#/components/responses/Problem' }

  /products/{product_id}:
    get:
      tags: [Catalog]
      summary: 商品详情（含全部 SKU）
      security: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /categories:
    get:
      tags: [Catalog]
      summary: 分类树
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  # ---------------------------------------------------------------- Search
  /search:
    post:
      tags: [Search]
      summary: 语义 + 关键词混合检索
      description: |
        四层流水线：双路召回 → RRF 融合 → Reranker 精排 → 业务重排。
        业务重排会将缺货、活动失效、负毛利商品降权 —— 这是与通用向量检索的核心区别。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 200 }
                filters:
                  $ref: '#/components/schemas/SearchFilters'
                size: { type: integer, default: 20, maximum: 100 }
                strategy:
                  type: string
                  default: default
                  description: |
                    排序策略标识，用于 A/B 对比。记入检索日志后可按策略分组
                    对比 NDCG@10 / CTR@10 等在线指标。省略则用默认策略。
                    一期不做完整分流，但接口层先留出这个参数 ——
                    否则后续每次改排序都是不可逆的「拍脑袋上线」
                    （语义检索层设计 §9.3）。
                explain:
                  type: boolean
                  default: false
                  description: 返回各阶段得分，用于调试与效果评估
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, latency_ms, strategy]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
                  latency_ms: { type: integer }
                  strategy:
                    type: string
                    description: |
                      本次实际生效的策略标识（回显）。服务端做分流时，
                      客户端必须知道自己落到了哪一桶，否则埋点对不上。
                  trace_id: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /assistant/chat:
    post:
      tags: [Search]
      summary: 对话式导购
      description: |
        **设计原则：LLM 只做意图理解与话术生成，绝不生成商品。**
        返回的商品一定来自真实检索结果。

        写操作（退款/改地址/取消订单）**不在此接口执行**，
        而是返回 `action` 字段，由前端跳转到对应表单并预填参数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 500 }
                session_id:
                  type: string
                  description: 省略则新建会话
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------- Cart
  /cart:
    get:
      tags: [Cart]
      summary: 购物车
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      summary: 清空购物车
      responses:
        '204': { description: No Content }

  /cart/items:
    post:
      tags: [Cart]
      summary: 加入购物车
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_id, quantity]
              properties:
                sku_id: { type: integer, format: int64 }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: 库存不足
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cart/selection:
    put:
      tags: [Cart]
      summary: 批量勾选 / 取消勾选
      description: |
        `item_ids` 省略即对全车生效（全选 / 全不选）。
        有了这个接口，20 条的购物车做一次「全选」是 1 个请求而不是 20 个。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected: { type: boolean }
                item_ids:
                  type: array
                  description: 省略则作用于全部条目
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: item_ids 中存在不属于当前用户购物车的条目
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /cart/items/{item_id}:
    patch:
      tags: [Cart]
      summary: 修改数量 / 勾选状态
      description: |
        `quantity` 与 `selected` 都可选，但至少传一个。
        勾选态存在服务端（`cart_items.selected`），换设备打开购物车不会丢。
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                quantity: { type: integer, minimum: 1, maximum: 999 }
                selected: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: 库存不足
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: 请求体为空（quantity / selected 至少传一个）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Cart]
      summary: 删除条目
      parameters:
        - name: item_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: No Content }

  # ---------------------------------------------------------------- Order
  /orders/preview:
    post:
      tags: [Order]
      summary: 下单预览（试算金额与可用券）
      description: |
        **不产生副作用**。返回试算后的金额明细与优惠分摊结果。
        前端据此展示「应付金额」，用户确认后再调 `POST /orders`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPreview' }

  /orders:
    post:
      tags: [Order]
      summary: 创建订单
      description: |
        触发 SAGA 全局事务（gid = `order-{order_no}`），三个分支：

        | 分支 | 正向 | 补偿 |
        |---|---|---|
        | 库存 | available_qty -= n | available_qty += n |
        | 优惠券 | status 1 → 3 已使用 | status 3 → 1 |
        | 订单 | 建单 status=10 | status → 90 |

        **必须携带 `Idempotency-Key`**：同一 key 重复调用返回首次的存档响应，
        防止用户连点或网络重试造成重复下单。重放命中时响应带
        `Idempotency-Replayed: true`，客户端据此区分「我真的下了单」
        与「这是上次那单」——影响埋点与提示文案。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: |
            订单创建成功。幂等重放命中成功记录时，同样返回 201 与首次的响应体，
            并带 `Idempotency-Replayed: true`。
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: |
            业务冲突，按 Problem `type` 区分：
            · 库存不足 —— .../insufficient-stock
            · 券不可用 —— .../coupon-not-applicable
            · 价格已变动（与 expected_payable_cents 不一致）—— .../price-changed
            · **同一 Idempotency-Key 正在处理中** —— .../idempotency-key-in-flight，
              响应带 `Retry-After`，客户端应退避重试而不是当成业务失败弹窗
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Order]
      summary: 我的订单列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }

  /orders/{order_no}:
    get:
      tags: [Order]
      summary: 订单详情
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{order_no}/cancel:
    post:
      tags: [Order]
      summary: 取消订单
      description: 仅 status=10（待支付）可取消。触发 SAGA 回滚库存与优惠券。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: |
            · 当前状态不允许取消 —— .../order-status-not-cancelable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{order_no}/confirm:
    post:
      tags: [Order]
      summary: 确认收货
      description: |
        履约维度 `30 已发货 → 40 已完成`，对应 `order_status_transitions` 的 `(30,40)`。

        **部分退款进行中（`refund_status = 1`）不阻断确认收货** ——
        这是两个维度正交的直接体现：`status` 说货到哪儿了，
        `refund_status` 说钱退了多少，货已签收与钱还在退不矛盾。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许确认收货（仅 status=30 可调）——
              type=https://errors.example.com/order-status-not-confirmable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /orders/{order_no}/refunds:
    post:
      tags: [Refund]
      summary: 申请退款（支持部分退）
      description: |
        按 `order_items.discount_cents` 的分摊结果倒算实退金额，**客户端不传金额**：
        单件实退 = `(amount_cents - discount_cents) × 退货件数 / quantity`，
        退到最后一件时把余数一并退干净，保证
        `SUM(refund_items.amount_cents) = 该行实付净额` 恒等。
        客户端只有拿到服务端算好的数，确认页展示的「预计退款」才不会和实际到账对不上。

        退款单创建后进入 `10 待审核`，后续流转见 `RefundStatus`。
        退款本身用 SAGA 编排：渠道退款、库存回补、订单金额回写三个分支，
        其中渠道退款分支没有补偿（钱退出去收不回来），必须排在最后一个正向分支。

        **运费**：未发货整单退全退运费；部分退款不退运费（运费按整单算，
        没有可分摊的口径）；退货退款的运费责任由客服在审核时裁定。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreateRequest' }
      responses:
        '201':
          description: 退款申请已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404':
          description: |
            订单不存在或不属于当前用户。
            type=https://errors.example.com/order-not-found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            按 Problem `type` 区分，客户端据此给出不同文案：
            · 退款件数超过 `quantity - refunded_qty`（含进行中退款单的占用）——
              .../refund-quantity-exceeded
            · 订单状态不允许申请（如 `10 待支付` / `90 已关闭`，或订单未支付）——
              .../order-status-not-refundable
            · 该 `order_item_id` 已在一张进行中的退款单里 ——
              .../refund-already-in-progress
              （`UNIQUE (refund_id, order_item_id)` 只保证单张单内不重复，
               跨单重复必须业务层拦）
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · `order_item_id` 不属于该订单 —— .../order-item-mismatch
            · 字段校验失败（见 Problem.errors）
            · 同一 Idempotency-Key 配了不同请求体 —— .../idempotency-key-reused
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [Refund]
      summary: 订单的退款单列表
      description: 一个订单可以有多张退款单（不同批次、不同明细），按创建时间倒序。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds:
    get:
      tags: [Refund]
      summary: 我的退款单列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Refund' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds/{refund_no}:
    get:
      tags: [Refund]
      summary: 退款单详情（含明细）
      parameters:
        - $ref: '#/components/parameters/RefundNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds/{refund_no}/cancel:
    post:
      tags: [Refund]
      summary: 撤回退款申请
      description: |
        用户主动撤回，退款单进入 `60 已取消`。
        对应 `refund_status_transitions` 的 `(10,60)` 与 `(20,60)` ——
        仅 `10 待审核` 与 `20 待买家退货` 可撤回；
        一旦进入 `30 退款中`，钱已在渠道路上，撤不回来。
      parameters:
        - $ref: '#/components/parameters/RefundNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许撤回 —— .../refund-status-not-cancelable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /refunds/{refund_no}/audit:
    post:
      tags: [Admin, Refund]
      summary: 审核退款单（后台 API）
      description: |
        **后台 API**，由运营 / 客服调用，鉴权与前台分开。在此契约中定义，
        是因为 `50 已拒绝` 与 `20 待买家退货` 两个态只能由审核动作到达 ——
        留空白的后果是实现时各写各的。

        · `approve` + 仅退款（`refund_type=1`）→ `10 → 30 退款中`
        · `approve` + 退货退款（`refund_type=2`）→ `10 → 20 待买家退货`
        · `reject` → `10 → 50 已拒绝`，必须带 `reject_reason`

        整单退款被驳回时，订单履约状态从 `50 退款中` 回到 `20 已支付`
        （对应 `order_status_transitions` 的 `(50,20)`）。

        `freight_cents` 是退货退款场景下客服裁定的退运费金额 ——
        一期没有可自动判定的口径，故开放给审核人填写。
      parameters:
        - $ref: '#/components/parameters/RefundNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                reject_reason:
                  type: string
                  maxLength: 200
                  description: action=reject 时必填
                freight_cents:
                  $ref: '#/components/schemas/Money'
                  description: 审核裁定的退运费金额，省略则为 0
      responses:
        '200':
          description: OK
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 当前状态不允许审核（仅 `10 待审核` 可审）——
              .../refund-status-not-auditable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            · action=reject 但未填 `reject_reason`
            · 退运费超过订单实收运费 —— .../refund-freight-exceeded
            · 同一 Idempotency-Key 配了不同请求体 —— .../idempotency-key-reused
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /webhooks/refunds/{channel}:
    post:
      tags: [Refund]
      summary: 退款渠道异步回调
      description: |
        渠道推送退款结果，退款单 `30 退款中 → 40 已退款`，
        并在同一事务里回写 `order_items.refunded_qty` / `refunded_cents`、
        累加 `orders.refunded_cents`、重算 `orders.refund_status`。

        **幂等由 `(channel, channel_refund_id)` 唯一索引兜底** ——
        与支付回调的 `(channel, channel_txn_id)` 完全同构：重复推送时
        第二次写入撞唯一冲突，直接返回 200。这个接口是
        `refunds.channel_refund_id` 的**唯一写入路径**。

        退款回调的重复率比支付回调只高不低 —— 退款到账往往延迟数小时，
        渠道会反复推，所以这条幂等路径必须一次做对。

        注意 `30 退款中` **没有通向失败态的边**：渠道调用失败是重试，不是终态。
        因此本接口不接受「退款失败」的终局语义，失败只体现为「还没退到」。

        签名验证失败返回 401，且不得泄露任何内部状态。
      security: []
      parameters:
        - name: channel
          in: path
          required: true
          description: |
            余额退款不产生渠道回调，故此处没有 balance。
          schema:
            type: string
            enum: [wechat, alipay]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: 已受理（无论首次还是重复）
        '401':
          description: 签名验证失败

  # ---------------------------------------------------------------- Payment
  /orders/{order_no}/payments:
    post:
      tags: [Payment]
      summary: 发起支付
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [wechat, alipay, balance]
      responses:
        '201':
          description: 支付单已创建
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            · 订单当前状态不允许支付（非 `10 待支付`，或已超时关闭）——
              .../order-status-not-payable
            · 同一 Idempotency-Key 正在处理中 —— .../idempotency-key-in-flight
          headers:
            Retry-After:
              description: 仅幂等键处理中时返回，建议退避秒数
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/IdempotencyKeyReused' }
        default: { $ref: '#/components/responses/Problem' }

  /webhooks/payments/{channel}:
    post:
      tags: [Payment]
      summary: 支付渠道异步回调
      description: |
        **幂等由 `(channel, channel_txn_id)` 唯一索引兜底** ——
        重复回调时写入冲突，直接返回 200。

        触发二阶段消息：订单状态 `10 → 20` · 支付单落库 · 积分发放 · 触发履约。

        库存与优惠券在下单的 SAGA 正向阶段就已完成扣减与核销，此处**无动作** ——
        这正是 SAGA 相比 TCC 少一半方法数的体现（Confirm 是 TCC 的词，
        本系统下单链路没有这一步）。

        签名验证失败返回 401，且不得泄露任何内部状态。
      security: []
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [wechat, alipay]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: 已受理（无论首次还是重复）
        '401':
          description: 签名验证失败

  # ---------------------------------------------------------------- Coupon
  /coupons:
    get:
      tags: [Coupon]
      summary: 我的优惠券
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [available, used, expired] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserCoupon' }

  /coupons/applicable:
    post:
      tags: [Coupon]
      summary: 查询本单可用券
      description: 传入拟购商品，返回可用券及各自能减多少，按优惠额降序。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/OrderItemInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/UserCoupon'
                    - type: object
                      properties:
                        discount_cents:
                          type: integer
                          format: int64
                          description: 该券用于本单可减金额

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    OrderNo:
      name: order_no
      in: path
      required: true
      schema: { type: string }
    RefundNo:
      name: refund_no
      in: path
      required: true
      description: 退款单对外编号，不可枚举
      schema: { type: string }
    AddressId:
      name: address_id
      in: path
      required: true
      description: |
        `user_addresses.id`。按约定 4，地址用自增 id 对外，
        越权由服务端按 `user_id` 强制过滤 —— 查不到当前用户名下的该 id 即 404。
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        客户端生成的 UUID。幂等作用域为 `(接口 scope, user_id, key)`，
        有效期 24h，过期后同一 key 可复用（见数据模型文档 §11）。

        · **重放命中成功记录**：返回首次的存档响应（状态码与响应体都是存档的那一份），
          并带 `Idempotency-Replayed: true` 响应头
        · **同 key 正在处理中**：`409` + `Retry-After`，
          type=https://errors.example.com/idempotency-key-in-flight，
          客户端应退避重试，不要当成业务失败
        · **同 key 但请求体不同**（`request_hash` 不一致）：`422`，
          type=https://errors.example.com/idempotency-key-reused。
          宁可显式失败，也不把不同的请求当成重放静默吞掉 ——
          那会让用户以为下单成功了而实际什么都没发生
        · 首次执行失败（存档为失败态）时同样回放该失败响应；
          确需重试的场景请换一个新 key
      schema: { type: string, format: uuid }

  headers:
    IdempotencyReplayed:
      description: |
        `true` 表示本次响应是幂等重放 —— 返回的是首次请求的存档响应，
        本次调用**没有真正执行**任何业务动作。首次执行时不返回该头或为 `false`。
        客户端据此区分「我真的下了单」与「这是上次那单」。
      schema: { type: boolean }

  responses:
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    IdempotencyInFlight:
      description: |
        同一 Idempotency-Key 正在处理中（另一并发请求已抢占）。
        type=https://errors.example.com/idempotency-key-in-flight。
        客户端应按 `Retry-After` 退避重试，而不是当成业务失败弹窗。
      headers:
        Retry-After:
          description: 建议退避秒数
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    IdempotencyKeyReused:
      description: |
        同一 Idempotency-Key 配了不同的请求体（`request_hash` 不一致），拒绝执行。
        type=https://errors.example.com/idempotency-key-reused。
        见数据模型文档 §11：这类失败必须显式，不能被当成重放静默吞掉。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ---- 通用 ----
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:   { type: string, format: uri, examples: ['https://errors.example.com/insufficient-stock'] }
        title:  { type: string, examples: ['Insufficient stock'] }
        status: { type: integer, examples: [409] }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          description: 字段级校验错误
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:      { type: integer }
        page_size: { type: integer }
        total:     { type: integer }

    Money:
      type: integer
      format: int64
      description: 金额，单位「分」。禁止使用浮点。

    # ---- 商品 ----
    Category:
      type: object
      required: [id, name, level]
      properties:
        id:       { type: integer, format: int64 }
        name:     { type: string }
        level:    { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    ProductSummary:
      type: object
      required: [id, title, min_price_cents, status]
      properties:
        id:        { type: integer, format: int64 }
        title:     { type: string }
        subtitle:  { type: string }
        image_url: { type: string }
        min_price_cents: { $ref: '#/components/schemas/Money' }
        max_price_cents: { $ref: '#/components/schemas/Money' }
        in_stock:  { type: boolean }
        sales_count: { type: integer }
        status:
          type: integer
          description: |
            对应 `products.status`：0 草稿 / 1 上架 / 2 下架。
            前台列表与检索只返回 `1`；订单、购物车里引用的历史商品可能是 `2`，
            客户端据此展示「已下架」而不是让用户点进去才发现买不了。
          enum: [0, 1, 2]

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [skus]
          properties:
            description: { type: string }
            category_id: { type: integer, format: int64 }
            images:
              type: array
              items: { type: string }
            skus:
              type: array
              items: { $ref: '#/components/schemas/Sku' }

    Sku:
      type: object
      required: [id, sku_code, price_cents, available_qty]
      properties:
        id:          { type: integer, format: int64 }
        sku_code:    { type: string }
        spec_values:
          type: object
          additionalProperties: { type: string }
          examples: [{ "颜色": "黑", "尺码": "XL" }]
        price_cents:   { $ref: '#/components/schemas/Money' }
        available_qty: { type: integer }
        image_url:     { type: string }

    # ---- 检索 ----
    SearchFilters:
      type: object
      properties:
        category_id: { type: integer, format: int64 }
        min_price_cents: { $ref: '#/components/schemas/Money' }
        max_price_cents: { $ref: '#/components/schemas/Money' }
        in_stock_only: { type: boolean, default: true }

    SearchHit:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            scores:
              type: object
              description: explain=true 时返回，用于效果调优
              properties:
                vector:   { type: number }
                keyword:  { type: number }
                rrf:      { type: number }
                rerank:   { type: number }
                business: { type: number }
                final:    { type: number }

    ChatReply:
      type: object
      required: [session_id, reply]
      properties:
        session_id: { type: string }
        reply:
          type: string
          description: 面向用户的自然语言回复
        products:
          type: array
          description: 真实检索结果，非模型生成
          items: { $ref: '#/components/schemas/ProductSummary' }
        intent:
          type: object
          description: 解析出的结构化意图
          additionalProperties: true
          examples: [{ "scene": "birthday_gift", "recipient": "mother", "budget_max_cents": 30000 }]
        action:
          type: object
          description: |
            写操作路由指令。前端据此跳转到对应表单并预填参数，
            **服务端不执行任何写操作**。
          properties:
            type:
              type: string
              enum: [navigate_refund, navigate_address, navigate_order, navigate_cancel]
            params:
              type: object
              additionalProperties: true

    # ---- 购物车 ----
    Cart:
      type: object
      required: [items, total_cents]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        total_cents: { $ref: '#/components/schemas/Money' }

    CartItem:
      type: object
      required: [id, sku_id, quantity, price_cents, selected]
      properties:
        id:        { type: integer, format: int64 }
        sku_id:    { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        title:     { type: string }
        spec_values:
          type: object
          additionalProperties: { type: string }
        image_url: { type: string }
        price_cents: { $ref: '#/components/schemas/Money' }
        quantity:  { type: integer }
        selected:
          type: boolean
          default: true
          description: |
            是否勾选结算，对应 `cart_items.selected`。
            勾选态存在服务端，换设备打开购物车不会丢。
        available: { type: boolean, description: 库存是否充足 }

    # ---- 订单 ----
    OrderStatus:
      type: integer
      description: |
        **履约维度** —— 货走到哪儿了。资金维度另见 `Order.refund_status`。

        10 待支付 / 20 已支付 / 30 已发货 / 40 已完成
        50 退款中 / 60 已退款 —— **仅用于未发货的整单退款**
        90 已关闭

        `50` / `60` 不表达部分退款：用户买三件退一件，订单**不会**变成
        `50 退款中`，`status` 保持不变继续走履约（已发货的照发），
        售后进度看 `Order.refund_status`。若按「用户一申请退款就把订单置 50」
        来实现，「部分退款后订单还能不能确认收货」这个问题会直接无解。

        合法迁移（`order_status_transitions`）：
        `(10,20) (10,90) (20,30) (20,50) (30,40) (50,60) (50,20)`。
        没有 `(30,50)` —— 已发货订单的退款走资金维度，
        履约进度不该被售后流程抹掉。
      enum: [10, 20, 30, 40, 50, 60, 90]

    OrderRefundStatus:
      type: integer
      description: |
        **资金维度** —— 钱退了多少，与 `status` 正交，由退款单驱动。

        0 无退款 / 1 退款中 / 2 部分退款完成 / 3 全额退款完成

        「全额退款」是**资金口径**：退到 `refunded_cents = paid_cents` 才是 `3`，
        只退货款不退运费的是 `2`。`2` 与 `1` 之间可以来回（退完一笔又申请下一笔）。

        | 场景 | `status` | `refund_status` |
        |---|---|---|
        | 未发货整单退 | `20 → 50 → 60` | `0 → 1 → 3` |
        | 买三退一（已发货） | 不变，继续 `30 → 40` | `0 → 1 → 2` |
        | 已完成后全部退回 | 停在 `40 已完成` | `1 → 3` |
        | 退款被驳回 | 未发货的从 `50` 回 `20`；已发货的本就没动过 | 回到 `0` 或 `2` |

        订单列表的售后标签必须由这两列**组合**渲染，不能只看 `status`。
      enum: [0, 1, 2, 3]
      default: 0

    OrderItemInput:
      type: object
      required: [sku_id, quantity]
      properties:
        sku_id:   { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }

    OrderCreateRequest:
      type: object
      required: [items, address_id]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
        address_id:     { type: integer, format: int64 }
        user_coupon_id:
          type: integer
          format: int64
          description: 第一期仅支持单张券
        remark: { type: string, maxLength: 200 }
        expected_payable_cents:
          $ref: '#/components/schemas/Money'
          description: |
            前端展示的应付金额。服务端试算不一致时返回 409，
            防止价格变动导致用户以旧价成交。

    OrderPreview:
      type: object
      required: [goods_amount_cents, payable_cents, items]
      properties:
        goods_amount_cents: { $ref: '#/components/schemas/Money' }
        freight_cents:      { $ref: '#/components/schemas/Money' }
        discount_cents:     { $ref: '#/components/schemas/Money' }
        payable_cents:      { $ref: '#/components/schemas/Money' }
        items:
          type: array
          description: 含优惠分摊结果
          items:
            type: object
            properties:
              sku_id:         { type: integer, format: int64 }
              quantity:       { type: integer }
              amount_cents:   { $ref: '#/components/schemas/Money' }
              discount_cents:
                $ref: '#/components/schemas/Money'
                description: 该行分摊到的优惠。余数归金额最大行，保证求和恒等。
        applicable_coupons:
          type: array
          items: { $ref: '#/components/schemas/UserCoupon' }

    Order:
      type: object
      required: [order_no, status, refund_status, payable_cents, created_at]
      properties:
        order_no: { type: string }
        status:   { $ref: '#/components/schemas/OrderStatus' }
        refund_status:
          $ref: '#/components/schemas/OrderRefundStatus'
          description: |
            售后状态，与 status 正交，必返字段（DB 上是 `NOT NULL DEFAULT 0`）。
            没有它，「买 3 件退 1 件的已发货订单」和「完全没有售后的订单」
            在响应里一模一样 —— `refunded_cents` 在退款到账前是 0，
            区分不出「退款中」与「没退款」。
        goods_amount_cents: { $ref: '#/components/schemas/Money' }
        freight_cents:      { $ref: '#/components/schemas/Money' }
        discount_cents:     { $ref: '#/components/schemas/Money' }
        payable_cents:      { $ref: '#/components/schemas/Money' }
        paid_cents:         { $ref: '#/components/schemas/Money' }
        refunded_cents:     { $ref: '#/components/schemas/Money' }
        expire_at:  { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        paid_at:    { type: string, format: date-time }

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            receiver:
              type: object
              description: 下单时的收货信息快照
              additionalProperties: true
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderItem' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/PaymentRecord' }

    OrderItem:
      type: object
      required: [id, sku_id, title, price_cents, quantity]
      properties:
        id:         { type: integer, format: int64 }
        sku_id:     { type: integer, format: int64 }
        product_id: { type: integer, format: int64 }
        title:      { type: string, description: 下单时快照 }
        spec_values:
          type: object
          additionalProperties: { type: string }
        image_url:      { type: string }
        price_cents:    { $ref: '#/components/schemas/Money' }
        quantity:       { type: integer }
        amount_cents:   { $ref: '#/components/schemas/Money' }
        discount_cents: { $ref: '#/components/schemas/Money' }
        refunded_qty:   { type: integer }

    # ---- 支付与退款 ----
    PaymentIntent:
      type: object
      required: [payment_no, channel, amount_cents]
      properties:
        payment_no:   { type: string }
        channel:      { type: string }
        amount_cents: { $ref: '#/components/schemas/Money' }
        payload:
          type: object
          description: 渠道特定的调起参数（如微信 JSAPI 的 prepay 参数）
          additionalProperties: true

    PaymentRecord:
      type: object
      properties:
        payment_no: { type: string }
        channel:    { type: string }
        amount_cents: { $ref: '#/components/schemas/Money' }
        status:     { type: integer, description: '0待支付 1成功 2失败 3已关闭' }
        paid_at:    { type: string, format: date-time }

    RefundStatus:
      type: integer
      description: |
        退款单状态机，与 `refunds.status` 的 SMALLINT 取值逐值一致。

        10 待审核 / 20 待买家退货 / 30 退款中 / 40 已退款
        50 已拒绝 / 60 已取消

        ```
        10 待审核 ─通过(退货退款)─► 20 待买家退货 ─商家收货─► 30 退款中 ─渠道成功─► 40 已退款
           │                                                   ▲
           ├─通过(仅退款)───────────────────────────────────────┘
           │
           ├─驳回──► 50 已拒绝
           └─撤销──► 60 已取消   （20 超时未寄回 / 买家撤销，同样进 60）
        ```

        合法迁移（`refund_status_transitions`）：
        `(10,20) (10,30) (10,50) (10,60) (20,30) (20,60) (30,40)`。

        `50 已拒绝` 与 `30 退款中` 失败**不是一回事**，客户端要分开展示：
        前者是商家驳回，要展示 `reject_reason` 并允许重新申请；
        后者只是「还没退到」—— `30` 没有通向失败态的边，渠道调用失败是重试而非终态，
        钱不会凭空消失，最终要么成功要么人工介入。
      enum: [10, 20, 30, 40, 50, 60]

    RefundType:
      type: integer
      description: |
        1 仅退款 / 2 退货退款。对应 `refunds.refund_type`。
        退货退款要展示寄回地址与物流填写入口，仅退款不要 ——
        已发货但用户还没收到货时两种都合法，只有用户能决定，
        所以必须由客户端显式传入，不能让服务端按订单状态猜。
      enum: [1, 2]

    RefundReasonCode:
      type: integer
      description: |
        对应 `refunds.reason_code`：
        1 不想要了 / 2 少发漏发 / 3 商品损坏 / 4 描述不符 / 5 其他
      enum: [1, 2, 3, 4, 5]

    RefundItemInput:
      type: object
      required: [order_item_id, quantity]
      properties:
        order_item_id:
          type: integer
          format: int64
          description: |
            必须属于该订单。服务端强制校验「该 item 属于该 order
            且该 order 属于当前 user」，不信任前端传入的 ID。
        quantity: { type: integer, minimum: 1 }

    RefundItem:
      type: object
      required: [order_item_id, quantity, amount_cents]
      properties:
        order_item_id: { type: integer, format: int64 }
        title:         { type: string, description: 下单时的商品标题快照 }
        image_url:     { type: string }
        quantity:      { type: integer, minimum: 1 }
        amount_cents:
          $ref: '#/components/schemas/Money'
          description: |
            该行实退金额，**由服务端算完回传，不接受客户端传入**。
            未退完时 = `floor(net × 退货件数 / quantity)`，其中
            `net = item.amount_cents - item.discount_cents`；
            退到最后一件时 = `net - 已退金额`（把余数退干净），
            保证 `SUM(amount_cents) = net` 恒等。
            余数规则与订单优惠分摊一致 —— 否则用户会遇到「我退完了，钱没退全」。

    RefundCreateRequest:
      type: object
      required: [items, refund_type, reason_code]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RefundItemInput' }
        refund_type: { $ref: '#/components/schemas/RefundType' }
        reason_code: { $ref: '#/components/schemas/RefundReasonCode' }
        reason_text:
          type: string
          maxLength: 200
          description: 补充说明。reason_code=5（其他）时建议必填
        evidence_urls:
          type: array
          maxItems: 9
          description: 凭证图片，先走上传接口拿到 URL
          items: { type: string }

    Refund:
      type: object
      required: [refund_no, order_no, status, refund_type, amount_cents, items, created_at]
      properties:
        refund_no:  { type: string, description: 对外编号，不可枚举 }
        order_no:   { type: string }
        payment_no:
          type: string
          description: |
            原路退回的落点 —— 退的是哪一笔支付。一个订单可能有多次支付尝试，
            客户端据此显示「退回到微信 xxxx」。对应 `refunds.payment_id`。
        refund_type: { $ref: '#/components/schemas/RefundType' }
        status:      { $ref: '#/components/schemas/RefundStatus' }
        items:
          type: array
          description: |
            退款明细，对应 `refund_items`。申请时按明细提交了，查询时就要能拿回来，
            否则用户点开退款详情看不到「退了哪一件、退了几件」。
          items: { $ref: '#/components/schemas/RefundItem' }
        goods_amount_cents:
          $ref: '#/components/schemas/Money'
          description: 退的货款，已按订单优惠分摊倒算
        freight_cents:
          $ref: '#/components/schemas/Money'
          description: |
            退的运费。未发货整单退全退；部分退款不退运费
            （运费按整单算，没有可分摊的口径）；退货退款由客服审核时裁定。
        amount_cents:
          $ref: '#/components/schemas/Money'
          description: 实退总额 = goods_amount_cents + freight_cents
        channel:
          type: string
          enum: [wechat, alipay, balance]
          description: |
            退款渠道，冗余自原支付单（对账按渠道跑）。
            对外字符串 ↔ `refunds.channel`：wechat=1 / alipay=2 / balance=3。
        channel_refund_id:
          type: string
          description: |
            渠道退款流水号，由退款回调写入。用户报障与客服对账要这个号。
            `UNIQUE (channel, channel_refund_id)` 是退款回调幂等的最后一道锁。
        reason_code: { $ref: '#/components/schemas/RefundReasonCode' }
        reason_text: { type: string }
        evidence_urls:
          type: array
          items: { type: string }
        reject_reason:
          type: string
          description: |
            审核驳回理由，`status=50 已拒绝` 时返回。
            没有这个字段，被驳回的用户只能看到一句「已拒绝」，
            既不知道为什么，也不知道改什么再申请。
        audited_at:   { type: string, format: date-time, description: 审核时间 }
        refunded_at:  { type: string, format: date-time, description: 到账时间 }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    # ---- 用户与地址 ----
    IdentityProvider:
      type: integer
      description: |
        第三方身份来源，对应 `user_identities.provider`：
        1 微信小程序 / 2 微信公众号 / 3 微信开放平台 / 4 支付宝 / 5 Apple

        微信 openid 按 appid 隔离 —— 同一个人在小程序、公众号、App 里
        拿到三个不同的 openid，只有 unionid 能认成一个人，所以身份是多条而非一列。
      enum: [1, 2, 3, 4, 5]

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:  { type: string, description: 'JWT，放进 Authorization: Bearer 头' }
        refresh_token: { type: string }
        token_type:    { type: string, enum: [Bearer], default: Bearer }
        expires_in:    { type: integer, description: access_token 有效期，单位秒 }
        user:          { $ref: '#/components/schemas/User' }
        is_new_user:
          type: boolean
          default: false
          description: 首登即注册时为 true，供前端引导补全资料

    User:
      type: object
      required: [id, nickname]
      properties:
        id:      { type: integer, format: int64 }
        nickname:   { type: string }
        avatar_url: { type: string }
        phone:
          type: string
          description: 脱敏返回，如 138****8000。完整号码只在绑定流程中由用户自己输入
          examples: ['138****8000']
        gender:
          type: integer
          description: '0 未知 / 1 男 / 2 女'
          enum: [0, 1, 2]
        has_password:
          type: boolean
          description: |
            `users.password_hash` 可空 —— 仅第三方登录的用户没有密码。
            前端据此决定是否显示「设置密码」入口，而不是显示「修改密码」。
        created_at:    { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    UserIdentity:
      type: object
      required: [id, provider, created_at]
      properties:
        id:       { type: integer, format: int64 }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        has_union_id:
          type: boolean
          description: 是否已取到 unionid（能否跨应用打通）
        created_at: { type: string, format: date-time, description: 绑定时间 }
      # 注意：external_id（openid）与 union_id 属于渠道敏感标识，一律不对外返回

    AddressInput:
      type: object
      required: [receiver_name, phone, province, city, district, detail]
      properties:
        receiver_name: { type: string, maxLength: 32 }
        phone:         { type: string }
        province:      { type: string }
        city:          { type: string }
        district:      { type: string }
        street:        { type: string, default: '' }
        detail:        { type: string, maxLength: 200, description: 门牌号等 }
        region_code:
          type: string
          description: |
            行政区划码。比省市区三个字符串可靠 ——「内蒙古」与「内蒙古自治区」
            是同一个地方，但字符串匹配不出来，而运费模板与偏远地区判定都按区划做。
        postal_code:   { type: string }
        tag:
          type: integer
          description: '0 无 / 1 家 / 2 公司 / 3 学校'
          enum: [0, 1, 2, 3]
          default: 0
        is_default:
          type: boolean
          default: false
          description: |
            仅在**新增**时有效（服务端同事务内先清旧默认再置新）。
            后续切换默认地址请用 `PUT /addresses/{address_id}/default`。

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, is_default]
          properties:
            id: { type: integer, format: int64 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    # ---- 优惠券 ----
    UserCoupon:
      type: object
      required: [id, coupon_code, coupon_type, status]
      properties:
        id:          { type: integer, format: int64 }
        coupon_code: { type: string }
        name:        { type: string }
        coupon_type:
          type: integer
          description: '1满减 2折扣 3立减 4包邮'
          enum: [1, 2, 3, 4]
        threshold_cents: { $ref: '#/components/schemas/Money' }
        discount_cents:  { $ref: '#/components/schemas/Money' }
        discount_rate:
          type: integer
          description: 千分比，850 = 8.5 折
        max_discount_cents: { $ref: '#/components/schemas/Money' }
        status:
          type: integer
          description: '1未使用 2锁定 3已使用 4已过期'
          enum: [1, 2, 3, 4]
        valid_start_at: { type: string, format: date-time }
        valid_end_at:   { type: string, format: date-time }

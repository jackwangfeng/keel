# 自研推理引擎 infero 的叠加层。
#
#     ./scripts/infero-up.sh                                  # 先在宿主机起引擎
#     docker compose -f compose.yaml -f compose.infero.yaml up -d
#
# ## 这个叠加层里**没有 inference 服务**，这是刻意的
#
# 它只做一件事：把 app 的 KEEL_EMBED_ENDPOINT 指到宿主机上那个 infero 进程。
# 引擎本身跑在 compose 之外，理由完整写在 scripts/infero-up.sh 的文件头，
# 摘要是显存账：infero 是 GPU-only，一块卡同时只装得下一份，而本机这块
# RTX A4000 还分给另外两个项目；容器化换来的只有「一条命令起全栈」，
# 代价是 2–3 GB 的 CUDA 基础镜像、GPU 透传，以及把 infero 那套 dlopen 的
# CUDA 用户态库也一起挂进去。不值。
#
# **代价是真的：`docker compose up` 不再能一条命令起全栈。** 不先跑
# infero-up.sh 的话，栈照样起得来，只是 /search 走纯关键词降级路径
# （语义检索层 §8）—— 不报错，只是没有语义召回。README 的
# 「还没在盒子里的」那一节记着这条。
#
# ## 没有 GPU 的机器怎么办：CPU 后端已经达标，只是还没进这个叠加层
#
# infero 2026-09-26 起有了 CPU 后端（--features cpu），首版单线程、单条约 5 秒撑不起 Keel；
# infero `cb0ccbd`（2026-09-29，并行化 GEMM、常驻 F32 权重缓存、attention 并行）之后，
# 本机 20 核空闲实测单条 117 ms 中位数、64 条一批 2.68 s，三条门槛全过、数值与 GPU 一致
# （实测见 docs/电商系统-总体架构.md §1「那个缺口」）。**没有卡的机器现在可以选择
# 源码编译并跑 infero 的 CPU 版**（`cargo build --release -p infero-server
# --no-default-features --features cpu`），把 KEEL_EMBED_ENDPOINT 指过去即可，
# 编译与启动步骤见 docs/指南/部署与配置.md「没有 GPU」一节。CPU 形态要给它留够核
# （建议 4–8 核以上）。这个仓库不为无 GPU 场景维护第二个推理引擎实现 —— M3 那个
# 跑 BGE-M3 的 Python 服务已经退役，CPU 路也走同一个 infero 二进制，只是编译开关不同。
# 目前它是源码编译的裸二进制、以宿主机进程运行，**还没有进这个 compose 叠加层**：
# infero 的 Dockerfile 还没写，容器形态待它落地后再加一条 CPU 服务定义。不配置引擎、
# 直接 `docker compose up` 仍然可用，只是 /search 走关键词那一路。
#
# ## ⚠️ 换引擎 / 换模型要重算全库
#
# product_text_vectors 的每一行都记着 model_name / model_version。引擎报的
# 模型名一变（M4 那次是 'bge-m3' → 'Qwen3-Embedding-0'），库里的存量行就与
# 新算的查询向量不在同一个空间里 —— 维度一样，Postgres 一个字都不会报，
# 检索照常返回结果，只是结果没有意义。增量索引任务会按 model_name 把它们判成
# 待重算并逐轮追上；要立刻切干净就跑一次全量回填：
#
#     docker compose exec app /keel-index -force
#
name: keel

services:
  app:
    environment:
      # 引擎地址。**客户端没有默认值，空着就拒绝构造**（见 internal/inference
      # 的 EnvEndpoint），理由与 KEEL_DTM_DSN 同构：一个「反正能跑起来」的
      # 默认值，会让忘了配它的部署每次索引都连不上，而索引是异步的——
      # 没有人在等它的返回码，症状是几小时后的「新品怎么搜不到」。
      #
      # host.docker.internal 是容器访问**宿主机**的名字。Linux 上它不是天生
      # 就有的，靠下面 extra_hosts 那条 host-gateway 注进来。
      #
      # ⚠️ 不要图省事写成 172.17.0.1。那是**默认 bridge** 网络的网关，而
      # compose 给每个 project 建的是自己的网络（本机实测 keel 这个 project
      # 拿到的是 192.168.16.1），网段是动态分配的。写死任何一个都会在别的机器
      # 上、或者同一台机器换个 project 名之后连不上。host-gateway 是 Docker
      # 自己解析的，这两种情况都对。
      KEEL_EMBED_ENDPOINT: http://host.docker.internal:${KEEL_INFERO_PORT:-18081}
    extra_hosts:
      # Linux 上 host.docker.internal 要显式映射（macOS/Windows 的 Docker
      # Desktop 自带）。host-gateway 这个特殊值由 Docker 解析成宿主机地址。
      - "host.docker.internal:host-gateway"
    # 刻意**不加** depends_on。
    #
    # Python 那条腿里 app 是 `depends_on: inference: service_healthy` 的：
    # 引擎没 ready 就开始接请求的话，第一批索引全部失败，而它们是异步的、
    # 失败了没人看见。这里做不到同一件事 —— 引擎根本不是 compose 管的对象，
    # compose 没有办法等一个它不认识的进程。
    #
    # 后果说清楚：先 up、后起引擎的话，中间这段时间里索引任务每轮都会
    # connection refused。它**不会把坏值写进库**（客户端把连不上归成
    # ErrUnavailable，一个向量都不返回，见 internal/inference 的三条错误分类），
    # 下一轮就会自己追上。代价是这段时间里新品搜不到，日志里是 WARN。

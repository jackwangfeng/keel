# 商家后台的 nginx。两件事：托管静态产物、把 /api 反代给 app。
#
# 反代过来之后浏览器看到的是同源，于是**不需要 CORS**。理由写在
# docker/Dockerfile.admin 的文件头。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用的回落。
    #
    # 没有这一行，刷新 /products 会得到 404 —— 因为磁盘上没有那个文件，
    # 路由是浏览器里的 vue-router 解析的。这也是 src/router/index.ts 敢用
    # createWebHistory（而不是 hash 路由）的前提。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # app 是 compose 服务名，由 compose 的内部 DNS 解析。
        # 末尾**不带**斜杠：带了的话 nginx 会把 location 的前缀剥掉，
        # 于是 /api/v1/products 会变成 /v1/products 打到 app 上 —— 404，
        # 而且症状指向「后台写错了路径」，与真因隔着一层。
        proxy_pass http://app:8080;

        proxy_http_version 1.1;

        # Host 原样透传。单商家形态下（compose.yaml 的 KEEL_DEFAULT_MERCHANT=demo）
        # Host 完全不参与解析；但多商家形态是**按 Host 解析租户**的
        # （compose.multi.yaml），改写成固定值会让后台永远落在同一家店上。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ app 的 /search 限流按 RemoteIP() 计（gin 默认不信任代理，
        # 理由写在 compose.yaml 里）。也就是说经过这个反代的请求，
        # 在限流看来全部来自 nginx 这一个 IP。后台自己不打 /search，
        # 所以今天没有影响；哪天后台要用检索，这条要先解决。

        # 商品图单文件上限 10 MB（服务端回 413）。这里给 12 MB，
        # 留出 multipart 的 boundary 与表单字段开销 —— 卡在 10 MB 整的话，
        # 一个 9.9 MB 的合法图片会被 nginx 先拦下，而它回的是一个
        # **不是 Problem 的 HTML 413**，界面只能显示「响应体不是契约里的 Problem」，
        # 一条指向错误方向的症状。让服务端去判，它的 413 才带 type。
        client_max_body_size 12m;

        # 上传大图时别让代理提前超时。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 静态资源带 hash 文件名（vite 的产物），可以长缓存；
    # index.html 不能 —— 缓存住它等于把新版本挡在门外。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

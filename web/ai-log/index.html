<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 经营日志</title>
<!--
  公开的 AI 经营日志（AI 经营 M11，docs/AI经营-M10M11设计.md §8）。纯静态页，读同源的 GET /api/v1/ai-log。
  店铺没开「公开 AI 经营日志」时接口回 404，这里显示「未公开」。所有文字用 textContent 写入（简报是 AI 写的，不可信）。
-->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e5e7eb; --pos:#15803d; --neg:#b91c1c; --neu:#6b7280; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e6e8eb; --mute:#9aa1ab; --line:#262b35; --pos:#4ade80; --neg:#f87171; --neu:#9aa1ab; --acc:#60a5fa; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif }
  main { max-width:880px; margin:0 auto; padding:24px 16px 48px }
  h1 { font-size:22px; margin:0 0 4px } .sub { color:var(--mute); margin:0 0 20px }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:24px }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px }
  .stat b { display:block; font-size:22px } .stat span { color:var(--mute); font-size:13px }
  h2 { font-size:17px; margin:28px 0 10px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px }
  .meta { color:var(--mute); font-size:13px } .excerpt { white-space:pre-wrap; margin-top:6px }
  .row { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap }
  .tag { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; white-space:nowrap }
  .pos { color:var(--pos); border-color:currentColor } .neg { color:var(--neg); border-color:currentColor } .neu { color:var(--neu) }
  .auto { color:var(--acc); border-color:currentColor }
  .title { flex:1 1 320px; min-width:0 }
  .empty { color:var(--mute); padding:32px 0; text-align:center }
</style>
</head>
<body>
<main>
  <h1>AI 经营日志</h1>
  <p class="sub">这家店的「AI 员工」每天巡店、写简报、提建议；写操作要么由店长批准，要么在店长设好的上限内自动执行。执行后 Keel 自己复盘效果。</p>
  <div id="app"><p class="empty">加载中…</p></div>
</main>
<script>
(function () {
  var app = document.getElementById('app');
  var KIND = { inventory_adjust: '加库存', flash_price: '限时折扣', coupon: '发券', product_copy: '改文案', refund_decision: '售后审核' };
  var STATUS = { 10: '待处理', 15: '执行中', 20: '已执行', 30: '已驳回', 40: '执行失败', 50: '已过期' };
  var VERDICT = { positive: ['效果好', 'pos'], neutral: ['效果一般', 'neu'], negative: ['效果差', 'neg'] };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function day(s) { var d = new Date(s); return isNaN(d) ? s : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  fetch('/api/v1/ai-log', { headers: { Accept: 'application/json' } }).then(function (r) {
    if (r.status === 404) { app.replaceChildren(el('p', 'empty', '这家店还没有公开 AI 经营日志。')); return null; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (d) {
    if (!d) return;
    app.replaceChildren();
    var s = d.summary, stats = el('div', 'stats');
    [['近 30 天提案', s.proposed], ['已执行', s.executed], ['其中自动执行', s.auto_executed], ['被驳回', s.rejected],
     ['复盘效果好', s.positive], ['复盘效果差', s.negative]].forEach(function (x) {
      var c = el('div', 'stat'); c.append(el('b', null, String(x[1])), el('span', null, x[0])); stats.append(c);
    });
    app.append(stats, el('h2', null, '最近的提案'));
    if (!d.proposals.length) app.append(el('p', 'empty', '还没有提案。'));
    d.proposals.forEach(function (p) {
      var c = el('div', 'card'), row = el('div', 'row');
      row.append(el('span', 'tag', KIND[p.kind] || p.kind), el('span', 'title', p.title), el('span', 'tag', STATUS[p.status] || String(p.status)));
      if (p.auto_approved) row.append(el('span', 'tag auto', '自动执行'));
      if (p.verdict && VERDICT[p.verdict]) row.append(el('span', 'tag ' + VERDICT[p.verdict][1], VERDICT[p.verdict][0]));
      c.append(row, el('div', 'meta', p.agent_name + ' · ' + day(p.created_at)));
      app.append(c);
    });
    app.append(el('h2', null, '最近的简报'));
    if (!d.briefs.length) app.append(el('p', 'empty', '还没有简报。'));
    d.briefs.forEach(function (b) {
      var c = el('div', 'card');
      // 更正：旧的原样保留，标「已更正」；更正的那份标它更正了哪一份（00141）。
      var tag = b.corrected_by_brief_id ? '〔已更正，见 #' + b.corrected_by_brief_id + '〕 ' :
        b.corrects_brief_id ? '〔更正 #' + b.corrects_brief_id + '〕 ' : '';
      c.append(el('div', null, '#' + b.id + ' ' + tag + b.title), el('div', 'meta', b.agent_name + ' · 覆盖 ' + b.period_start + (b.period_end !== b.period_start ? ' 至 ' + b.period_end : '') + ' · ' + day(b.created_at)),
        el('div', 'excerpt', b.excerpt + (b.excerpt.length >= 300 ? '…' : '')));
      app.append(c);
    });
  }).catch(function (e) { app.replaceChildren(el('p', 'empty', '加载失败：' + e.message)); });
})();
</script>
</body>
</html>

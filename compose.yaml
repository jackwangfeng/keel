# 一条命令起全栈：`docker compose up`。
#
# 起来之后有两个入口：
#   · 买家侧 API   http://localhost:8080/api/v1/products （KEEL_HTTP_PORT 可换）
#   · 商家后台界面 http://localhost:8081                 （KEEL_CONSOLE_PORT 可换）
# 第一次进后台要一串引导 token，它明文打在 app 的日志里：
#   docker compose logs app | grep bootstrap_token
#
# 默认形态是**单商家**：一个数据库、一次迁移、一份只播一家店的种子、一个应用进程。
# 这正是 README 承诺给小商家的那个形态 —— 起来之后 `curl localhost:8080/api/v1/products`
# 直接有商品，请求里不需要出现任何和「租户」有关的东西。
# `scripts/smoke.sh` 跑的就是这条链路。
#
# 想要多商家形态（6 家种子商家 + 按 Host 解析）：
#     docker compose -f compose.yaml -f compose.multi.yaml up -d --build
# 那个叠加层用自己的数据卷，两种形态可以随便来回切，不需要 `docker compose down -v`
# —— 理由写在 compose.multi.yaml 里（共用卷时 single → multi 这个方向会静默出错）。
#
# 判据永远是 smoke 的退出码，不是 `up` 的：`docker compose up -d` 只等到容器**启动**，
# 应用随后因为自检不过而退出，它照样返回 0。
name: keel

services:
  postgres:
    # 自建镜像 docker/postgres/Dockerfile：PostGIS 与 pgvector 要在同一个库里。
    #
    # 这一条**推翻了**下面那段原先写在这里的论证（「用官方 pgvector 镜像而不是
    # 自己 build」）。推翻的理由只有一条，但它是硬的：**没有一个官方镜像同时带
    # PostGIS 与 pgvector**。两个上游各发各的，pgvector/pgvector:pg16 没有
    # PostGIS，postgis/postgis:16-3.4 没有 pgvector。而 00020 的电子围栏是
    # GEOGRAPHY(POLYGON, 4326)，判定要 ST_Intersects 与 GIST 索引 ——
    # 那是一条真依赖，不是偏好（数据模型 §4 论证过为什么不是「圆心 + 半径」）。
    #
    # 原先那三条判据逐条重算（数据模型 §4「数据库镜像」那一节有完整的表）：
    #   · 有没有现成的官方镜像：当时有，现在**没有**。这一条翻了，别的都从它派生。
    #   · 体积：438 MB → 648 MB（实测）。多出来的约 210 MB 是 GEOS / PROJ / GDAL。
    #   · 构建代价：多一次 docker build，本机实测约 60 秒（apt 占大头），
    #     之后走层缓存。
    #   · 可信度不变：底座是官方 postgres:16-bookworm，PostGIS 与 pgvector
    #     都来自 PGDG 官方 apt 源（apt.postgresql.org）。
    #
    # **底座换过一次**：第一版是 postgis/postgis:16-3.4，它是 Debian 11
    # bullseye（glibc 2.31），而旧 pgvector 镜像是 bookworm（glibc 2.36）。
    # 挂着旧卷换上去，PostgreSQL 当场报排序规则版本不匹配 —— 那是文本索引
    # 静默失效的前兆；而且 bullseye 在 2026-06-30 已经完全停止支持。
    # 完整经过写在 docker/postgres/Dockerfile 的文件头。
    #
    # **最要紧的一行**：实测 PostgreSQL 16.15 / vector 0.8.6 / postgis 3.6.4，
    # glibc 2.36-9+deb12u14。其中 PG、vector 与 glibc 三项和换之前的
    # pgvector/pgvector:pg16 逐项一致 —— glibc 那一项是第一版漏掉的，
    # 它决定了旧数据卷挂上来之后索引还能不能信。
    #
    # 00016 那条 `CREATE EXTENSION IF NOT EXISTS vector` 报错时的症状照旧：
    # `up -d` 只等到容器启动就返回 0，app 因为 depends_on 根本不起，
    # 读者看到的是「curl 连不上 8080」，而真因埋在 `logs migrate` 里。
    #
    # **不走 GHCR。** 数据模型 §4 当时倾向「预先 push 一个标签」，理由是
    # 「CI 与开发机都得先 build 一次」这条代价是真的。落地时否掉了：推 GHCR 要
    # 一条发布 workflow、一份 packages:write 权限、以及一个此刻并不存在的凭据，
    # 而换来的是让仓库的测试基建依赖一个**仓库之外的可变产物** ——
    # 构建脚本就在仓库里，多那 90 秒买的是「谁 clone 下来跑的都是同一个东西」。
    # 真要推 GHCR，那是一次单独的、带发布流程的改动，不是这一轮顺手做掉的事。
    build:
      context: docker/postgres
    # 显式钉一个本地标签：下面 seed 那个服务要用同一个镜像跑 psql，
    # 而它只能写 image: 不能写 build:（写 build: 会让 compose 建两遍）。
    image: keel-postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: ${KEEL_ADMIN_PASSWORD:-keel}
      POSTGRES_DB: keel
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 刻意不往宿主机映射端口。开发机上 5432 被别的东西占着是常事，而为了一个
    # 谁都不必用到的端口让 `docker compose up` 直接失败，代价和收益完全不成比例。
    # 要用 psql 连进去看的话，加一行 `ports: ["5432:5432"]`，或者
    # `docker compose exec postgres psql -U keel keel`。
    healthcheck:
      # -h 127.0.0.1 是防御性的，不是对某次故障的复盘：官方镜像在 initdb 期间会先起
      # 一个**只听 unix socket** 的临时服务器来建库建角色，而不带 -h 的 pg_isready
      # 走的正是 socket。本机没有复现出它在那个窗口里报 ready（镜像自己也做了防护），
      # 但「健康」这个词该和下游真正需要的东西是同一件事——下游要的是 TCP 连得上。
      # 真踩上的话症状是 migrate 在第一次连接就 connection refused 退出，
      # 报错指向迁移，而真因在上一个服务的健康定义里。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U keel -d keel"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 迁移。跑完即退出，应用等它成功。
  #
  # 用管理员角色 keel 连：建表、建 keel_app 角色、授权都要属主权限。
  # 这是除了 `make migrate` 之外唯一该用这个角色的地方。
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
      args:
        GOPROXY: ${GOPROXY:-}
    environment:
      GOOSE_DBSTRING: postgres://keel:${KEEL_ADMIN_PASSWORD:-keel}@postgres:5432/keel?sslmode=disable
      # 00003 建 keel_app 时用它设口令，下面 app 用同一个变量连库 —— 一处定义，
      # 两处引用。分别写死两个字面量的话，改了一边就是「应用连不上库」，
      # 而迁移与应用各自都看着没错。
      # 口令只在角色**首次创建**时设置（见 00003 的注释），轮换要走单独的运维操作。
      KEEL_APP_PASSWORD: ${KEEL_APP_PASSWORD:-keel_app}
    depends_on:
      postgres:
        condition: service_healthy

  # 种子。默认加载只有一家店的 single.sql，理由写在那个文件的开头。
  #
  # 用上面那个数据库镜像跑 psql，而不是在迁移器镜像里再塞一个客户端：
  # 那个镜像是 scratch + goose，没有 shell 也没有 psql；而这个镜像上面已经建
  # 出来了，psql 是它自带的。**镜像名要和 postgres 服务保持一致**——写死
  # postgres:16 的话，只为了一个 psql 客户端就要多拉一整个官方镜像，
  # 而且两个镜像的客户端版本会各自漂移。这里写的是 postgres 服务那个
  # build 出来的本地标签 keel-postgres:16，compose 按依赖顺序先建它。ON_ERROR_STOP=1 不能省 —— 没有它，
  # psql 遇到报错会接着往下跑，最后以 0 退出，于是「种子加载失败」会表现为
  # 「商品列表是空的」，一个指向错误方向的症状。
  seed:
    # build 与 image 都写，且与 postgres 服务**逐字相同**。
    #
    # 只写 image 的话，`docker compose up`（不带 --build）会在本地没有这个标签时
    # 去 registry 拉一个根本不存在的镜像然后失败 —— 而失败的是 seed，
    # 报错指向「拉不到镜像」，真因却是「postgres 那个 build 还没跑」。
    # 两处都写之后这是同一次构建：第二次命中层缓存，实测零秒。
    build:
      context: docker/postgres
    image: keel-postgres:16
    environment:
      PGPASSWORD: ${KEEL_ADMIN_PASSWORD:-keel}
    volumes:
      - ./db/seed:/seed:ro
      # 种子商品图要写进与 app 共用的上传目录（db/seed/seed-images.sh）。
      - uploads:/uploads
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U keel -d keel -f /seed/single.sql
      && sh /seed/seed-images.sh"
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
      args:
        GOPROXY: ${GOPROXY:-}
        # 版本号透传。不传就是 "dev"（internal/buildinfo 的默认值），
        # 本地 `docker compose build` 因此不会冒充某一版。
        # 打版本时：`KEEL_VERSION=v0.1.0 docker compose build app`。
        KEEL_VERSION: ${KEEL_VERSION:-dev}
        KEEL_COMMIT: ${KEEL_COMMIT:-}
        KEEL_DATE: ${KEEL_DATE:-}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: keel
      # 应用连 keel_app，不连 keel。超级用户无条件绕过行级安全，FORCE 也拦不住——
      # 用 keel 连上来，00002 里的租户隔离就是一张废纸。internal/db.NewPool 会在
      # 每条物理连接建立时查 rolsuper/rolbypassrls，发现能绕过就拒绝启动。
      PGUSER: keel_app
      PGPASSWORD: ${KEEL_APP_PASSWORD:-keel_app}
      # 单商家部署：Host 完全不参与解析，所有请求都属于这家店。
      # 它必须和 db/seed/single.sql 播的那家 code 一致，而且库里只能有这一家活跃商家——
      # 两条都由 tenant.Preflight 在启动时查，对不上就拒绝启动而不是猜。
      KEEL_DEFAULT_MERCHANT: demo
      # 嵌入式事务协调器自己的存储。**没有默认值，不配就拒绝启动**（见
      # internal/app 里 EnvDTMDSN 的注释）：它存的是「哪些全局事务还没跑完」，
      # 这份状态丢了，正向阶段已经扣掉的库存与已经核销的券就再也没人回补。
      #
      # 单机形态用 sqlite，落在下面那个具名卷上。**不能**复用业务库那份连接：
      # 协调器启动时要建自己的三张表（trans_global / trans_branch_op /
      # auth_token），keel_app 没有建表权限（实测报 permission denied for
      # schema public），而换管理员角色会让应用握着能绕过 RLS 的凭据。
      #
      # 多实例形态（架构 §6 形态 B/C）必须换成 Postgres/MySQL/Redis 并给它
      # 自己的角色 —— sqlite 撑不住多实例并发写，dtmrs 自己的部署文档写明了。
      KEEL_DTM_DSN: sqlite:/var/lib/keel/dtm.db
      # 买家令牌的 HMAC 签名密钥。**这里刻意不给默认值，留空是有意的。**
      #
      # 给一个默认值的后果比「没配」严重得多：每一份照着这个 compose 起的部署
      # 都会用同一个密钥，于是任何人都能给任何一家店签出一串合法的令牌 ——
      # 一个写在公开仓库里的默认密钥，等于整套鉴权不存在。
      #
      # 留空时应用会**随机取一个**并打一条 WARN（见 internal/app 的
      # EnvAuthSecret）。代价是：进程一重启全体买家被登出一次；多实例部署下
      # 各实例的密钥不同，症状是「刷新几次页面就要重新登录」。
      # 本地演示这两条都无所谓，真在服务客人的部署请显式配置：
      #   KEEL_AUTH_SECRET=$(openssl rand -base64 48) docker compose up -d
      KEEL_AUTH_SECRET: ${KEEL_AUTH_SECRET:-}

      # 上传文件（商品图、头像、退款凭证）的本地磁盘根目录，挂在下面的 uploads 卷上。
      # 不配的话应用会落到容器的临时目录并打 WARN —— 容器一重建，已上架商品的图
      # 就全没了，而 uploads 表里的记录还指着它们。v0.1.0 的 compose 就漏了这一行。
      KEEL_UPLOAD_ROOT: /var/lib/keel-uploads

      # /search 的按 IP 限流。它不是防 DDoS 的，是防「一条 for 循环把公开
      # Demo 的语义搜索变成关键词搜索」——每个检索请求都要跑一次模型推理，
      # 实测 20 个并发的长查询就能让同时进来的正常查询全部降级。M4 换成 GPU
      # 之后这条曲线整体右移（拐点从「8 个就塌」变成「16 个才贴线」），
      # 默认值跟着重算过一遍，推导记在 ratelimit.go 的文件头「二之二」。
      #
      # 默认值在 internal/app 里（不在这里写死，否则改默认值要改两处）。
      # 调大它之前先想清楚：放行更多请求不会让它们更快，只会让更多人一起慢。
      # 真正对症的是给引擎调用加全局并发上限，那条记在 ratelimit.go 的文件头。
      KEEL_SEARCH_RATE_PER_SEC: ${KEEL_SEARCH_RATE_PER_SEC:-}
      KEEL_SEARCH_RATE_BURST: ${KEEL_SEARCH_RATE_BURST:-}

      # 限流按真实客户端 IP 计，但 X-Forwarded-For / X-Real-IP 只在连接来自
      # KEEL_TRUSTED_PROXIES 名单（逗号分隔的 IP / CIDR）里的代理时才采信。
      # 不配就一个都不信 —— 裸跑时那两个头等于「攻击者自己说他是谁」。
      # 放在反向代理后面时必须配，否则全部访客算到代理那一个 IP 上、共用一份配额。
      # 只写真正会覆写 / 追加这两个头的代理，别写 0.0.0.0/0。
      KEEL_TRUSTED_PROXIES: ${KEEL_TRUSTED_PROXIES:-}
      # 不参与口令失败锁定的手机号（逗号分隔）。只给把一个买家号公开给所有人用的演示环境，正式环境不要配。
      KEEL_LOGIN_LOCK_EXEMPT_PHONES: ${KEEL_LOGIN_LOCK_EXEMPT_PHONES:-}
      # 地图服务商（POI 选址，/geo/*）：amap + 高德 Web 服务 key。不配时 /geo/* 回 501，客户端退回手填。
      KEEL_GEO_PROVIDER: ${KEEL_GEO_PROVIDER:-}
      KEEL_GEO_KEY: ${KEEL_GEO_KEY:-}
      # 地图底图（/geo/map、/geo/tiles）：tianditu + 天地图「浏览器端」key + 站点地址（与 key 的域名白名单一致，
      # 代理取瓦片时带作 Referer）；osm 只给开发自测。
      # 不配时客户端不显示地图（买家端没有地图选点，后台退回手填坐标）。
      KEEL_MAP_TILES: ${KEEL_MAP_TILES:-}
      KEEL_TIANDITU_KEY: ${KEEL_TIANDITU_KEY:-}
      KEEL_TIANDITU_REFERER: ${KEEL_TIANDITU_REFERER:-}
      # 瓦片请求专用的出口代理（国内服务器直连 OpenStreetMap 不通时用），只影响 /geo/tiles。
      KEEL_TILE_PROXY: ${KEEL_TILE_PROXY:-}
      # 判别模型引擎（/v1/systemone）：配了就在后台给热词做相关度预判（service/search_judge.go），不配检索只按余弦下限。
      # 令牌只从环境变量来，不写进任何文件。
      KEEL_SYSTEMONE_ENDPOINT: ${KEEL_SYSTEMONE_ENDPOINT:-}
      KEEL_SYSTEMONE_TOKEN: ${KEEL_SYSTEMONE_TOKEN:-}
      # 渠道适配层（Shopify / 美团 / 饿了么……）的进程开关，默认关：关着时没有任何渠道路由、分支与后台任务。
      # 拆分部署时 core 与库存服务要配同一个值（compose.split.yaml 给库存服务透传）。
      KEEL_CHANNELS: ${KEEL_CHANNELS:-}
      # 连接池上限：业务池（默认 max(4, CPU 核数)）与事务协调器的池（默认 32）。
      # 多实例共用一个 Postgres 时按「实例数 × 两者之和 + 余量 < max_connections」配，见部署指南。
      KEEL_DB_MAX_CONNS: ${KEEL_DB_MAX_CONNS:-}
      DTMRS_DB_POOL: ${DTMRS_DB_POOL:-}
      # 拆分部署（docs/电商系统-微服务拆分方案.md）。全空 = 今天的单体，本文件不需要它们；
      # 透传只是为了让同一份 compose 能试跑拆分形态的配置。含义见部署指南的环境变量表。
      KEEL_ROLE: ${KEEL_ROLE:-}
      KEEL_INVENTORY_DSN: ${KEEL_INVENTORY_DSN:-}
      KEEL_INTERNAL_ADDR: ${KEEL_INTERNAL_ADDR:-}
      KEEL_INTERNAL_SECRET: ${KEEL_INTERNAL_SECRET:-}
      # 轮换 KEEL_INTERNAL_SECRET 时用；平时为空。步骤见部署指南的环境变量表。
      KEEL_INTERNAL_SECRET_PREVIOUS: ${KEEL_INTERNAL_SECRET_PREVIOUS:-}
      KEEL_INVENTORY_URL: ${KEEL_INVENTORY_URL:-}

      # 镜像是拿来跑的，不是拿来开发的：gin 的 debug 模式会在启动时打一屏
      # 「你没有设置 release」的警告，而 `docker compose up` 的头一屏正是
      # 新人对这个项目的第一印象。它不改变任何路由行为。
      GIN_MODE: release
    volumes:
      # 协调器的 sqlite 必须活过容器重建，否则「崩溃后把未完成的事务推到终态」
      # 这条能力就是假的 —— 而它正是 SAGA 敢在正向阶段就真实扣减库存的前提。
      # 镜像里 /var/lib/keel 已经建好并且属主是 65532，Docker 建新卷时会连属主
      # 一起复制过去；路径不存在的话卷是 root 所有的，应用写不进去。
      - dtmdata:/var/lib/keel
      # 上传文件单独一个卷：它和协调器状态的生命周期、备份方式都不一样。
      # 属主问题同上，镜像里 /var/lib/keel-uploads 已经建好并属于 65532。
      - uploads:/var/lib/keel-uploads
    ports:
      # 宿主机端口可换（8080 在开发机上常被占）：`KEEL_HTTP_PORT=18080 docker compose up -d`。
      # scripts/smoke.sh 读的是同一个变量，两边不会各说各话。
      - "${KEEL_HTTP_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    # SIGTERM 之后 app 要等在途请求、停后台任务、关协调器（KEEL_SHUTDOWN_GRACE，默认 20 秒）。
    # docker stop 默认只给 10 秒就 SIGKILL，比宽限期短就等于没有宽限期，所以调长到 30 秒。
    stop_grace_period: 30s
    # 刻意不配容器级 healthcheck。
    #
    # M2 换底座之后镜像里**有** shell 了（debian:trixie-slim），但仍然没有
    # curl / wget（slim 不带），所以「在容器里发一个 HTTP 请求」这件事还是做不到。
    # 给应用二进制加一个自检子命令是可以的，但那是给应用二进制加一个自检子命令是可以的，但那是
    # 为了一个只有 compose 会看的信号去改 cmd/keel。外部的探活由 scripts/smoke.sh
    # 做（它从宿主机打 /healthz），编排系统接管时再由它自己的探针打同一个路径。

  # 商家后台（web/admin）。**跟着栈一起起来，不是「再手动 npm run dev」。**
  #
  # README 承诺的是「`docker compose up` 一条命令起全栈」，而 M4 的产出标志
  # 写着「商家可自助发布」——没有界面，那句话只对会用 curl 的人成立。
  # 所以它在这里，和 app 同级。
  #
  # 多阶段构建：node 阶段 `npm ci` + `vite build`，nginx 阶段托管产物并把
  # /api 反代给 app。于是浏览器看到的是**同源**，不需要 CORS
  # （完整论证在 docker/Dockerfile.admin 的文件头）。
  console:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      target: console
    ports:
      # 8081，不与 app 的 8080 撞。换端口：
      # `KEEL_CONSOLE_PORT=18081 docker compose up -d`。
      #
      # **变量名刻意不叫 KEEL_ADMIN_PORT**：这个文件里已经有一个
      # KEEL_ADMIN_PASSWORD，而那是**数据库超级用户**的口令，和后台界面
      # 毫无关系。两个 KEEL_ADMIN_* 挨在一起，迟早有人把后台的端口配进
      # 数据库的口令里。
      - "${KEEL_CONSOLE_PORT:-8081}:80"
    depends_on:
      # 只等 app **启动**，不等它健康 —— app 刻意没有容器级 healthcheck
      # （理由写在它自己那段）。后台先起来也无妨：nginx 把 /api 反代过去，
      # app 还没就绪时浏览器拿到 502，而登录页本身是静态的，打得开。
      app:
        condition: service_started
    # 刻意不配 healthcheck，与 app 同一个理由：外部探活由 scripts/smoke.sh 做。

volumes:
  pgdata:
  # 协调器的 sqlite。和 pgdata 一样是有状态的东西，`docker compose down -v`
  # 会连它一起删掉 —— 那之后未完成的全局事务就真的没人推了。
  dtmdata:
  # 上传的商品图等。`docker compose down -v` 同样会删掉它。
  uploads:

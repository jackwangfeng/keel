<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Keel 商城</title>
    <!--
      这段 document.write 是 uni-app 官方模板里那段：iOS 刘海屏要 viewport-fit=cover，
      而不支持 env()/constant() 的浏览器上加了反而出问题，所以按 CSS.supports 现场决定。
    -->
    <script>
      var coverSupport =
        'CSS' in window &&
        typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no' +
          (coverSupport ? ',viewport-fit=cover' : '') +
          '" />'
      )
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.uts"></script>
  </body>
</html>

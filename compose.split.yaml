# C 档：物理拆分（docs/电商系统-微服务拆分方案.md「部署档位」）。用法：
#     export KEEL_INTERNAL_SECRET=$(openssl rand -base64 48)
#     export KEEL_DTM_TOKEN=$(openssl rand -hex 24)
#     docker compose -f compose.yaml -f compose.split.yaml up -d --build
#     ./scripts/smoke.sh
#
# 与单体相比多了三样东西，代码一行不变：
#   · postgres-inventory：库存服务自己的库（keel_inventory），库存四张表只在这里有真数据；
#   · inventory：同一个镜像，KEEL_ROLE=inventory，只听内网端口 8090（不映射到宿主机）；
#   · app 换成 KEEL_ROLE=core：库存调用与下单 SAGA 的库存分支都经 http://inventory:8090。
#
# 种子怎么进库存库：seed 照旧把整份 single.sql 播进 core 库（其中的库存行落在 core 库 public 里，
# core 从来不读它们），然后 split-data 用 scripts/split-migrate.sh 把它们搬进库存库并 cutover ——
# 也就是**从单体迁到拆分用的同一个脚本**，每次起新栈都实跑一遍。已经切过的库，它直接跳过。
#
# 用自己的一套卷（与 compose.multi.yaml 同一个理由）：cutover 会收回 keel_app 对 core 库里库存表的权限，
# 共用单体的卷的话，切回单体形态时下单当场 42501。要把一个真实的单体库迁过来，照部署指南
# 「从单体迁到拆分」一节手工跑 split-migrate.sh，而不是指望这个叠加层替你迁。
#
# 事务协调器独立部署（dtmrs 服务 + 它自己的库 postgres-dtm，docs/电商系统-微服务部署方案.md）：core 与库存都只是它的客户端，
# 各自的分支挂在各自的内网端口上由它回调；库存把跨 0 通知发到主题、core 订阅，库存不知道 core 的地址。
services:
  postgres-inventory:
    build:
      context: docker/postgres
    image: keel-postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: ${KEEL_ADMIN_PASSWORD:-keel}
      POSTGRES_DB: keel_inventory
    volumes:
      - pginvdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U keel -d keel_inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 库存目录的迁移。同一个迁移器镜像，换目录与版本表。
  # 账号用 keel_inventory 而不是 keel_app：C 档两个库本来就在两个集群上，换名字不为隔离，
  # 为的是日志与 pg_stat_activity 里一眼分得清是谁连的（B 档那边换名字是必须的）。
  migrate-inventory:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
      args:
        GOPROXY: ${GOPROXY:-}
    environment:
      GOOSE_DBSTRING: postgres://keel:${KEEL_ADMIN_PASSWORD:-keel}@postgres-inventory:5432/keel_inventory?sslmode=disable
      GOOSE_MIGRATION_DIR: /db/migrations-inventory
      KEEL_INVENTORY_ROLE: keel_inventory
      KEEL_INVENTORY_PASSWORD: ${KEEL_INVENTORY_PASSWORD:-keel_inventory}
    command: ["-table", "goose_db_version_inventory", "up"]
    depends_on:
      postgres-inventory:
        condition: service_healthy

  # 把 core 库里的库存行搬进库存库并 cutover（见文件头）。
  split-data:
    image: keel-postgres:16
    environment:
      SRC_DSN: postgres://keel:${KEEL_ADMIN_PASSWORD:-keel}@postgres:5432/keel?sslmode=disable
      DST_DSN: postgres://keel:${KEEL_ADMIN_PASSWORD:-keel}@postgres-inventory:5432/keel_inventory?sslmode=disable
    volumes:
      - ./scripts/split-migrate.sh:/split-migrate.sh:ro
    command: ["sh", "-c", "sh /split-migrate.sh copy && sh /split-migrate.sh cutover"]
    depends_on:
      seed:
        condition: service_completed_successfully
      migrate-inventory:
        condition: service_completed_successfully

  inventory:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
      args:
        GOPROXY: ${GOPROXY:-}
        KEEL_VERSION: ${KEEL_VERSION:-dev}
        KEEL_COMMIT: ${KEEL_COMMIT:-}
        KEEL_DATE: ${KEEL_DATE:-}
    environment:
      KEEL_ROLE: inventory
      KEEL_INVENTORY_DSN: postgres://keel_inventory:${KEEL_INVENTORY_PASSWORD:-keel_inventory}@postgres-inventory:5432/keel_inventory?sslmode=disable
      KEEL_INTERNAL_ADDR: ":8090"
      # 独立部署的协调器（下面的 dtmrs）：库存经它把跨 0 通知发到主题 stock.zero_crossing，不知道谁在听；
      # 活动配额同步的定义随消息带来，库存不回 core 读（docs/电商系统-微服务部署方案.md 4.1）。
      # KEEL_SELF_URL 是协调器回调本服务分支（跨 0 通知的回查）用的地址，写服务名。
      KEEL_DTM_SERVER: http://dtmrs:36789
      KEEL_DTM_TOKEN: ${KEEL_DTM_TOKEN:?C 档要设 KEEL_DTM_TOKEN（协调器的令牌，openssl rand -hex 24）}
      KEEL_SELF_URL: http://inventory:8090
      KEEL_INTERNAL_SECRET: ${KEEL_INTERNAL_SECRET:?C 档要设 KEEL_INTERNAL_SECRET（openssl rand -base64 48）}
      KEEL_INTERNAL_SECRET_PREVIOUS: ${KEEL_INTERNAL_SECRET_PREVIOUS:-}
      KEEL_DB_MAX_CONNS: ${KEEL_DB_MAX_CONNS:-}
      GIN_MODE: release
    depends_on:
      split-data:
        condition: service_completed_successfully
      dtmrs:
        condition: service_started

  app:
    environment:
      KEEL_ROLE: core
      KEEL_INVENTORY_URL: http://inventory:8090
      # core 的内网端口：协调器经它回调 core 自己的分支（下单四步、配额同步的回查、跨 0 通知的接收），不映射到宿主机。
      KEEL_INTERNAL_ADDR: ":8091"
      KEEL_INTERNAL_SECRET: ${KEEL_INTERNAL_SECRET:?C 档要设 KEEL_INTERNAL_SECRET（openssl rand -base64 48）}
      KEEL_INTERNAL_SECRET_PREVIOUS: ${KEEL_INTERNAL_SECRET_PREVIOUS:-}
      # 微服务形态不嵌协调器：清掉 compose.yaml 里单体用的 KEEL_DTM_DSN，改连独立部署的 dtmrs。
      KEEL_DTM_DSN: ""
      KEEL_DTM_SERVER: http://dtmrs:36789
      KEEL_DTM_TOKEN: ${KEEL_DTM_TOKEN:?C 档要设 KEEL_DTM_TOKEN（协调器的令牌，openssl rand -hex 24）}
      KEEL_SELF_URL: http://app:8091
    depends_on:
      split-data:
        condition: service_completed_successfully
      # 只等启动：库存服务暂时不在时 core 照样能起，读接口按降级处理，下单的 SAGA 重试到它回来。
      inventory:
        condition: service_started
      dtmrs:
        condition: service_started

  # 独立部署的事务协调器（docs/电商系统-微服务部署方案.md）。无状态：事务、租约、主题订阅都在 postgres-dtm 里，
  # 挂了重启即可，没推完的事务租约到期后接着推；要滚动升级不停服就多开一个实例（同一个库）。
  # 管理台在 http://dtmrs:36789/（只在内网，不映射端口）。
  dtmrs:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dtmrs-server
    image: keel-dtmrs:${KEEL_VERSION:-dev}
    environment:
      DTMRS_DB: postgres://keel:${KEEL_ADMIN_PASSWORD:-keel}@postgres-dtm:5432/dtmrs
      DTMRS_AUTH_TOKEN: ${KEEL_DTM_TOKEN:?C 档要设 KEEL_DTM_TOKEN（协调器的令牌，openssl rand -hex 24）}
    depends_on:
      postgres-dtm:
        condition: service_healthy
    restart: unless-stopped

  # 协调器自己的库。compose 里单独一个容器只是为了起得简单；生产上放在业务库同一套 Postgres 主备上、
  # 用不同的库和账号即可（部署方案第九节）。
  postgres-dtm:
    image: keel-postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: ${KEEL_ADMIN_PASSWORD:-keel}
      POSTGRES_DB: dtmrs
    volumes:
      - pgdtmdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U keel -d dtmrs"]
      interval: 2s
      timeout: 3s
      retries: 30

# 卷名：`<项目名>_<卷>_split`。后缀与单体形态的卷错开（同一个项目名下不串库）；
# 前缀用 `${COMPOSE_PROJECT_NAME}` 让 `-p` 不同的两套栈互不共用（显式 `name:` 不会自动加项目名，
# 写成字面量 `keel_` 时两套栈挂的是同一批卷）。默认项目名下仍是 `keel_<卷>_split`。
# 想沿用单体的卷原地迁过来（演示站就是），在自己的叠加层里把 name 改回去。
volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME}_pgdata_split
  dtmdata:
    name: ${COMPOSE_PROJECT_NAME}_dtmdata_split
  uploads:
    name: ${COMPOSE_PROJECT_NAME}_uploads_split
  pginvdata:
    name: ${COMPOSE_PROJECT_NAME}_pginvdata_split
  pgdtmdata:
    name: ${COMPOSE_PROJECT_NAME}_pgdtmdata_split
